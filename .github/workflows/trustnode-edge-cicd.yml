name: Trustnode Edge CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - "Trustnode_edge_app/**"
      - ".github/workflows/trustnode-edge-cicd.yml"
  workflow_dispatch:

env:
  PROJECT_DIR: Trustnode_edge_app
  WEB_OUT_DIR: Trustnode_edge_app/web_cloud_readonly
  VPS_APP_ROOT: /opt/trustnode-edge/app
  VPS_WEB_ROOT: /var/www/trustnode
  BACKEND_SERVICE: trustnode-backend

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            Trustnode_edge_app/frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Trustnode_edge_app/backend/requirements.txt

      - name: Backend syntax check
        run: |
          python -m py_compile Trustnode_edge_app/backend/app/routers/app_store.py
          python -m py_compile Trustnode_edge_app/backend/app/routers/auth.py
          python -m py_compile Trustnode_edge_app/backend/app/routers/control_plane.py
          python -m py_compile Trustnode_edge_app/backend/app/services/app_store.py
          python -m py_compile Trustnode_edge_app/backend/app/services/control_plane_store.py
          python -m py_compile Trustnode_edge_app/backend/app/tenant.py
          python -m py_compile Trustnode_edge_app/backend/app/main.py

      - name: Build cloud web bundle
        shell: pwsh
        run: |
          $cloudApi = "${{ secrets.TRUSTNODE_CLOUD_API_URL }}"
          if (-not $cloudApi) { $cloudApi = "https://trustnode.lsapps.app" }
          pwsh -NoProfile -ExecutionPolicy Bypass -File "./Trustnode_edge_app/scripts/build-web-cloud-readonly.ps1" -CloudApiUrl $cloudApi -BasePath "/"

      - name: Add client test pages
        run: |
          mkdir -p Trustnode_edge_app/web_cloud_readonly/client
          cp Trustnode_edge_app/client_page_tests/client_test.html Trustnode_edge_app/web_cloud_readonly/client/client_test.html
          cp Trustnode_edge_app/client_page_tests/client_test.php Trustnode_edge_app/web_cloud_readonly/client/client_test.php
          cp Trustnode_edge_app/client_page_tests/client_test_db_rest.html Trustnode_edge_app/web_cloud_readonly/client/client_test_db_rest.html
          cp Trustnode_edge_app/client_page_tests/client_test_db_php.html Trustnode_edge_app/web_cloud_readonly/client/client_test_db_php.html
          cp Trustnode_edge_app/client_page_tests/client_test_db.php Trustnode_edge_app/web_cloud_readonly/client/client_test_db.php

      - name: Validate web bundle wiring
        run: |
          test -f Trustnode_edge_app/web_cloud_readonly/index.html
          test -f Trustnode_edge_app/web_cloud_readonly/client/client_test.html
          test -f Trustnode_edge_app/web_cloud_readonly/client/client_test.php
          test -f Trustnode_edge_app/web_cloud_readonly/client/client_test_db_rest.html
          test -f Trustnode_edge_app/web_cloud_readonly/client/client_test_db_php.html
          js_file="$(grep -o 'assets/index-[^"]*\.js' Trustnode_edge_app/web_cloud_readonly/index.html | head -n1)"
          test -n "$js_file"
          test -f "Trustnode_edge_app/web_cloud_readonly/$js_file"
          grep -q "/api/app-store/live" "Trustnode_edge_app/web_cloud_readonly/$js_file"

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web_cloud_readonly
          path: Trustnode_edge_app/web_cloud_readonly
          if-no-files-found: error

  deploy-vps:
    runs-on: ubuntu-latest
    needs: build-and-test
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Evaluate deploy readiness
        id: gate
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Missing VPS_HOST or VPS_USER, skipping deploy."
          elif [ -z "$VPS_SSH_KEY" ] && [ -z "$VPS_PASSWORD" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Missing both VPS_SSH_KEY and VPS_PASSWORD, skipping deploy."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Deploy prerequisites found."
          fi

      - name: Download web artifact
        if: ${{ steps.gate.outputs.deploy == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: web_cloud_readonly
          path: web_cloud_readonly

      - name: Prepare deploy bundles
        if: ${{ steps.gate.outputs.deploy == 'true' }}
        run: |
          set -euo pipefail
          rm -rf backend_release
          mkdir -p backend_release
          rsync -a --delete \
            --exclude '.venv' \
            --exclude 'build' \
            --exclude 'dist' \
            Trustnode_edge_app/backend/ backend_release/
          test -f backend_release/requirements.txt
          tar -C backend_release -czf backend-release.tgz .
          tar -C web_cloud_readonly -czf web-release.tgz .

      - name: Upload bundles (password)
        if: ${{ steps.gate.outputs.deploy == 'true' && env.VPS_SSH_KEY == '' && env.VPS_PASSWORD != '' }}
        uses: appleboy/scp-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          password: ${{ env.VPS_PASSWORD }}
          source: "backend-release.tgz,web-release.tgz"
          target: "/tmp/trustnode-deploy"

      - name: Upload bundles (ssh key)
        if: ${{ steps.gate.outputs.deploy == 'true' && env.VPS_SSH_KEY != '' }}
        uses: appleboy/scp-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          source: "backend-release.tgz,web-release.tgz"
          target: "/tmp/trustnode-deploy"

      - name: Remote deploy (password)
        if: ${{ steps.gate.outputs.deploy == 'true' && env.VPS_SSH_KEY == '' && env.VPS_PASSWORD != '' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          password: ${{ env.VPS_PASSWORD }}
          script: |
            set -euo pipefail
            mkdir -p "${{ env.VPS_APP_ROOT }}/Trustnode_edge_app/backend" "${{ env.VPS_WEB_ROOT }}"
            tar -xzf /tmp/trustnode-deploy/backend-release.tgz -C "${{ env.VPS_APP_ROOT }}/Trustnode_edge_app/backend"
            tar -xzf /tmp/trustnode-deploy/web-release.tgz -C "${{ env.VPS_WEB_ROOT }}"
            test -f "${{ env.VPS_APP_ROOT }}/Trustnode_edge_app/backend/requirements.txt"
            cd "${{ env.VPS_APP_ROOT }}/Trustnode_edge_app/backend"
            PY_BIN="$(command -v python3.11 || command -v python3 || command -v python || true)"
            [ -n "$PY_BIN" ] || { echo "python missing"; exit 127; }
            if [ ! -x .venv/bin/python ]; then "$PY_BIN" -m venv .venv; fi
            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/python -m pip install -r requirements.txt
            mkdir -p /etc/systemd/system/${{ env.BACKEND_SERVICE }}.service.d
            cat >/etc/systemd/system/${{ env.BACKEND_SERVICE }}.service.d/override.conf <<'EOF'
            [Service]
            TimeoutStopSec=10
            KillMode=mixed
            Environment=TRUSTNODE_PREFER_CLOUD_READS=true
            Environment=TRUSTNODE_DISABLE_CONFIG_PUSH=true
            Environment=TRUSTNODE_CONFIG_SYNC_SECONDS=0.5
            Environment=TRUSTNODE_DATA_BULK_SYNC_SECONDS=0.5
            Environment=TRUSTNODE_DATA_SYNC_BATCH_SIZE=500
            ExecStart=
            ExecStart=${{ env.VPS_APP_ROOT }}/Trustnode_edge_app/backend/.venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 --timeout-graceful-shutdown 5
            EOF
            systemctl daemon-reload
            systemctl reset-failed ${{ env.BACKEND_SERVICE }} || true
            systemctl restart ${{ env.BACKEND_SERVICE }}
            ok=0
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then
                ok=1
                break
              fi
              sleep 1
            done
            if [ "$ok" -ne 1 ]; then
              echo "Backend did not become healthy on :8000"
              systemctl status ${{ env.BACKEND_SERVICE }} --no-pager || true
              journalctl -u ${{ env.BACKEND_SERVICE }} -n 120 --no-pager || true
              exit 1
            fi
            # Ensure /client/*.php executes via php-fpm (never served as source)
            if ! command -v php-fpm >/dev/null 2>&1; then
              if command -v dnf >/dev/null 2>&1; then
                dnf -y install php-fpm php-cli php-common || true
              elif command -v apt-get >/dev/null 2>&1; then
                apt-get update -y || true
                DEBIAN_FRONTEND=noninteractive apt-get install -y php-fpm php-cli php-common || true
              fi
            fi
            systemctl enable --now php-fpm || true
            PHP_FPM_PASS=""
            if [ -S /run/php-fpm/www.sock ]; then
              PHP_FPM_PASS="unix:/run/php-fpm/www.sock"
            else
              PHP_SOCK="$(find /run -maxdepth 4 -type s \( -name '*php*fpm*.sock' -o -name 'php*.sock' \) 2>/dev/null | head -n1 || true)"
              if [ -n "$PHP_SOCK" ]; then
                PHP_FPM_PASS="unix:$PHP_SOCK"
              else
                PHP_FPM_PASS="127.0.0.1:9000"
              fi
            fi
            TARGET_CONF="$(grep -Rsl 'server_name .*trustnode.lsapps.app' /etc/nginx/conf.d /etc/nginx/sites-enabled 2>/dev/null | head -n1 || true)"
            if [ -z "$TARGET_CONF" ]; then
              TARGET_CONF="$(grep -Rsl '${{ env.VPS_WEB_ROOT }}' /etc/nginx/conf.d /etc/nginx/sites-enabled 2>/dev/null | head -n1 || true)"
            fi
            if [ -z "$TARGET_CONF" ]; then
              echo "WARN: Could not locate nginx vhost config for trustnode.lsapps.app. Skipping /client PHP location injection."
            fi
            if [ -n "$TARGET_CONF" ] && ! grep -q 'TRUSTNODE_CLIENT_PHP_BEGIN' "$TARGET_CONF"; then
              awk -v pass="$PHP_FPM_PASS" '
                BEGIN{in_server=0;inserted=0}
                {
                  print $0
                  if ($0 ~ /^[[:space:]]*server[[:space:]]*\{/) in_server=1
                  else if (in_server && $0 ~ /^[[:space:]]*}$/ && inserted==0) {
                    print "    # TRUSTNODE_CLIENT_PHP_BEGIN"
                    print "    location /client/ {"
                    print "        try_files $uri $uri/ /client/client_test.html;"
                    print "    }"
                    print "    location ~ ^/client/.*\\.php$ {"
                    print "        root /var/www/trustnode;"
                    print "        include fastcgi_params;"
                    print "        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;"
                    print "        fastcgi_index client_test.php;"
                    print "        fastcgi_pass " pass ";"
                    print "    }"
                    print "    # TRUSTNODE_CLIENT_PHP_END"
                    inserted=1
                  }
                }
              ' "$TARGET_CONF" > "${TARGET_CONF}.tmp" && mv "${TARGET_CONF}.tmp" "$TARGET_CONF"
            fi
            chown -R nginx:nginx "${{ env.VPS_WEB_ROOT }}"
            restorecon -Rv "${{ env.VPS_WEB_ROOT }}" || true
            if [ -n "$TARGET_CONF" ]; then
              nginx -t
              systemctl reload nginx
            fi
            curl -fsS https://trustnode.lsapps.app/api/health >/dev/null
            curl -fsS https://trustnode.lsapps.app/ >/dev/null
            php_probe="$(curl -fsS https://trustnode.lsapps.app/client/client_test.php | head -c 240 || true)"
            if echo "$php_probe" | grep -q '<?php'; then
              echo "PHP source leak detected at /client/client_test.php"
              exit 1
            fi

      - name: Remote deploy (ssh key)
        if: ${{ steps.gate.outputs.deploy == 'true' && env.VPS_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            mkdir -p "${{ env.VPS_APP_ROOT }}/Trustnode_edge_app/backend" "${{ env.VPS_WEB_ROOT }}"
            tar -xzf /tmp/trustnode-deploy/backend-release.tgz -C "${{ env.VPS_APP_ROOT }}/Trustnode_edge_app/backend"
            tar -xzf /tmp/trustnode-deploy/web-release.tgz -C "${{ env.VPS_WEB_ROOT }}"
            test -f "${{ env.VPS_APP_ROOT }}/Trustnode_edge_app/backend/requirements.txt"
            cd "${{ env.VPS_APP_ROOT }}/Trustnode_edge_app/backend"
            PY_BIN="$(command -v python3.11 || command -v python3 || command -v python || true)"
            [ -n "$PY_BIN" ] || { echo "python missing"; exit 127; }
            if [ ! -x .venv/bin/python ]; then "$PY_BIN" -m venv .venv; fi
            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/python -m pip install -r requirements.txt
            mkdir -p /etc/systemd/system/${{ env.BACKEND_SERVICE }}.service.d
            cat >/etc/systemd/system/${{ env.BACKEND_SERVICE }}.service.d/override.conf <<'EOF'
            [Service]
            TimeoutStopSec=10
            KillMode=mixed
            Environment=TRUSTNODE_PREFER_CLOUD_READS=true
            Environment=TRUSTNODE_DISABLE_CONFIG_PUSH=true
            Environment=TRUSTNODE_CONFIG_SYNC_SECONDS=0.5
            Environment=TRUSTNODE_DATA_BULK_SYNC_SECONDS=0.5
            Environment=TRUSTNODE_DATA_SYNC_BATCH_SIZE=500
            ExecStart=
            ExecStart=${{ env.VPS_APP_ROOT }}/Trustnode_edge_app/backend/.venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 --timeout-graceful-shutdown 5
            EOF
            systemctl daemon-reload
            systemctl reset-failed ${{ env.BACKEND_SERVICE }} || true
            systemctl restart ${{ env.BACKEND_SERVICE }}
            ok=0
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then
                ok=1
                break
              fi
              sleep 1
            done
            if [ "$ok" -ne 1 ]; then
              echo "Backend did not become healthy on :8000"
              systemctl status ${{ env.BACKEND_SERVICE }} --no-pager || true
              journalctl -u ${{ env.BACKEND_SERVICE }} -n 120 --no-pager || true
              exit 1
            fi

      - name: Post-deploy control-plane smoke
        if: ${{ steps.gate.outputs.deploy == 'true' }}
        shell: pwsh
        env:
          TRUSTNODE_SMOKE_USER: ${{ secrets.TRUSTNODE_SMOKE_USER }}
          TRUSTNODE_SMOKE_PASS: ${{ secrets.TRUSTNODE_SMOKE_PASS }}
          TRUSTNODE_SMOKE_TENANT: ${{ secrets.TRUSTNODE_SMOKE_TENANT }}
        run: |
          $baseUrl = "${{ secrets.TRUSTNODE_CLOUD_API_URL }}"
          if (-not $baseUrl) { $baseUrl = "https://trustnode.lsapps.app" }
          $user = if ($env:TRUSTNODE_SMOKE_USER) { $env:TRUSTNODE_SMOKE_USER } else { "admin" }
          $pass = if ($env:TRUSTNODE_SMOKE_PASS) { $env:TRUSTNODE_SMOKE_PASS } else { "admin" }
          $tenant = if ($env:TRUSTNODE_SMOKE_TENANT) { $env:TRUSTNODE_SMOKE_TENANT } else { "default" }
          pwsh -NoProfile -ExecutionPolicy Bypass -File "./Trustnode_edge_app/scripts/smoke-control-plane.ps1" -BaseUrl $baseUrl -Username $user -Password $pass -TenantId $tenant
