name: Trustnode Edge CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - "Trustnode_edge_app/**"
      - ".github/workflows/trustnode-edge-cicd.yml"
  workflow_dispatch:

env:
  PROJECT_DIR: Trustnode_edge_app
  WEB_OUT_DIR: Trustnode_edge_app/web_cloud_readonly
  VPS_APP_ROOT: /opt/trustnode-edge/app
  VPS_WEB_ROOT: /var/www/trustnode
  BACKEND_SERVICE: trustnode-backend

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            Trustnode_edge_app/frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Trustnode_edge_app/backend/requirements.txt

      - name: Backend syntax check
        run: |
          python -m py_compile Trustnode_edge_app/backend/app/routers/app_store.py
          python -m py_compile Trustnode_edge_app/backend/app/services/app_store.py
          python -m py_compile Trustnode_edge_app/backend/app/main.py

      - name: Build cloud web bundle
        shell: pwsh
        run: |
          $cloudApi = "${{ secrets.TRUSTNODE_CLOUD_API_URL }}"
          if (-not $cloudApi) { $cloudApi = "https://trustnode.lsapps.app" }
          pwsh -NoProfile -ExecutionPolicy Bypass -File "./Trustnode_edge_app/scripts/build-web-cloud-readonly.ps1" -CloudApiUrl $cloudApi -BasePath "/"

      - name: Validate web bundle wiring
        run: |
          test -f Trustnode_edge_app/web_cloud_readonly/index.html
          js_file="$(grep -o 'assets/index-[^"]*\.js' Trustnode_edge_app/web_cloud_readonly/index.html | head -n1)"
          test -n "$js_file"
          test -f "Trustnode_edge_app/web_cloud_readonly/$js_file"
          grep -q "/api/app-store/live" "Trustnode_edge_app/web_cloud_readonly/$js_file"

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web_cloud_readonly
          path: Trustnode_edge_app/web_cloud_readonly
          if-no-files-found: error

  deploy-vps:
    runs-on: ubuntu-latest
    needs: build-and-test
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Evaluate deploy readiness
        id: gate
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Missing VPS_HOST or VPS_USER, skipping deploy."
          elif [ -z "$VPS_SSH_KEY" ] && [ -z "$VPS_PASSWORD" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Missing both VPS_SSH_KEY and VPS_PASSWORD, skipping deploy."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Deploy prerequisites found."
          fi

      - name: Download web artifact
        if: ${{ steps.gate.outputs.deploy == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: web_cloud_readonly
          path: web_cloud_readonly

      - name: Configure SSH
        if: ${{ steps.gate.outputs.deploy == 'true' && env.VPS_SSH_KEY != '' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Install sshpass (password auth)
        if: ${{ steps.gate.outputs.deploy == 'true' && env.VPS_SSH_KEY == '' && env.VPS_PASSWORD != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass rsync

      - name: Deploy code and restart backend on VPS
        if: ${{ steps.gate.outputs.deploy == 'true' }}
        run: |
          set -euo pipefail
          command -v ssh >/dev/null 2>&1
          command -v rsync >/dev/null 2>&1
          if [ -z "$VPS_SSH_KEY" ]; then
            command -v sshpass >/dev/null 2>&1
          fi
          RSYNC_CMD="rsync -az --delete"
          SSH_OPTS="-o StrictHostKeyChecking=accept-new"

          REMOTE_PREFLIGHT='
            set -euo pipefail
            if ! command -v rsync >/dev/null 2>&1; then
              if command -v dnf >/dev/null 2>&1; then dnf install -y rsync;
              elif command -v yum >/dev/null 2>&1; then yum install -y rsync;
              elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y rsync;
              fi
            fi
            mkdir -p "'"$VPS_APP_ROOT"'/Trustnode_edge_app/backend" "'"$VPS_WEB_ROOT"'"
          '
          if [ -n "$VPS_SSH_KEY" ]; then
            ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" "$REMOTE_PREFLIGHT"
          else
            sshpass -p "$VPS_PASSWORD" ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" "$REMOTE_PREFLIGHT"
          fi

          if [ -n "$VPS_SSH_KEY" ]; then
            $RSYNC_CMD -e "ssh $SSH_OPTS" ./Trustnode_edge_app/backend/ "$VPS_USER@$VPS_HOST:$VPS_APP_ROOT/Trustnode_edge_app/backend/"
            REMOTE_RUN="ssh $SSH_OPTS \"$VPS_USER@$VPS_HOST\""
          else
            sshpass -p "$VPS_PASSWORD" $RSYNC_CMD -e "ssh $SSH_OPTS" ./Trustnode_edge_app/backend/ "$VPS_USER@$VPS_HOST:$VPS_APP_ROOT/Trustnode_edge_app/backend/"
            REMOTE_RUN="sshpass -p \"$VPS_PASSWORD\" ssh $SSH_OPTS \"$VPS_USER@$VPS_HOST\""
          fi
          eval "$REMOTE_RUN" '
            set -euo pipefail
            mkdir -p "'"$VPS_APP_ROOT"'/Trustnode_edge_app/backend"
            cd "'"$VPS_APP_ROOT"'/Trustnode_edge_app/backend"
            PY_BIN="$(command -v python3.11 || command -v python3 || command -v python || true)"
            if [ -z "$PY_BIN" ]; then
              echo "No Python interpreter found on VPS" >&2
              exit 127
            fi
            if [ ! -x ./.venv/bin/python ]; then
              "$PY_BIN" -m venv .venv
            fi
            ./.venv/bin/python -m pip install --upgrade pip
            REQ_FILE="'"$VPS_APP_ROOT"'/Trustnode_edge_app/backend/requirements.txt"
            if [ ! -f "$REQ_FILE" ]; then
              REQ_FILE="$(find "'"$VPS_APP_ROOT"'/Trustnode_edge_app/backend" -maxdepth 3 -type f -name requirements.txt | head -n1 || true)"
            fi
            if [ -z "${REQ_FILE:-}" ] || [ ! -f "$REQ_FILE" ]; then
              echo "requirements.txt not found under '"$VPS_APP_ROOT"'/Trustnode_edge_app/backend" >&2
              ls -la "'"$VPS_APP_ROOT"'/Trustnode_edge_app/backend" || true
              exit 1
            fi
            ./.venv/bin/python -m pip install -r "$REQ_FILE"

            mkdir -p /etc/systemd/system/'"$BACKEND_SERVICE"'.service.d
            cat >/etc/systemd/system/'"$BACKEND_SERVICE"'.service.d/override.conf <<EOF
            [Service]
            TimeoutStopSec=10
            KillMode=mixed
            Environment=TRUSTNODE_PREFER_CLOUD_READS=true
            Environment=TRUSTNODE_CONFIG_SYNC_SECONDS=1
            Environment=TRUSTNODE_DATA_SYNC_BATCH_SIZE=8000
            Environment=TRUSTNODE_LIVE_SYNC_SAMPLE_ROWS=10000
            ExecStart=
            ExecStart='"$VPS_APP_ROOT"'/Trustnode_edge_app/backend/.venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 --timeout-graceful-shutdown 5
            EOF

            systemctl daemon-reload
            systemctl reset-failed '"$BACKEND_SERVICE"' || true
            systemctl stop '"$BACKEND_SERVICE"' || true
            pkill -9 -f "uvicorn app.main:app" || true
            systemctl start '"$BACKEND_SERVICE"'
            sleep 2
            curl -fsS http://127.0.0.1:8000/api/health >/dev/null
          '

      - name: Deploy web bundle to VPS
        if: ${{ steps.gate.outputs.deploy == 'true' }}
        run: |
          RSYNC_CMD="rsync -az --delete"
          SSH_OPTS="-o StrictHostKeyChecking=accept-new"
          if [ -n "$VPS_SSH_KEY" ]; then
            $RSYNC_CMD -e "ssh $SSH_OPTS" ./web_cloud_readonly/ "$VPS_USER@$VPS_HOST:$VPS_WEB_ROOT/"
            REMOTE_RUN="ssh $SSH_OPTS \"$VPS_USER@$VPS_HOST\""
          else
            sshpass -p "$VPS_PASSWORD" $RSYNC_CMD -e "ssh $SSH_OPTS" ./web_cloud_readonly/ "$VPS_USER@$VPS_HOST:$VPS_WEB_ROOT/"
            REMOTE_RUN="sshpass -p \"$VPS_PASSWORD\" ssh $SSH_OPTS \"$VPS_USER@$VPS_HOST\""
          fi
          eval "$REMOTE_RUN" '
            set -euo pipefail
            chown -R nginx:nginx "'"$VPS_WEB_ROOT"'"
            restorecon -Rv "'"$VPS_WEB_ROOT"'" || true
            nginx -t
            systemctl reload nginx
          '

      - name: VPS smoke checks
        if: ${{ steps.gate.outputs.deploy == 'true' }}
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=accept-new"
          if [ -n "$VPS_SSH_KEY" ]; then
            REMOTE_RUN="ssh $SSH_OPTS \"$VPS_USER@$VPS_HOST\""
          else
            REMOTE_RUN="sshpass -p \"$VPS_PASSWORD\" ssh $SSH_OPTS \"$VPS_USER@$VPS_HOST\""
          fi
          eval "$REMOTE_RUN" '
            set -euo pipefail
            systemctl is-active '"$BACKEND_SERVICE"'
            curl -fsS http://127.0.0.1:8000/api/health >/dev/null
            curl -fsS http://127.0.0.1:8000/api/app-store/live?limit=1 >/dev/null
            curl -fsS https://trustnode.lsapps.app/api/health >/dev/null
            curl -fsS https://trustnode.lsapps.app/api/app-store/live?limit=1 >/dev/null
            html=$(curl -fsS https://trustnode.lsapps.app/)
            js=$(printf "%s" "$html" | grep -o "assets/index-[^\"]*\.js" | head -n1)
            test -n "$js"
            curl -fsS "https://trustnode.lsapps.app/$js" | grep -q "/api/app-store/live"
          '
