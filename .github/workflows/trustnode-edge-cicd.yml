name: Trustnode Edge CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - "Trustnode_edge_app/**"
      - ".github/workflows/trustnode-edge-cicd.yml"
  workflow_dispatch:

env:
  PROJECT_DIR: Trustnode_edge_app
  WEB_OUT_DIR: Trustnode_edge_app/web_cloud_readonly
  VPS_APP_ROOT: /opt/trustnode-edge/app
  VPS_WEB_ROOT: /var/www/trustnode
  BACKEND_SERVICE: trustnode-backend

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            Trustnode_edge_app/frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Trustnode_edge_app/backend/requirements.txt

      - name: Backend syntax check
        run: |
          python -m py_compile Trustnode_edge_app/backend/app/routers/app_store.py
          python -m py_compile Trustnode_edge_app/backend/app/services/app_store.py
          python -m py_compile Trustnode_edge_app/backend/app/main.py

      - name: Build cloud web bundle
        shell: pwsh
        run: |
          $cloudApi = "${{ secrets.TRUSTNODE_CLOUD_API_URL }}"
          if (-not $cloudApi) { $cloudApi = "https://trustnode.lsapps.app" }
          pwsh -NoProfile -ExecutionPolicy Bypass -File "./Trustnode_edge_app/scripts/build-web-cloud-readonly.ps1" -CloudApiUrl $cloudApi -BasePath "/"

      - name: Validate web bundle wiring
        run: |
          test -f Trustnode_edge_app/web_cloud_readonly/index.html
          js_file="$(grep -o 'assets/index-[^"]*\.js' Trustnode_edge_app/web_cloud_readonly/index.html | head -n1)"
          test -n "$js_file"
          test -f "Trustnode_edge_app/web_cloud_readonly/$js_file"
          grep -q "/api/app-store/live" "Trustnode_edge_app/web_cloud_readonly/$js_file"

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web_cloud_readonly
          path: Trustnode_edge_app/web_cloud_readonly
          if-no-files-found: error

  deploy-vps:
    runs-on: ubuntu-latest
    needs: build-and-test
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Evaluate deploy readiness
        id: gate
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Missing VPS_HOST or VPS_USER, skipping deploy."
          elif [ -z "$VPS_SSH_KEY" ] && [ -z "$VPS_PASSWORD" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Missing both VPS_SSH_KEY and VPS_PASSWORD, skipping deploy."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Deploy prerequisites found."
          fi

      - name: Download web artifact
        if: ${{ steps.gate.outputs.deploy == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: web_cloud_readonly
          path: web_cloud_readonly

      - name: Prepare deploy bundles
        if: ${{ steps.gate.outputs.deploy == 'true' }}
        run: |
          set -euo pipefail
          rm -rf backend_release
          mkdir -p backend_release
          rsync -a --delete \
            --exclude '.venv' \
            --exclude 'build' \
            --exclude 'dist' \
            Trustnode_edge_app/backend/ backend_release/
          test -f backend_release/requirements.txt
          tar -C backend_release -czf backend-release.tgz .
          tar -C web_cloud_readonly -czf web-release.tgz .

      - name: Upload bundles (password)
        if: ${{ steps.gate.outputs.deploy == 'true' && env.VPS_SSH_KEY == '' && env.VPS_PASSWORD != '' }}
        uses: appleboy/scp-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          password: ${{ env.VPS_PASSWORD }}
          source: "backend-release.tgz,web-release.tgz"
          target: "/tmp/trustnode-deploy"

      - name: Upload bundles (ssh key)
        if: ${{ steps.gate.outputs.deploy == 'true' && env.VPS_SSH_KEY != '' }}
        uses: appleboy/scp-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          source: "backend-release.tgz,web-release.tgz"
          target: "/tmp/trustnode-deploy"

      - name: Remote deploy (password)
        if: ${{ steps.gate.outputs.deploy == 'true' && env.VPS_SSH_KEY == '' && env.VPS_PASSWORD != '' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          password: ${{ env.VPS_PASSWORD }}
          script: |
            set -euo pipefail
            mkdir -p "${{ env.VPS_APP_ROOT }}/Trustnode_edge_app/backend" "${{ env.VPS_WEB_ROOT }}"
            tar -xzf /tmp/trustnode-deploy/backend-release.tgz -C "${{ env.VPS_APP_ROOT }}/Trustnode_edge_app/backend"
            tar -xzf /tmp/trustnode-deploy/web-release.tgz -C "${{ env.VPS_WEB_ROOT }}"
            test -f "${{ env.VPS_APP_ROOT }}/Trustnode_edge_app/backend/requirements.txt"
            cd "${{ env.VPS_APP_ROOT }}/Trustnode_edge_app/backend"
            PY_BIN="$(command -v python3.11 || command -v python3 || command -v python || true)"
            [ -n "$PY_BIN" ] || { echo "python missing"; exit 127; }
            if [ ! -x .venv/bin/python ]; then "$PY_BIN" -m venv .venv; fi
            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/python -m pip install -r requirements.txt
            mkdir -p /etc/systemd/system/${{ env.BACKEND_SERVICE }}.service.d
            cat >/etc/systemd/system/${{ env.BACKEND_SERVICE }}.service.d/override.conf <<'EOF'
            [Service]
            TimeoutStopSec=10
            KillMode=mixed
            Environment=TRUSTNODE_PREFER_CLOUD_READS=true
            Environment=TRUSTNODE_CONFIG_SYNC_SECONDS=1
            Environment=TRUSTNODE_DATA_SYNC_BATCH_SIZE=8000
            Environment=TRUSTNODE_LIVE_SYNC_SAMPLE_ROWS=10000
            ExecStart=
            ExecStart=${{ env.VPS_APP_ROOT }}/Trustnode_edge_app/backend/.venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 --timeout-graceful-shutdown 5
            EOF
            systemctl daemon-reload
            systemctl reset-failed ${{ env.BACKEND_SERVICE }} || true
            systemctl restart ${{ env.BACKEND_SERVICE }}
            ok=0
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then
                ok=1
                break
              fi
              sleep 1
            done
            if [ "$ok" -ne 1 ]; then
              echo "Backend did not become healthy on :8000"
              systemctl status ${{ env.BACKEND_SERVICE }} --no-pager || true
              journalctl -u ${{ env.BACKEND_SERVICE }} -n 120 --no-pager || true
              exit 1
            fi
            chown -R nginx:nginx "${{ env.VPS_WEB_ROOT }}"
            restorecon -Rv "${{ env.VPS_WEB_ROOT }}" || true
            nginx -t
            systemctl reload nginx
            curl -fsS https://trustnode.lsapps.app/api/health >/dev/null
            curl -fsS https://trustnode.lsapps.app/api/app-store/live?limit=1 >/dev/null

      - name: Remote deploy (ssh key)
        if: ${{ steps.gate.outputs.deploy == 'true' && env.VPS_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            mkdir -p "${{ env.VPS_APP_ROOT }}/Trustnode_edge_app/backend" "${{ env.VPS_WEB_ROOT }}"
            tar -xzf /tmp/trustnode-deploy/backend-release.tgz -C "${{ env.VPS_APP_ROOT }}/Trustnode_edge_app/backend"
            tar -xzf /tmp/trustnode-deploy/web-release.tgz -C "${{ env.VPS_WEB_ROOT }}"
            test -f "${{ env.VPS_APP_ROOT }}/Trustnode_edge_app/backend/requirements.txt"
            cd "${{ env.VPS_APP_ROOT }}/Trustnode_edge_app/backend"
            PY_BIN="$(command -v python3.11 || command -v python3 || command -v python || true)"
            [ -n "$PY_BIN" ] || { echo "python missing"; exit 127; }
            if [ ! -x .venv/bin/python ]; then "$PY_BIN" -m venv .venv; fi
            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/python -m pip install -r requirements.txt
            mkdir -p /etc/systemd/system/${{ env.BACKEND_SERVICE }}.service.d
            cat >/etc/systemd/system/${{ env.BACKEND_SERVICE }}.service.d/override.conf <<'EOF'
            [Service]
            TimeoutStopSec=10
            KillMode=mixed
            Environment=TRUSTNODE_PREFER_CLOUD_READS=true
            Environment=TRUSTNODE_CONFIG_SYNC_SECONDS=1
            Environment=TRUSTNODE_DATA_SYNC_BATCH_SIZE=8000
            Environment=TRUSTNODE_LIVE_SYNC_SAMPLE_ROWS=10000
            ExecStart=
            ExecStart=${{ env.VPS_APP_ROOT }}/Trustnode_edge_app/backend/.venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 --timeout-graceful-shutdown 5
            EOF
            systemctl daemon-reload
            systemctl reset-failed ${{ env.BACKEND_SERVICE }} || true
            systemctl restart ${{ env.BACKEND_SERVICE }}
            ok=0
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then
                ok=1
                break
              fi
              sleep 1
            done
            if [ "$ok" -ne 1 ]; then
              echo "Backend did not become healthy on :8000"
              systemctl status ${{ env.BACKEND_SERVICE }} --no-pager || true
              journalctl -u ${{ env.BACKEND_SERVICE }} -n 120 --no-pager || true
              exit 1
            fi
            chown -R nginx:nginx "${{ env.VPS_WEB_ROOT }}"
            restorecon -Rv "${{ env.VPS_WEB_ROOT }}" || true
            nginx -t
            systemctl reload nginx
            curl -fsS https://trustnode.lsapps.app/api/health >/dev/null
            curl -fsS https://trustnode.lsapps.app/api/app-store/live?limit=1 >/dev/null
