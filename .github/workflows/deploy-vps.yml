name: Deploy VPS

# Phase 3f (operator 2026-06-18): replaces the ad-hoc "SSH in and
# git pull" deploy flow.
#
# Trigger: push to main that touches backend/, frontend/, db/, scripts/,
#   or this workflow file.
# Steps:
#   1. Checkout
#   2. Build the frontend (so the VPS doesn't have to install Node)
#   3. Upload backend + frontend dist + db/migrations to the VPS
#      via rsync over SSH
#   4. Run a remote command: pip install -r requirements.txt + restart
#      the systemd unit
#   5. Curl the public /api/health endpoint to confirm the deploy is
#      serving traffic
#
# Required GitHub repo secrets (set under Settings → Secrets and variables):
#   VPS_HOST            e.g. 87.106.7.67
#   VPS_USER            e.g. root
#   VPS_SSH_PRIVATE_KEY raw OpenSSH private key (NOT path)
#   PUBLIC_HEALTH_URL   e.g. https://trustnode.lsapps.app/api/health

on:
  push:
    branches: [main]
    paths:
      - "Trustnode_edge_app/backend/**"
      - "Trustnode_edge_app/frontend/**"
      - "Trustnode_edge_app/db/**"
      - "Trustnode_edge_app/scripts/**"
      - ".github/workflows/deploy-vps.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Trustnode_edge_app/frontend/package-lock.json

      - name: Build frontend
        working-directory: Trustnode_edge_app/frontend
        run: |
          npm ci
          npm run build
          npm run build:clientview

      # 2026-10-17: the cloud Lite bundle was NOT built or shipped by this
      # workflow, so it only ever reached the VPS when somebody ran
      # scripts/push_lite_to_vps.py by hand. Measured that day: the VPS was
      # serving tnlite-v51 while the source was at v54 - three rounds of
      # phone/web-client fixes (4-way chart axes, per-axis min/max and units,
      # the Report Card) sat in git and reached nobody.
      #
      # The cloud app and the LAN app are ONE source
      # (backend/static/lite_view); this converts it. config.json is merged
      # from whatever the host already serves, and the script exits non-zero
      # rather than invent one, because it holds the Supabase URL and anon
      # key.
      - name: Build cloud Lite bundle
        working-directory: Trustnode_edge_app
        run: python3 scripts/build_lite_cloud_bundle.py

      - name: Install ssh key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync backend
        run: |
          rsync -az --delete \
            --exclude='__pycache__' --exclude='.pytest_cache' --exclude='*.pyc' \
            --exclude='.venv' --exclude='build/' --exclude='dist/' \
            --exclude='sidecars/opcua-cs/bin' --exclude='sidecars/opcua-cs/obj' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            Trustnode_edge_app/backend/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/trustnode-edge/app/Trustnode_edge_app/backend/

      - name: Rsync frontend dist (default + clientview)
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519" \
            Trustnode_edge_app/frontend/dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/trustnode/
          rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519" \
            Trustnode_edge_app/frontend/dist_client_view/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/trustnode-clientview/

      # MUST come after the frontend rsync above: that one is `--delete` into
      # /var/www/trustnode/, which removes anything not in frontend/dist -
      # including lite/. And NO --delete here: build_lite_cloud_bundle.py
      # deliberately leaves files it has no local copy of to the VPS's own.
      - name: Rsync cloud Lite bundle
        run: |
          rsync -az -e "ssh -i ~/.ssh/id_ed25519" \
            Trustnode_edge_app/web_cloud_readonly/lite/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/trustnode/lite/

      - name: Rsync db migrations + scripts
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519" \
            Trustnode_edge_app/db/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/trustnode-edge/app/Trustnode_edge_app/db/
          rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519" \
            Trustnode_edge_app/scripts/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/trustnode-edge/app/Trustnode_edge_app/scripts/

      - name: Install deps + restart service
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} bash <<'EOF'
          set -e
          cd /opt/trustnode-edge/app/Trustnode_edge_app/backend
          ./.venv/bin/pip install -r requirements.txt --quiet
          sudo systemctl restart trustnode-backend.service
          sleep 3
          sudo systemctl is-active trustnode-backend.service
          EOF

      - name: Health check
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.PUBLIC_HEALTH_URL }}" || echo "000")
            if [ "$code" = "200" ]; then
              echo "Health check OK on attempt $i"
              exit 0
            fi
            echo "Attempt $i: HTTP $code — retrying in 5s..."
            sleep 5
          done
          echo "Health check FAILED — public endpoint not responding 200"
          exit 1

      # 2026-10-17: a green deploy told us nothing about the Lite bundle,
      # which is how the VPS sat on tnlite-v51 while the repo was at v54.
      # Compare what the host serves against what this commit built - an
      # exit code is not evidence that the right bytes arrived.
      - name: Verify the served Lite bundle is this one
        run: |
          sw=Trustnode_edge_app/web_cloud_readonly/lite/sw.js
          want=$(grep -o 'CACHE_VERSION = "[^"]*"' "$sw" | head -1)
          base="${{ secrets.PUBLIC_HEALTH_URL }}"
          base="${base%/api/health}"
          served=$(curl -fsS --max-time 30 "$base/lite/sw.js" || echo "")
          got=$(printf '%s' "$served" | grep -o 'CACHE_VERSION = "[^"]*"' | head -1)
          echo "built:  $want"
          echo "served: $got"
          if [ -z "$got" ]; then
            echo "Could not read the served Lite service worker"
            exit 1
          fi
          if [ "$want" != "$got" ]; then
            echo "The VPS is serving a DIFFERENT Lite bundle than this deploy built"
            exit 1
          fi
          echo "Lite bundle verified"
