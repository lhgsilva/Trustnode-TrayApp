import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm";

// ---------- Tiny DOM utilities --------------------------------------------
const $ = (sel, root = document) => root.querySelector(sel);
const el = (tag, props = {}, ...children) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") node.className = v;
    else if (k === "style" && typeof v === "object") Object.assign(node.style, v);
    else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "html") node.innerHTML = v;
    else if (v !== undefined && v !== null && v !== false) node.setAttribute(k, v);
  }
  for (const c of children) {
    if (c == null || c === false) continue;
    node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return node;
};
const fmtAge = (iso) => {
  if (!iso) return "never";
  const t = Date.parse(iso);
  if (!Number.isFinite(t)) return "never";
  const dt = Math.max(0, Date.now() - t);
  if (dt < 1500) return "now";
  if (dt < 60_000) return `${Math.round(dt / 1000)}s`;
  if (dt < 3_600_000) return `${Math.round(dt / 60_000)}m`;
  if (dt < 86_400_000) return `${Math.round(dt / 3_600_000)}h`;
  return `${Math.round(dt / 86_400_000)}d`;
};
const fmtVal = (v) => {
  if (v === null || v === undefined) return "—";
  const n = Number(v);
  if (!Number.isFinite(n)) return String(v);
  if (Math.abs(n) >= 1000) return n.toFixed(0);
  if (Math.abs(n) >= 1) return n.toFixed(2);
  return n.toFixed(3);
};
const fmtTs = (iso) => {
  if (!iso) return "—";
  try { return new Date(iso).toLocaleString(); } catch { return String(iso); }
};
const freshnessClass = (ts) => {
  const t = ts ? Date.parse(ts) : 0;
  if (!t) return "bad";
  const age = Date.now() - t;
  if (age < 10_000) return "fresh";
  if (age < 60_000) return "stale";
  return "bad";
};

// ---------- Config + Supabase client --------------------------------------
let cfg = null;
let supabase = null;
let session = null;

async function loadConfig() {
  try {
    const res = await fetch("./config.json", { cache: "no-cache" });
    if (!res.ok) throw new Error(`config.json HTTP ${res.status}`);
    cfg = await res.json();
  } catch (e) {
    cfg = null;
    throw new Error(`Could not load config.json: ${e.message || e}`);
  }
  if (!cfg?.supabase_url || !cfg?.supabase_anon_key) {
    throw new Error("config.json is missing supabase_url or supabase_anon_key");
  }
  supabase = createClient(cfg.supabase_url, cfg.supabase_anon_key, {
    auth: { persistSession: true, storageKey: "tnlite-auth", autoRefreshToken: true },
  });
  const { data } = await supabase.auth.getSession();
  session = data.session || null;
}

// ---------- State ----------------------------------------------------------
const state = {
  tab: "dashboard",
  tenantLabel: "",
  userEmail: "",
  edges: [],            // list of edge ids the viewer can see (currently a placeholder; multi-edge wiring TBD)
  selectedEdge: "",     // "" = all edges
  liveRows: [],
  liveAt: 0,
  liveError: "",
  historyRows: [],
  historyError: "",
  alarmRows: [],
  alarmError: "",
  powerRows: [],
  powerError: "",
  dashboardWidgets: [],
  dashboardLayout: null,    // full payload incl. mode, per_row, tag_colors
  dashboardError: "",
  // All available widget profiles (one per dashboard_configurations row the
  // viewer is allowed to read). Populated by fetchDashboardConfig.
  dashboardProfiles: [],
  // Which profile is active. Restored from localStorage on boot. If empty
  // the renderer picks the freshest row.
  activeProfileKey: (() => { try { return localStorage.getItem("tnlite-profile") || ""; } catch (_) { return ""; } })(),
  // Per-viewer dashboard preferences. Saved in localStorage so the choice
  // survives a page reload.
  dashPrefs: (() => {
    try {
      const raw = localStorage.getItem("tnlite-dash-prefs");
      if (raw) return JSON.parse(raw);
    } catch (_) {}
    return { perRow: 2, cardHeight: 220, sampleCount: 20 };
  })(),
  // Per-gateway last-seen timestamp (ms) so the dashboard knows which
  // gateways are online and which charts to refresh. Populated from
  // state.liveRows on every fetch.
  gatewayLastSeen: {},
  drawer: null, // { gateway_id, tag_name, range_ms, rows, loading, error }
  // Latency telemetry, surfaced in the header overlay.
  latency: {
    transport: "polling",    // "realtime" | "polling"
    last_rtt_ms: null,        // most recent PostgREST request round-trip
    last_age_ms: null,        // newest row age vs local clock at last refresh
    last_event_at: 0,         // wall clock when last update arrived
  },
};

let livePoll = null;
let historyPoll = null;
let alarmsPoll = null;
let powerPoll = null;
let liveChannel = null;       // Supabase Realtime channel for live_latest
let alarmChannel = null;      // Supabase Realtime channel for app_logs
let headerRefreshTick = null; // 1 Hz tick so the latency overlay stays fresh

function stopAllPolls() {
  [livePoll, historyPoll, alarmsPoll, powerPoll].forEach((t) => t && clearInterval(t));
  livePoll = historyPoll = alarmsPoll = powerPoll = null;
}

function stopAllChannels() {
  if (liveChannel && supabase) supabase.removeChannel(liveChannel).catch(() => {});
  if (alarmChannel && supabase) supabase.removeChannel(alarmChannel).catch(() => {});
  if (dashboardChannel && supabase) supabase.removeChannel(dashboardChannel).catch(() => {});
  liveChannel = alarmChannel = dashboardChannel = null;
}

// ---------- Data fetchers (direct Supabase) -------------------------------
async function fetchLive() {
  if (!supabase || !session) return;
  const t0 = performance.now();
  try {
    const { data, error } = await supabase
      .from("live_latest")
      .select("gateway_id, gateway_name, device_name, tag_name, value, quality, quality_label, ts_utc, tenant_id")
      .order("ts_utc", { ascending: false })
      .limit(400);
    if (error) throw error;
    state.liveRows = data || [];
    state.liveAt = Date.now();
    state.liveError = "";
    state.latency.last_rtt_ms = Math.round(performance.now() - t0);
    updateLatencyAge();
    state.latency.last_event_at = Date.now();
    renderHeaderLatency();
    if (state.tab === "dashboard") renderBody();
  } catch (e) {
    state.liveError = e.message || String(e);
    if (state.tab === "dashboard") renderBody();
  }
}

// Refresh state.latency.last_age_ms AND state.gatewayLastSeen from the
// current liveRows. Pulled out so the Realtime path can call it on every
// WS event too.
function updateLatencyAge() {
  const rows = state.liveRows || [];
  let newest = 0;
  const seen = {};
  for (const r of rows) {
    const t = Date.parse(r.ts_utc || 0);
    if (Number.isFinite(t)) {
      if (t > newest) newest = t;
      const gid = r.gateway_id || "";
      if (gid && (!seen[gid] || seen[gid] < t)) seen[gid] = t;
    }
  }
  state.gatewayLastSeen = seen;
  if (newest > 0) state.latency.last_age_ms = Math.max(0, Date.now() - newest);
}

// Is a gateway "online" right now? Anything seen within 30s counts.
function isGatewayOnline(gatewayId) {
  const t = state.gatewayLastSeen?.[gatewayId];
  return !!t && (Date.now() - t) < 30_000;
}

// Surgically update the KPI/tile DOM for one (gateway, tag) pair without
// blowing away the rest of the dashboard. The data-* attributes set by
// renderWidget / renderLive let us find the targets.
function patchLiveTiles(row) {
  if (!row || !row.tag_name) return;
  const gw = row.gateway_id || "";
  const tag = row.tag_name || "";
  const value = row.value;
  const ts = row.ts_utc || "";
  const freshCls = freshnessClass(ts);
  // 1) Live tiles (the section below the dashboard)
  const tileSel = `.tile[data-gw="${cssEscape(gw)}"][data-tag="${cssEscape(tag)}"]`;
  document.querySelectorAll(tileSel).forEach((tile) => {
    tile.classList.remove("fresh", "stale", "bad");
    tile.classList.add(freshCls);
    const v = tile.querySelector(".val");  if (v) v.textContent = fmtVal(value);
    const a = tile.querySelector(".age");  if (a) a.textContent = fmtAge(ts);
  });
  // 2) Dashboard widget KPIs
  const kpiSel = `.widget[data-gw="${cssEscape(gw)}"][data-tag="${cssEscape(tag)}"] .widget-kpi`;
  document.querySelectorAll(kpiSel).forEach((kpi) => {
    kpi.classList.remove("fresh", "stale", "bad");
    kpi.classList.add(freshCls);
    const v = kpi.querySelector(".widget-value");
    if (v) v.textContent = fmtVal(value);
    const sub = kpi.querySelector(".widget-sub");
    if (sub) {
      const gwName = sub.getAttribute("data-gw-name") || gw || "—";
      sub.textContent = `${gwName} · ${fmtAge(ts)} ago`;
    }
  });
  // 3) Section meta (e.g. "33 tags · refreshed now ago")
  document.querySelectorAll("[data-live-refreshed-at]").forEach((m) => {
    m.textContent = `${(state.liveRows || []).length} tags · refreshed ${fmtAge(new Date(state.liveAt).toISOString())} ago`;
  });
}

// Minimal CSS.escape polyfill — modern browsers have CSS.escape; this is
// a safe fallback for the gateway / tag values we put into selectors.
function cssEscape(s) {
  s = String(s || "");
  if (typeof CSS !== "undefined" && typeof CSS.escape === "function") return CSS.escape(s);
  return s.replace(/["\\\]\[#.>+~^$=*:']/g, (m) => "\\" + m);
}

// Realtime subscription for live_latest. Pushes each row update straight into
// state.liveRows so the tile grid re-renders without polling. Records the
// arrival latency so the header overlay shows current freshness.
async function subscribeLive() {
  if (!supabase || !session) return false;
  try {
    // First, seed the in-memory snapshot via one REST call so tiles render
    // immediately on tab switch instead of waiting for the first WS event.
    await fetchLive();
    if (liveChannel) await supabase.removeChannel(liveChannel).catch(() => {});
    liveChannel = supabase.channel("lite-live")
      .on("postgres_changes",
        { event: "*", schema: "public", table: "live_latest" },
        (payload) => {
          const row = payload.new || payload.record || null;
          if (!row || !row.tag_name) return;
          const key = `${row.gateway_id || ""}|${row.tag_name}`;
          const next = state.liveRows.filter((r) =>
            (r.gateway_id || "") + "|" + r.tag_name !== key);
          next.unshift(row);
          // Cap at 400 to match the REST limit and bound memory.
          state.liveRows = next.slice(0, 400);
          state.liveAt = Date.now();
          state.latency.last_event_at = Date.now();
          updateLatencyAge();
          renderHeaderLatency();
          // Targeted updates instead of full re-render. Surgically patches
          // each KPI tile, leaves charts/tables alone so they don't flicker
          // and don't re-fetch the historian on every WS event.
          if (state.tab === "dashboard") patchLiveTiles(row);
        })
      .subscribe((status) => {
        if (status === "SUBSCRIBED") {
          state.latency.transport = "realtime";
          renderHeaderLatency();
        } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") {
          // Fall back to polling if the WS path is unhealthy.
          state.latency.transport = "polling";
          renderHeaderLatency();
          if (!livePoll) {
            const pollMs = Number(cfg?.live_poll_ms || 1000);
            livePoll = setInterval(fetchLive, pollMs);
          }
        }
      });
    return true;
  } catch (_e) {
    return false;
  }
}

async function subscribeAlarms() {
  if (!supabase || !session) return;
  try {
    if (alarmChannel) await supabase.removeChannel(alarmChannel).catch(() => {});
    alarmChannel = supabase.channel("lite-alarms")
      .on("postgres_changes",
        { event: "INSERT", schema: "public", table: "app_logs" },
        (payload) => {
          const row = payload.new || payload.record || null;
          if (!row) return;
          state.alarmRows = [row, ...(state.alarmRows || [])].slice(0, 200);
          if (state.tab === "alarms") renderBody();
        })
      .subscribe();
  } catch (_e) {}
}

async function fetchHistory() {
  if (!supabase || !session) return;
  try {
    const lim = Number(cfg?.history_default_limit || 300);
    const { data, error } = await supabase
      .from("historian_readings")
      .select("gateway_id, gateway_name, device_name, tag_name, value, quality, quality_label, ts_utc")
      .order("ts_utc", { ascending: false })
      .limit(lim);
    if (error) throw error;
    state.historyRows = data || [];
    state.historyError = "";
    if (state.tab === "history") renderBody();
  } catch (e) {
    state.historyError = e.message || String(e);
    if (state.tab === "history") renderBody();
  }
}

async function fetchAlarms() {
  if (!supabase || !session) return;
  try {
    const { data, error } = await supabase
      .from("app_logs")
      .select("ts_utc, level, category, message, gateway_id, gateway_name")
      .order("ts_utc", { ascending: false })
      .limit(200);
    if (error) throw error;
    state.alarmRows = data || [];
    state.alarmError = "";
    if (state.tab === "alarms") renderBody();
  } catch (e) {
    state.alarmError = e.message || String(e);
    if (state.tab === "alarms") renderBody();
  }
}

// Power tab: derive from live_latest by filtering tag names. The desktop
// power-meter integration writes voltage_v / current_a / active_power_w /
// energy_wh / power_factor / frequency_hz tags. We group by gateway_id.
async function fetchPower() {
  if (!supabase || !session) return;
  try {
    const meterTags = ["voltage_v","current_a","active_power_w","energy_wh","power_factor","frequency_hz"];
    const { data, error } = await supabase
      .from("live_latest")
      .select("gateway_id, gateway_name, tag_name, value, ts_utc")
      .in("tag_name", meterTags);
    if (error) throw error;
    const byGw = new Map();
    for (const r of data || []) {
      const gid = r.gateway_id || "—";
      if (!byGw.has(gid)) byGw.set(gid, { gateway_id: gid, gateway_name: r.gateway_name || gid, ts_utc: r.ts_utc, tags: {} });
      const e = byGw.get(gid);
      e.tags[r.tag_name] = r.value;
      if (!e.ts_utc || (r.ts_utc && r.ts_utc > e.ts_utc)) e.ts_utc = r.ts_utc;
    }
    state.powerRows = [...byGw.values()];
    state.powerError = "";
    if (state.tab === "power") renderBody();
  } catch (e) {
    state.powerError = e.message || String(e);
    if (state.tab === "power") renderBody();
  }
}

// Dashboard widgets come from cp_users.permissions_json? No — they live in
// Read every operator-configured widget layout the viewer is allowed to
// see. Each row in public.dashboard_configurations is treated as a
// "profile" — typically one per edge/user combo. The Lite app remembers
// which profile the viewer selected in localStorage.
async function fetchDashboardConfig() {
  if (!supabase || !session) return;
  try {
    const { data, error } = await supabase
      .from("dashboard_configurations")
      .select("scope_key, payload_json, version, updated_utc")
      .order("updated_utc", { ascending: false })
      .limit(20);
    if (error) throw error;
    const rows = data || [];
    // Build a profile list. scope_key '' (empty) means the global default
    // for the tenant — label it "Default".
    state.dashboardProfiles = rows.map((r) => ({
      key: r.scope_key || "",
      label: profileLabel(r.scope_key || ""),
      payload: r.payload_json || {},
      version: r.version,
      updated_utc: r.updated_utc,
    }));
    // Pick the active profile: stored preference, else the freshest row.
    const stored = state.activeProfileKey || "";
    const active = state.dashboardProfiles.find((p) => p.key === stored)
                || state.dashboardProfiles[0]
                || null;
    if (active) {
      state.activeProfileKey = active.key;
      state.dashboardLayout = active.payload;
      state.dashboardWidgets = Array.isArray(active.payload?.widgets) ? active.payload.widgets : [];
    } else {
      state.dashboardLayout = null;
      state.dashboardWidgets = [];
    }
    state.dashboardError = "";
    if (state.tab === "dashboard") renderBody();
  } catch (e) {
    state.dashboardError = e.message || String(e);
    if (state.tab === "dashboard") renderBody();
  }
}

// Derive a human-readable name for a scope_key. Scope keys on the edge are
// shaped 'tenant|-|edge_id|user'. We pull out edge and user so the dropdown
// reads e.g. "edge-1868e2b401 / admin" instead of the raw key.
function profileLabel(scopeKey) {
  if (!scopeKey) return "Default";
  const parts = String(scopeKey).split("|");
  // tenant | "-" | edge_id | user
  const edge = parts[2] || "";
  const user = parts[3] || "";
  if (edge && user) return `${edge} / ${user}`;
  if (edge) return edge;
  return scopeKey;
}

// Switch to a different dashboard profile. Persists the choice and
// re-renders. Charts re-fetch because mountWidgetData() runs again.
function setActiveProfile(key) {
  state.activeProfileKey = key || "";
  try { localStorage.setItem("tnlite-profile", state.activeProfileKey); } catch (_) {}
  const active = state.dashboardProfiles.find((p) => p.key === key);
  if (active) {
    state.dashboardLayout = active.payload;
    state.dashboardWidgets = Array.isArray(active.payload?.widgets) ? active.payload.widgets : [];
  }
  // Clear the chart cache so the new layout fetches fresh data.
  chartDataCache.clear();
  if (state.tab === "dashboard") renderBody();
}

// Update a single dashboard preference and persist.
function setDashPref(name, value) {
  const next = { ...(state.dashPrefs || {}), [name]: value };
  state.dashPrefs = next;
  try { localStorage.setItem("tnlite-dash-prefs", JSON.stringify(next)); } catch (_) {}
  if (state.tab === "dashboard") renderBody();
}

// Per-(gateway, tag) chart data cache. Lets us avoid re-fetching every time
// the dashboard re-renders. Keys: "gw|tag". Entries: { rows, fetched_at }.
const chartDataCache = new Map();
const CHART_TTL_MS = 30_000; // refresh charts at most every 30s when online

// Subscribe to dashboard_configurations updates so the Lite view reflects
// the operator's widget changes within seconds. RLS scopes the channel
// to the viewer's tenant.
let dashboardChannel = null;
async function subscribeDashboardConfig() {
  if (!supabase || !session) return;
  try {
    if (dashboardChannel) await supabase.removeChannel(dashboardChannel).catch(() => {});
    dashboardChannel = supabase.channel("lite-dashboard-config")
      .on("postgres_changes",
        { event: "*", schema: "public", table: "dashboard_configurations" },
        () => fetchDashboardConfig())
      .subscribe();
  } catch (_e) {}
}

async function fetchTagHistory(gateway_id, tag_name, rangeMs) {
  if (!supabase) throw new Error("not ready");
  const fromTs = new Date(Date.now() - rangeMs).toISOString();
  const { data, error } = await supabase
    .from("historian_readings")
    .select("ts_utc, value")
    .eq("tag_name", tag_name)
    .eq("gateway_id", gateway_id)
    .gte("ts_utc", fromTs)
    .order("ts_utc", { ascending: true })
    .limit(5000);
  if (error) throw error;
  return data || [];
}

// ---------- Polling / Realtime lifecycle ---------------------------------
// Try Supabase Realtime first; fall back to short-interval polling if the WS
// can't connect (corporate proxies, offline, RLS misconfig, etc).
function startPolls() {
  stopAllPolls();
  const pollMs = Number(cfg?.live_poll_ms || 1000);

  // live_latest powers the Live tab AND the Dashboard mirror.
  if (state.tab === "dashboard") {
    if (!liveChannel) {
      subscribeLive();
    } else {
      // Already subscribed — just refresh the snapshot to catch any rows
      // that landed while the tab was hidden.
      fetchLive();
    }
    // Belt-and-braces poll at half the previous rate. If Realtime is healthy
    // this just refreshes the snapshot occasionally; if it dropped silently,
    // the user still sees data.
    livePoll = setInterval(fetchLive, Math.max(pollMs * 4, 4000));
    if (state.tab === "dashboard") {
      fetchDashboardConfig();
      if (!dashboardChannel) subscribeDashboardConfig();
    }
  }
  if (state.tab === "history") {
    fetchHistory();
    historyPoll = setInterval(fetchHistory, 5000);
  }
  if (state.tab === "alarms") {
    fetchAlarms();
    if (!alarmChannel) subscribeAlarms();
    alarmsPoll = setInterval(fetchAlarms, 30000); // safety net only
  }
  if (state.tab === "power") {
    fetchPower();
    powerPoll = setInterval(fetchPower, 3000);
  }
}

// ---------- Drawer (chart on tap) -----------------------------------------
const RANGE_OPTS = [
  { label: "5m", ms: 5 * 60_000 },
  { label: "15m", ms: 15 * 60_000 },
  { label: "1h", ms: 60 * 60_000 },
  { label: "6h", ms: 6 * 60 * 60_000 },
  { label: "24h", ms: 24 * 60 * 60_000 },
  { label: "7d", ms: 7 * 24 * 60 * 60_000 },
];

async function openDrawer(gateway_id, gateway_name, tag_name, value, ts) {
  const defaultRangeMs = Math.max(60_000, Number(cfg?.default_chart_range_minutes || 60) * 60_000);
  state.drawer = { gateway_id, gateway_name, tag_name, value, ts, range_ms: defaultRangeMs, rows: null, loading: true, error: "" };
  render();
  try {
    state.drawer.rows = await fetchTagHistory(gateway_id, tag_name, defaultRangeMs);
    state.drawer.loading = false;
    render();
  } catch (e) {
    state.drawer.error = e.message || String(e);
    state.drawer.loading = false;
    render();
  }
}

async function setDrawerRange(ms) {
  if (!state.drawer) return;
  state.drawer.range_ms = ms;
  state.drawer.loading = true;
  state.drawer.rows = null;
  state.drawer.error = "";
  render();
  try {
    state.drawer.rows = await fetchTagHistory(state.drawer.gateway_id, state.drawer.tag_name, ms);
    state.drawer.loading = false;
    render();
  } catch (e) {
    if (state.drawer) { state.drawer.error = e.message || String(e); state.drawer.loading = false; }
    render();
  }
}

function closeDrawer() {
  state.drawer = null;
  render();
}

function mountChart() {
  if (!state.drawer || !state.drawer.rows || state.drawer.rows.length === 0) return;
  if (typeof uPlot === "undefined") return;
  const mount = $("#uplot-mount");
  if (!mount) return;
  const sorted = state.drawer.rows.slice().sort((a, b) =>
    Date.parse(a.ts_utc || 0) - Date.parse(b.ts_utc || 0));
  const xs = sorted.map((r) => Math.floor(Date.parse(r.ts_utc) / 1000));
  const ys = sorted.map((r) => { const n = Number(r.value); return Number.isFinite(n) ? n : null; });
  mount.innerHTML = "";
  const w = mount.clientWidth || 600;
  new uPlot({
    width: w,
    height: 300,
    cursor: { show: true },
    scales: { x: { time: true } },
    series: [
      {},
      { label: state.drawer.tag_name, stroke: "#14a89a", width: 1.8, points: { show: false } },
    ],
    axes: [
      { stroke: "#8a98ab", grid: { stroke: "rgba(138,152,171,0.15)" } },
      { stroke: "#8a98ab", grid: { stroke: "rgba(138,152,171,0.15)" } },
    ],
  }, [xs, ys], mount);
}

// ---------- Rendering -----------------------------------------------------
// Latency status pill — uses the SAME .status-pill classes the edge app
// uses for its Edge Link indicator so the visual language matches.
function buildLatencyPill() {
  const l = state.latency || {};
  const age = l.last_age_ms;
  const rtt = l.last_rtt_ms;
  const tx = l.transport || "polling";
  let cls = "status-online";
  let label = "LIVE";
  if (age == null) { cls = "status-muted"; label = "LOADING"; }
  else if (age > 3000) { cls = "status-offline"; label = "STALE"; }
  else if (age > 1000) { cls = "status-warning"; label = "DELAYED"; }
  else if (tx !== "realtime") { cls = "status-online"; label = "POLLING"; }
  const fmt = (v) => v == null ? "—" : v < 1000 ? `${Math.round(v)} ms` : `${(v / 1000).toFixed(1)} s`;
  const title = `Transport: ${tx === "realtime" ? "WebSocket push" : "HTTP polling"}` +
                `\nLatest sample age: ${fmt(age)}` +
                `\nLast request round-trip: ${fmt(rtt)}` +
                `\nLast update: ${l.last_event_at ? new Date(l.last_event_at).toLocaleTimeString() : "—"}`;
  return el("span", { class: `status-pill ${cls}`, title, "aria-label": title },
    el("span", { class: "pill-dot" }),
    el("span", {}, `${label} · ${fmt(age)}`),
  );
}

// Cheap re-render of just the pill — called by both the 1 Hz tick and the
// data fetchers. Avoids ripping the whole header DOM each second.
function renderHeaderLatency() {
  const slot = $("#header-latency-slot");
  if (!slot) return;
  updateLatencyAge();
  slot.replaceChildren(buildLatencyPill());
}

// Theme toggle — same behaviour as the edge app's icon-btn theme button.
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  try { localStorage.setItem("trustnode_lite_theme", theme); } catch (_) {}
}

function currentTheme() {
  try {
    const stored = localStorage.getItem("trustnode_lite_theme");
    if (stored === "light" || stored === "dark") return stored;
  } catch (_) {}
  return "light"; // default light, matches the edge app
}

function toggleTheme() {
  const next = currentTheme() === "dark" ? "light" : "dark";
  applyTheme(next);
  renderHeader();
}

// ============================================================
// Widget renderer
// Reads the widget layout the desktop edge published. Each widget has:
//   id, type, color, position: {x,y,w,h}, config: {...}, title?
// On desktop (>720px) we use a 20-column CSS grid that respects the
// configured x/y/w/h; on mobile we stack widgets in a single column.
// ============================================================
const SKIPPED_TYPES = new Set(["ip_camera", "cloud_sync_status"]);

function renderDashboard() {
  if (state.dashboardError) {
    return el("div", { class: "banner" }, `Dashboard read failed: ${state.dashboardError}`);
  }
  const widgets = (state.dashboardWidgets || [])
    .filter((w) => w && !SKIPPED_TYPES.has(String(w.type || "")));

  // Toolbar always renders so the viewer can switch profile / per-row
  // even before any widgets are configured.
  const toolbar = renderDashboardToolbar(widgets.length);

  if (widgets.length === 0) {
    return el("div", {},
      toolbar,
      el("div", { class: "empty" },
        "No dashboard widgets have been published from the edge yet. ",
        "Configure widgets in the TrustNode desktop app and they will appear here.")
    );
  }
  // Build a fast lookup so KPI/chart widgets can find their live value.
  const liveByKey = new Map();
  for (const r of state.liveRows) {
    liveByKey.set(`${r.gateway_id}|${r.tag_name}`, r);
  }
  const prefs = state.dashPrefs || {};
  const perRow = Math.max(1, Math.min(2, Number(prefs.perRow) || 2));
  const cardH  = Math.max(140, Math.min(520, Number(prefs.cardHeight) || 220));
  return el("div", {},
    toolbar,
    el("div", {
      class: `widget-flow per-row-${perRow}`,
      style: { "--lite-card-height": `${cardH}px` },
    },
      ...widgets.map((w) => renderWidget(w, liveByKey))
    )
  );
}

// Dashboard toolbar: profile dropdown, per-row toggle, card-height slider,
// sample count, online-gateway summary badge. Same gestalt as the desktop
// dashboard configurator but read-only (the underlying layout is operator-
// owned; the viewer only tweaks how they SEE it locally).
function renderDashboardToolbar(widgetCount) {
  const prefs = state.dashPrefs || {};
  const profiles = state.dashboardProfiles || [];
  const onlineGateways = Object.entries(state.gatewayLastSeen || {})
    .filter(([_, t]) => Date.now() - t < 30_000).length;
  const totalGateways = Object.keys(state.gatewayLastSeen || {}).length;

  return el("div", { class: "dash-toolbar" },
    el("div", { class: "dash-toolbar-left" },
      el("h2", { class: "section-h2" }, "Dashboard"),
      el("span", { class: "section-meta" }, `${widgetCount} widget${widgetCount === 1 ? "" : "s"}`),
    ),
    el("div", { class: "dash-toolbar-right" },
      // Online gateways badge — green if any gateway has fresh data
      el("span", {
        class: `status-pill ${onlineGateways > 0 ? "status-online" : "status-offline"}`,
        title: totalGateways === 0
          ? "No gateways reporting"
          : `${onlineGateways} of ${totalGateways} gateways reporting within 30s`,
      },
        el("span", { class: "pill-dot" }),
        el("span", {}, `Gateways: ${onlineGateways}/${totalGateways || "0"}`),
      ),
      // Profile dropdown — only when there are 2+
      profiles.length > 1
        ? el("label", { class: "dash-control" },
            el("span", { class: "dash-control-label" }, "Profile"),
            el("select", {
              value: state.activeProfileKey || "",
              onchange: (e) => setActiveProfile(e.target.value),
            },
              ...profiles.map((p) => el("option", {
                value: p.key,
                selected: p.key === state.activeProfileKey ? "" : null,
              }, p.label))
            )
          )
        : null,
      // Per-row toggle (1 or 2 cards per row)
      el("label", { class: "dash-control" },
        el("span", { class: "dash-control-label" }, "Per row"),
        el("div", { class: "seg" },
          el("button", {
            class: `seg-btn ${(prefs.perRow || 2) === 1 ? "active" : ""}`,
            onclick: () => setDashPref("perRow", 1),
          }, "1"),
          el("button", {
            class: `seg-btn ${(prefs.perRow || 2) === 2 ? "active" : ""}`,
            onclick: () => setDashPref("perRow", 2),
          }, "2"),
        )
      ),
      // Card height slider
      el("label", { class: "dash-control" },
        el("span", { class: "dash-control-label" }, "Card height"),
        el("input", {
          type: "range",
          min: "140",
          max: "520",
          step: "20",
          value: String(prefs.cardHeight || 220),
          oninput: (e) => setDashPref("cardHeight", Number(e.target.value)),
        }),
        el("span", { class: "dash-control-value" }, `${prefs.cardHeight || 220}px`),
      ),
      // Sample count (chart history length)
      el("label", { class: "dash-control" },
        el("span", { class: "dash-control-label" }, "Samples"),
        el("select", {
          value: String(prefs.sampleCount || 20),
          onchange: (e) => {
            setDashPref("sampleCount", Number(e.target.value));
            // Invalidate cached chart data so charts re-fetch with the new count.
            chartDataCache.clear();
          },
        },
          ...[20, 50, 100, 250, 500, 1000].map((n) => el("option", {
            value: String(n),
            selected: (prefs.sampleCount || 20) === n ? "" : null,
          }, String(n)))
        )
      ),
    )
  );
}

function widgetTitle(w) {
  const cfg = w?.config || {};
  return String(w?.title || cfg.title || cfg.tag_name || cfg.text || "").trim();
}

function renderWidget(w, liveByKey) {
  const type = String(w?.type || "");
  const cfg = w?.config || {};
  const color = String(w?.color || "#14a89a");
  const wrap = (inner, extraClass = "") => el("div", {
    class: `widget widget-${type} ${extraClass}`,
    "data-widget-id": w?.id || "",
    "data-gw": cfg.gateway_id || "",
    "data-tag": cfg.tag_name || "",
  }, inner);

  if (type === "fixed_text") {
    return wrap(el("div", { class: "widget-body widget-text" }, cfg.text || ""));
  }
  if (type === "divider") {
    return wrap(el("div", { class: "widget-body widget-divider" }, cfg.text || ""));
  }
  if (type === "image") {
    if (!cfg.source_url) return wrap(el("div", { class: "widget-empty muted" }, "no image"));
    return wrap(el("img", { class: "widget-image", src: cfg.source_url, alt: widgetTitle(w) || "image" }));
  }
  if (type === "text_kpi" || type === "value_kpi") {
    const row = liveByKey.get(`${cfg.gateway_id}|${cfg.tag_name}`);
    const value = row ? row.value : null;
    const ts = row ? row.ts_utc : null;
    const isText = type === "text_kpi";
    const title = widgetTitle(w) || cfg.tag_name || "—";
    return wrap(
      el("button", {
        class: `widget-kpi ${freshnessClass(ts)}`,
        onclick: () => cfg.tag_name && openDrawer(cfg.gateway_id, cfg.gateway_id || "", cfg.tag_name, value, ts),
      },
        el("div", { class: "widget-title" }, title),
        el("div", { class: "widget-value", style: { color } },
          isText ? (row?.value_text || row?.quality_label || (value == null ? "—" : String(value)))
                 : fmtVal(value)
        ),
        el("div", {
          class: "widget-sub",
          "data-gw-name": (cfg.gateway_name || cfg.gateway_id || "—"),
        },
          (cfg.gateway_name || cfg.gateway_id || "—"),
          " · ", fmtAge(ts), " ago"
        ),
      ),
      "widget-kpi-wrap"
    );
  }
  if (type === "meter_chart") {
    const row = liveByKey.get(`${cfg.gateway_id}|${cfg.tag_name}`);
    const value = Number(row?.value);
    const min = Number(cfg.meter_min ?? cfg.min ?? 0);
    const max = Number(cfg.meter_max ?? cfg.max ?? 100);
    const ts = row ? row.ts_utc : null;
    return wrap(
      el("button", {
        class: `widget-meter ${freshnessClass(ts)}`,
        onclick: () => cfg.tag_name && openDrawer(cfg.gateway_id, cfg.gateway_id || "", cfg.tag_name, value, ts),
      },
        el("div", { class: "widget-title" }, widgetTitle(w) || cfg.tag_name || "—"),
        renderMeterSvg(value, min, max, color),
        el("div", { class: "widget-sub" }, fmtAge(ts), " ago"),
      ),
      "widget-meter-wrap"
    );
  }
  if (type === "pie_chart") {
    return wrap(
      el("div", { class: "widget-body" },
        el("div", { class: "widget-title" }, widgetTitle(w) || "Pie"),
        el("div", { class: "widget-pie-mount", "data-w": w?.id || "" })
      ),
      "widget-pie-wrap"
    );
  }
  if (type === "line_chart" || type === "line_area_chart" || type === "bar_chart") {
    // Mounting point; chart instances are rendered after DOM lands.
    return wrap(
      el("div", { class: "widget-body widget-chart" },
        el("div", { class: "widget-title" }, widgetTitle(w) || cfg.tag_name || "—"),
        el("div", { class: "widget-chart-mount", "data-w": w?.id || "",
                    "data-type": type,
                    "data-gw": cfg.gateway_id || "",
                    "data-tag": cfg.tag_name || "",
                    "data-color": color }),
      ),
      "widget-chart-wrap"
    );
  }
  if (type === "table_list") {
    return wrap(
      el("div", { class: "widget-body" },
        el("div", { class: "widget-title" }, widgetTitle(w) || "Recent readings"),
        el("div", { class: "widget-table-mount", "data-w": w?.id || "",
                    "data-gw": cfg.gateway_id || "",
                    "data-tag": cfg.tag_name || "" }),
      ),
      "widget-table-wrap"
    );
  }
  // Unknown / unsupported type — show a small placeholder.
  return wrap(el("div", { class: "widget-empty muted" }, type || "widget"));
}

// SVG arc for the meter widget. Stays simple — semicircle 0..180 deg.
function renderMeterSvg(value, min, max, color) {
  const v = Number.isFinite(value) ? Math.max(min, Math.min(max, value)) : min;
  const pct = (max > min) ? (v - min) / (max - min) : 0;
  const angle = -90 + pct * 180; // -90deg..+90deg
  const cx = 60, cy = 60, r = 46;
  const trackPath = "M 14 60 A 46 46 0 0 1 106 60";
  // Compute path for the filled arc.
  const startA = -180 * Math.PI / 180;
  const endA = (angle - 90) * Math.PI / 180; // because arc starts from -180deg of unit circle
  const x1 = cx + r * Math.cos(startA), y1 = cy + r * Math.sin(startA);
  const x2 = cx + r * Math.cos(endA),   y2 = cy + r * Math.sin(endA);
  const large = (endA - startA) > Math.PI ? 1 : 0;
  const fillPath = `M ${x1.toFixed(1)} ${y1.toFixed(1)} A ${r} ${r} 0 ${large} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`;
  return el("div", { class: "widget-meter-svg",
                     html: `
    <svg viewBox="0 0 120 80" preserveAspectRatio="xMidYMax meet" width="100%" height="100%">
      <path d="${trackPath}" stroke="#2a2a2a55" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="${fillPath}" stroke="${color}" stroke-width="10" fill="none" stroke-linecap="round"/>
      <text x="60" y="65" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700" fill="currentColor">${fmtVal(v)}</text>
    </svg>` });
}

// Fetch the last-N readings for a (gateway, tag) pair, using an in-memory
// cache so identical widgets don't re-hit Supabase on every render.
//
// Cache rules:
//   - Fresh entry (< CHART_TTL_MS old) → return cached rows, no fetch.
//   - Stale entry AND gateway online → refresh from Supabase.
//   - Stale entry AND gateway offline → keep showing the stale rows (the
//     viewer would otherwise see an empty chart for an off-shift gateway).
async function getChartRowsCached(gw, tag, sampleCount) {
  const key = `${gw}|${tag}|${sampleCount}`;
  const now = Date.now();
  const hit = chartDataCache.get(key);
  if (hit && (now - hit.fetched_at) < CHART_TTL_MS) return hit.rows;
  if (hit && !isGatewayOnline(gw)) {
    // Show stale data and let the viewer know via the offline badge —
    // don't bother Supabase when the gateway can't be feeding new rows anyway.
    return hit.rows;
  }
  // Fetch latest-N rows directly (cheaper than range scan + slice).
  const { data, error } = await supabase
    .from("historian_readings")
    .select("ts_utc, value")
    .eq("tag_name", tag)
    .eq("gateway_id", gw)
    .order("ts_utc", { ascending: false })
    .limit(Math.max(2, Math.min(2000, Number(sampleCount) || 20)));
  if (error) throw error;
  const rows = (data || []).slice().reverse(); // ascending for charts
  chartDataCache.set(key, { rows, fetched_at: now });
  return rows;
}

// After the dashboard renders, walk every chart/table/pie mount and
// populate it with real data. Called from renderDashboardCombined.
async function mountWidgetData() {
  const sampleCount = Number(state.dashPrefs?.sampleCount) || 20;

  // ---- Inline charts (line/area/bar) ----
  if (typeof uPlot === "undefined") return;
  const chartMounts = document.querySelectorAll(".widget-chart-mount");
  for (const m of chartMounts) {
    const gw = m.getAttribute("data-gw") || "";
    const tag = m.getAttribute("data-tag") || "";
    const type = m.getAttribute("data-type") || "line_chart";
    const color = m.getAttribute("data-color") || "#14a89a";
    if (!tag) { m.replaceChildren(el("div", { class: "muted", style: { fontSize: "11px" } }, "no tag")); continue; }
    try {
      const rows = await getChartRowsCached(gw, tag, sampleCount);
      if (!rows || rows.length === 0) {
        m.replaceChildren(el("div", { class: "muted", style: { fontSize: "11px" } }, "no samples"));
        continue;
      }
      const xs = rows.map((r) => Math.floor(Date.parse(r.ts_utc) / 1000));
      const ys = rows.map((r) => { const n = Number(r.value); return Number.isFinite(n) ? n : null; });
      m.innerHTML = "";
      const w = m.clientWidth || 240;
      const h = m.clientHeight || 140;
      const seriesCfg =
        type === "bar_chart" ?
          { label: tag, stroke: color, fill: color, paths: uPlot?.paths?.bars?.({ size: [0.8] }) || undefined, points: { show: false } } :
        type === "line_area_chart" ?
          { label: tag, stroke: color, fill: color + "33", width: 1.5, points: { show: false } } :
          { label: tag, stroke: color, width: 1.5, points: { show: false } };
      new uPlot({
        width: w, height: h, cursor: { show: false }, legend: { show: false },
        scales: { x: { time: true } },
        series: [{}, seriesCfg],
        axes: [
          { stroke: "#8a98ab", size: 18, grid: { show: false } },
          { stroke: "#8a98ab", size: 30, grid: { stroke: "rgba(138,152,171,0.15)" } },
        ],
      }, [xs, ys], m);
      // Add an offline overlay if the gateway hasn't been seen in 30s.
      if (gw && !isGatewayOnline(gw)) {
        const overlay = el("div", { class: "widget-offline-overlay", title: "Gateway offline" }, "OFFLINE");
        m.appendChild(overlay);
      }
    } catch (e) {
      m.replaceChildren(el("div", { class: "muted", style: { fontSize: "11px" } }, "chart err"));
    }
  }

  // ---- Table widgets ----
  const tableMounts = document.querySelectorAll(".widget-table-mount");
  for (const m of tableMounts) {
    const gw = m.getAttribute("data-gw") || "";
    const tag = m.getAttribute("data-tag") || "";
    if (!tag) { m.replaceChildren(el("div", { class: "muted", style: { fontSize: "11px" } }, "no tag")); continue; }
    try {
      const rows = await getChartRowsCached(gw, tag, sampleCount);
      const last = (rows || []).slice().reverse();
      if (last.length === 0) { m.replaceChildren(el("div", { class: "muted", style: { fontSize: "11px" } }, "no samples")); continue; }
      m.replaceChildren(el("table", { class: "hist-table", style: { fontSize: "11px" } },
        el("thead", {}, el("tr", {}, el("th", {}, "Time"), el("th", {}, "Value"))),
        el("tbody", {}, ...last.map((r) =>
          el("tr", {}, el("td", {}, fmtTs(r.ts_utc)), el("td", { class: "num" }, fmtVal(r.value)))
        )),
      ));
    } catch (e) {
      m.replaceChildren(el("div", { class: "muted", style: { fontSize: "11px" } }, "table err"));
    }
  }

  // ---- Pie charts — same uPlot lib isn't great for pies, render a simple SVG ----
  const pieMounts = document.querySelectorAll(".widget-pie-mount");
  for (const m of pieMounts) {
    m.replaceChildren(el("div", { class: "muted", style: { fontSize: "11px" } }, "pie pending"));
  }
}

function renderDrawer() {
  if (!state.drawer) return null;
  const d = state.drawer;
  return el("div", { class: "drawer-back", onclick: (e) => { if (e.target.classList.contains("drawer-back")) closeDrawer(); } },
    el("div", { class: "drawer" },
      el("header", {},
        el("h3", {}, `${d.tag_name} · ${d.gateway_name || d.gateway_id}`),
        el("button", { class: "close", onclick: closeDrawer }, "Close")
      ),
      el("div", { class: "chart-wrap", id: "chart-wrap" },
        d.loading
          ? el("div", { class: "empty" }, el("div", { class: "spinner" }), " loading…")
          : d.error
            ? el("div", { class: "banner" }, d.error)
            : (d.rows && d.rows.length > 0)
              ? el("div", { id: "uplot-mount", style: { width: "100%", height: "300px" } })
              : el("div", { class: "empty" }, "No samples in this range.")
      ),
      el("div", { class: "chart-meta" },
        el("span", {}, "Latest: ", el("strong", {}, fmtVal(d.value))),
        el("span", {}, "Updated: ", fmtTs(d.ts)),
        el("span", {}, "Samples: ", d.rows ? d.rows.length : 0)
      ),
      el("div", { class: "range-tabs" },
        ...RANGE_OPTS.map((opt) => el("button", {
          class: d.range_ms === opt.ms ? "active" : "",
          onclick: () => setDrawerRange(opt.ms),
        }, opt.label))
      )
    )
  );
}

function navItems() {
  // Order matters: Dashboard (live) -> Power -> Historian -> Reporting -> Alarms.
  // We dropped the separate "Live" item because the Dashboard now IS the live
  // tile grid plus any configured widgets — same single source of truth a
  // remote operator wants to see first.
  const items = [["dashboard", icoGrid(), "Dashboard"]];
  if (cfg?.show_power_tab !== false) items.push(["power", icoBolt(), "Power"]);
  items.push(["history", icoList(), "Historian"]);
  if (cfg?.show_reporting_tab !== false) items.push(["reporting", icoReport(), "Reporting"]);
  if (cfg?.show_alarms_tab !== false) items.push(["alarms", icoBell(), "Alarms"]);
  return items;
}

// Sidebar (desktop) navigation matching the edge app's nav-section + nav-item.
function renderSidebar() {
  const root = $("#sidebar-root");
  if (!root) return;
  root.replaceChildren(
    el("div", { class: "sidebar-scroll" },
      el("div", { class: "nav-section" },
        el("div", { class: "nav-group-title" }, "Overview"),
        ...navItems().map(([key, ico, label]) => el("button", {
          class: `nav-item ${state.tab === key ? "active" : ""}`,
          onclick: () => {
            if (state.tab === key) return;
            state.tab = key;
            renderNav();
            renderBody();
            startPolls();
          },
        },
          el("span", { class: "nav-icon" }, ico),
          el("span", {}, label),
        ))
      )
    ),
    el("div", { class: "sidebar-footer" },
      el("div", { class: "user-box" },
        el("div", {},
          el("div", { class: "user-name" }, state.userEmail || "Signed in"),
          el("div", { class: "user-role" }, state.tenantLabel || cfg?.customer_label || ""),
        )
      )
    )
  );
}

// Bottom-tab bar (mobile) — same items, CSS hides this on wide screens.
function renderTabs() {
  const root = $("#tabs-root");
  if (!root) return;
  root.replaceChildren(
    ...navItems().map(([key, ico, label]) => el("button", {
      class: `tab ${state.tab === key ? "active" : ""}`,
      onclick: () => {
        if (state.tab === key) return;
        state.tab = key;
        renderNav();
        renderBody();
        startPolls();
      }
    },
      el("span", { class: "ico" }, ico),
      el("span", {}, label)
    ))
  );
}

// Re-render both nav surfaces in one call.
function renderNav() { renderSidebar(); renderTabs(); }

// Inline icons used by the nav (sidebar + bottom tabs).
function icoLive() { return el("span", { html: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>' }); }
function icoGrid() { return el("span", { html: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>' }); }
function icoList() { return el("span", { html: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>' }); }
function icoBolt() { return el("span", { html: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>' }); }
function icoReport() { return el("span", { html: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>' }); }

// Reporting view. The edge generates reports locally; we do not yet mirror
// the generated_reports table to Supabase, so for v1 this is an honest
// placeholder rather than a stub list of fake rows.
function renderReporting() {
  return el("div", {},
    el("div", { class: "section" },
      el("h2", {}, "Reporting"),
      el("span", { class: "meta" }, "Read-only")
    ),
    el("div", { class: "card", style: { textAlign: "center", padding: "32px 20px" } },
      el("div", { style: { fontSize: "14px", fontWeight: "600", marginBottom: "8px" } },
        "Reports are generated on the edge device."),
      el("div", { class: "muted", style: { fontSize: "12px", lineHeight: "1.5", maxWidth: "440px", margin: "0 auto" } },
        "Open the TrustNode desktop app on the edge to schedule, generate, ",
        "or email reports. Once cloud sync of the report registry is enabled, ",
        "every report will appear here read-only with a download link.")
    )
  );
}

function renderBody() {
  const body = $("#body-root");
  if (!body) return;
  let content;
  switch (state.tab) {
    case "dashboard": content = renderDashboardCombined(); break;
    case "power":     content = renderPower(); break;
    case "history":   content = renderHistory(); break;
    case "reporting": content = renderReporting(); break;
    case "alarms":    content = renderAlarms(); break;
    default:          content = renderDashboardCombined();
  }
  body.replaceChildren(content);
}

// Combined Dashboard view: the configured widget mirror at the top, the
// auto live tile grid below. The single landing page for a remote viewer.
function renderDashboardCombined() {
  const wrap = el("div", {});
  // Section 1: configured widgets (if any). renderDashboard() already returns
  // the right element; we append it so the user sees their widgets first.
  const widgets = (state.dashboardWidgets || []).filter((w) =>
    w && !SKIPPED_TYPES.has(String(w.type || "")));
  if (widgets.length > 0) {
    wrap.appendChild(renderDashboard());
    // Defer chart/table population until the DOM lands so clientWidth is correct.
    requestAnimationFrame(() => { mountWidgetData().catch(() => {}); });
  }
  // Section 2: the full live tile grid — every tag the viewer can see.
  wrap.appendChild(renderLive());
  return wrap;
}

function renderLoggedIn() {
  // Shell: header on top, body with sidebar + main, bottom tabs for mobile.
  $("#app").replaceChildren(
    el("div", { class: "app-shell" },
      el("header", { class: "app-header", id: "header-root" }),
      el("div", { class: "body" },
        el("aside", { class: "sidebar", id: "sidebar-root" }),
        el("main", { id: "body-root" }),
      ),
      el("nav", { class: "tabs", id: "tabs-root" }),
    )
  );
  renderHeader();
  renderNav();
  renderBody();
  const drawer = renderDrawer();
  if (drawer) $("#app").appendChild(drawer);
  if (state.drawer && state.drawer.rows) requestAnimationFrame(mountChart);
}

function renderLogin() {
  let busy = false;
  const card = el("div", { class: "login-card" },
    el("div", { class: "brand-stack" },
      el("img", { src: "./trustnode_logo.png", alt: "TrustNode",
                  onerror: (e) => { e.target.style.display = "none"; } }),
      el("h2", {}, "TrustNode Lite"),
      el("div", { class: "subtitle" }, "Sign in to view your edge data"),
    ),
    el("label", {}, "Email"),
    el("input", { id: "lite-user", type: "email", autocomplete: "username" }),
    el("label", {}, "Password"),
    el("input", { id: "lite-pass", type: "password", autocomplete: "current-password" }),
    el("div", { class: "err", id: "lite-err" }, ""),
    el("button", { id: "lite-go", class: "btn btn-primary btn-full" }, "Sign in"),
    el("a", { href: "#", id: "lite-magic", class: "magic-link" }, "Email me a magic link instead"),
  );
  $("#app").replaceChildren(el("div", { class: "login-shell" }, card));
  const submit = async () => {
    if (busy) return;
    busy = true;
    const go = $("#lite-go"); const errEl = $("#lite-err");
    go.disabled = true; go.textContent = "Signing in…"; errEl.textContent = "";
    try {
      const email = $("#lite-user").value.trim();
      const password = $("#lite-pass").value;
      if (!email || !password) throw new Error("Email and password are required");
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) throw error;
      session = data.session;
      render();
    } catch (e) {
      errEl.textContent = e.message || String(e);
      busy = false;
      $("#lite-go").disabled = false;
      $("#lite-go").textContent = "Sign in";
    }
  };
  $("#lite-go").addEventListener("click", submit);
  $("#lite-pass").addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
  $("#lite-user").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#lite-pass").focus(); });
  $("#lite-magic").addEventListener("click", async (e) => {
    e.preventDefault();
    const email = $("#lite-user").value.trim();
    if (!email) { $("#lite-err").textContent = "Type your email above first"; return; }
    try {
      const { error } = await supabase.auth.signInWithOtp({ email, options: { emailRedirectTo: window.location.href } });
      if (error) throw error;
      $("#lite-err").textContent = "Check your inbox for the sign-in link.";
    } catch (err) {
      $("#lite-err").textContent = err.message || String(err);
    }
  });
  setTimeout(() => $("#lite-user").focus(), 30);
}

function renderConfigError(message) {
  $("#app").replaceChildren(el("div", { class: "login" },
    el("h2", {}, "TrustNode Lite — not configured"),
    el("div", { class: "err" }, message),
    el("p", { class: "muted", style: { fontSize: "12px", lineHeight: "1.4" } },
      "Drop a ", el("code", {}, "config.json"), " next to this page with your Supabase URL and anon key. See ",
      el("code", {}, "config.json.example"), " for the expected shape.")
  ));
}

function render() {
  stopAllPolls();
  if (!session) stopAllChannels();
  if (!supabase) { renderConfigError("Supabase client not initialised."); return; }
  if (!session) { renderLogin(); return; }
  renderLoggedIn();
  startPolls();
}

// ---------- Boot -----------------------------------------------------------
(async () => {
  try {
    await loadConfig();
  } catch (e) {
    renderConfigError(e.message || String(e));
    return;
  }
  // Listen for auth changes (sign-in/out, token refresh) and re-render.
  supabase.auth.onAuthStateChange((_event, newSession) => {
    session = newSession || null;
    state.userEmail = session?.user?.email || "";
    render();
  });
  // Read the tenant label once we have a session for nicer header copy.
  if (session) {
    state.userEmail = session?.user?.email || "";
    supabase.from("lite_profiles").select("tenant_id, customer_id").limit(1).maybeSingle().then(({ data }) => {
      if (data) {
        state.tenantLabel = data.customer_id || data.tenant_id || (cfg?.customer_label || "");
        renderHeader();
        renderNav();
      }
    }).catch(() => {});
  }
  // Apply the saved theme (or default light) BEFORE first render so the
  // login screen / first paint shows the right palette.
  applyTheme(currentTheme());
  render();

  // Register service worker for installable offline shell.
  if ("serviceWorker" in navigator) {
    try { navigator.serviceWorker.register("./sw.js"); } catch (_) {}
  }
  // 1 Hz header refresh so the latency overlay's "age" counter ticks without
  // a full re-render of the body. Cheap (one badge swap).
  if (!headerRefreshTick) {
    headerRefreshTick = setInterval(() => {
      if (!document.hidden && session) renderHeaderLatency();
    }, 1000);
  }
  // Pause polling AND tear down WS channels when the tab is hidden, restart
  // when visible — saves battery and avoids zombie subscriptions.
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      stopAllPolls();
      stopAllChannels();
    } else if (session) {
      startPolls();
    }
  });
})();
  </script>
