// ============================================================
// Historian view with a one-row filter bar: gateway / tag / time range /
// limit. Filters are server-side so we don't drag thousands of rows down
// just to grep them client-side. Both gateway and tag use case-insensitive
// substring matching via ilike. Re-runs whenever a filter changes; auto-
// refreshes every 5s.
const HISTORY_RANGES = [
  { label: "15m", ms: 15 * 60_000 },
  { label: "1h",  ms: 60 * 60_000 },
  { label: "6h",  ms: 6 * 60 * 60_000 },
  { label: "24h", ms: 24 * 60 * 60_000 },
  { label: "7d",  ms: 7 * 24 * 60 * 60_000 },
  { label: "All", ms: 0 },
];
function HistorianView() {
  const [rows, setRows] = useState(null);
  const [error, setError] = useState("");
  const [gwFilter, setGwFilter] = useState("");
  const [tagFilter, setTagFilter] = useState("");
  const [rangeMs, setRangeMs] = useState(60 * 60_000);
  const [limit, setLimit] = useState(300);

  useEffect(() => {
    let stop = false;
    const f = async () => {
      let q = supabase
        .from("historian_readings")
        .select("gateway_id, gateway_name, device_name, tag_name, value, quality, quality_label, ts_utc")
        .order("ts_utc", { ascending: false })
        .limit(Math.max(20, Math.min(5000, Number(limit) || 300)));
      if (rangeMs > 0) {
        const from = new Date(Date.now() - rangeMs).toISOString();
        q = q.gte("ts_utc", from);
      }
      if (gwFilter.trim())  q = q.ilike("gateway_id", `%${gwFilter.trim()}%`);
      if (tagFilter.trim()) q = q.ilike("tag_name", `%${tagFilter.trim()}%`);
      const { data, error: e } = await q;
      if (stop) return;
      if (e) setError(e.message);
      else { setRows(data || []); setError(""); }
    };
    f();
    const t = setInterval(f, 5000);
    return () => { stop = true; clearInterval(t); };
  }, [gwFilter, tagFilter, rangeMs, limit]);

  return h("div", null,
    h("div", { className: "section" },
      h("h2", null, "Historian"),
      h("span", { className: "meta" }, rows ? `${rows.length} rows` : "")
    ),
    // One-row filter bar
    h("div", { className: "hist-filters" },
      h("input", {
        className: "hist-filter-input",
        type: "text",
        placeholder: "Gateway contains…",
        value: gwFilter,
        onChange: (e) => setGwFilter(e.target.value),
      }),
      h("input", {
        className: "hist-filter-input",
        type: "text",
        placeholder: "Tag contains…",
        value: tagFilter,
        onChange: (e) => setTagFilter(e.target.value),
      }),
      h("div", { className: "seg" },
        ...HISTORY_RANGES.map((opt) => h("button", {
          key: opt.label,
          className: `seg-btn ${rangeMs === opt.ms ? "active" : ""}`,
          onClick: () => setRangeMs(opt.ms),
        }, opt.label))
      ),
      h("select", {
        className: "hist-filter-input",
        value: String(limit),
        onChange: (e) => setLimit(Number(e.target.value)),
        title: "Max rows to fetch",
      },
        ...[100, 300, 500, 1000, 2000].map((n) => h("option", { key: n, value: String(n) }, `${n} rows`))
      ),
      (gwFilter || tagFilter) ? h("button", {
        className: "btn-ghost hist-filter-clear",
        onClick: () => { setGwFilter(""); setTagFilter(""); },
      }, "Clear") : null
    ),
    error ? h("div", { className: "banner" }, error) : null,
    rows == null
      ? h("div", { className: "empty" }, h("div", { className: "spinner" }), " loading…")
      : !rows.length
        ? h("div", { className: "empty" }, "no rows match the filters")
        : h("div", { className: "hist-table-wrap" },
            h("table", { className: "hist-table" },
              h("thead", null, h("tr", null,
                h("th", null, "Time"), h("th", null, "Gateway"),
                h("th", null, "Tag"), h("th", null, "Value"), h("th", null, "Q"))),
              h("tbody", null, ...rows.map((r, i) =>
                h("tr", { key: i },
                  h("td", { "data-label": "Time" }, fmtTs(r.ts_utc)),
                  h("td", { "data-label": "Gateway" }, r.gateway_name || r.gateway_id || "—"),
                  h("td", { "data-label": "Tag" }, r.tag_name || "—"),
                  h("td", { "data-label": "Value", className: "num" }, fmtVal(r.value)),
                  h("td", { "data-label": "Quality" }, r.quality_label || (r.quality != null ? String(r.quality) : ""))
                )))
            )
          )
  );
}

// Alarms view: shows the alarm RULES the operator configured on the edge
// (mirrored via triggers_limits.trigger_rules), each evaluated against
// the latest live_latest row for its (gateway, tag) pair. Realtime updates
// as live_latest changes — when a value crosses a threshold the row's
// TRIGGERED badge flips instantly.
function evalRule(rule, value) {
  if (rule == null || !Number.isFinite(value)) return false;
  // Match the edge's two-threshold shape: lower_enabled/lower_operator/lower_value
  // and upper_enabled/upper_operator/upper_value. If neither lower nor upper is
  // enabled the rule is informational (never triggers).
  const cmp = (op, v, t) => {
    switch (String(op || "").toLowerCase()) {
      case "<":   case "lt":   return v <  t;
      case "<=":  case "lte":  return v <= t;
      case ">":   case "gt":   return v >  t;
      case ">=":  case "gte":  return v >= t;
      case "==":  case "eq":   return v === t;
      case "!=":  case "ne":   return v !== t;
      default:                  return false;
    }
  };
  const lower = rule.lower_enabled ? cmp(rule.lower_operator || "<", value, Number(rule.lower_value)) : false;
  const upper = rule.upper_enabled ? cmp(rule.upper_operator || ">=", value, Number(rule.upper_value)) : false;
  return lower || upper;
}

function ruleConditionLabel(rule) {
  const parts = [];
  if (rule?.lower_enabled) parts.push(`${rule.lower_operator || "<"} ${rule.lower_value}`);
  if (rule?.upper_enabled) parts.push(`${rule.upper_operator || ">="} ${rule.upper_value}`);
  return parts.join("  OR  ") || "—";
}

// Reads the `alarms_setup.payload_json.alarms[]` events list from Supabase
// in realtime. The edge frontend appends to this list every time a trigger
// rule fires or clears — same payload schema, so Lite renders the exact
// same events.
//
// `activeOnly` filter is applied in derived state, not in the fetch, so the
// caller can compute a total count + a filtered list from a single sub.
function useAlarmEvents(enabled = true) {
  const [events, setEvents] = useState(null);
  const [error, setError] = useState("");

  useEffect(() => {
    if (!enabled) return;
    let stop = false;
    const f = async () => {
      const { data, error: e } = await supabase
        .from("alarms_setup")
        .select("payload_json, updated_utc")
        .order("updated_utc", { ascending: false })
        .limit(1);
      if (stop) return;
      if (e) { setError(e.message); return; }
      const row = data && data[0];
      const list = Array.isArray(row?.payload_json?.alarms) ? row.payload_json.alarms : [];
      setEvents(list);
      setError("");
    };
    f();
    const ch = supabase.channel("lite-alarms-events-rt")
      .on("postgres_changes",
        { event: "*", schema: "public", table: "alarms_setup" },
        () => f())
      .subscribe();
    return () => { stop = true; supabase.removeChannel(ch).catch(() => {}); };
  }, [enabled]);
  return { events, error };
}

// Returns the number of active, unacknowledged alarms — used by the header
// bell icon to show a red badge with the count.
function useActiveAlarmCount() {
  const { events } = useAlarmEvents(true);
  return useMemo(() => {
    if (!Array.isArray(events)) return 0;
    return events.filter((a) => a && a.event_type === "active" && !a.acknowledged).length;
  }, [events]);
}

function AlarmsView({ liveRows }) {
  const [section, setSection] = useState("active");  // "active" | "rules"
  return h("div", null,
    h("div", { className: "section" },
      h("h2", null, "Alarms"),
      h("div", { className: "seg" },
        h("button", {
          className: `seg-btn ${section === "active" ? "active" : ""}`,
          onClick: () => setSection("active"),
        }, "Active"),
        h("button", {
          className: `seg-btn ${section === "rules" ? "active" : ""}`,
          onClick: () => setSection("rules"),
        }, "Rules")
      )
    ),
    section === "active" ? h(ActiveAlarmsList, null) : h(AlarmRulesView, { liveRows })
  );
}

// Active alarms list: events with event_type === 'active' AND !acknowledged.
// Read-only on Lite — acknowledging is an edge-side action because that's
// where the rule engine lives.
function ActiveAlarmsList() {
  const { events, error } = useAlarmEvents(true);
  const [showAll, setShowAll] = useState(false);  // when true include cleared/acknowledged

  const filtered = useMemo(() => {
    if (!Array.isArray(events)) return [];
    if (showAll) return events;
    return events.filter((a) => a && a.event_type === "active" && !a.acknowledged);
  }, [events, showAll]);

  const activeCount = useMemo(() => {
    if (!Array.isArray(events)) return 0;
    return events.filter((a) => a && a.event_type === "active" && !a.acknowledged).length;
  }, [events]);

  const sevClass = (s) => {
    const k = String(s || "").toLowerCase();
    if (k === "critical") return "status-offline";
    if (k === "warning")  return "status-warning";
    return "status-muted";
  };

  return h("div", null,
    h("div", { className: "section-sub" },
      h("span", { className: "meta" },
        events == null ? "" :
        `${activeCount} active${activeCount === 1 ? "" : ""} · ${events.length} total in history`),
      h("button", {
        className: "btn-ghost",
        style: { marginLeft: "auto" },
        onClick: () => setShowAll((s) => !s),
      }, showAll ? "Active only" : "Show history")
    ),
    error ? h("div", { className: "banner" }, error) : null,
    events == null
      ? h("div", { className: "empty" }, h("div", { className: "spinner" }), " loading…")
      : !filtered.length
        ? h("div", { className: "card", style: { textAlign: "center", padding: "32px 20px" } },
            h("div", { style: { fontSize: 14, fontWeight: 600, marginBottom: 8 } },
              showAll ? "No alarm events recorded yet." : "No active alarms."),
            h("div", { className: "muted", style: { fontSize: 12 } },
              showAll
                ? "When a configured limit rule fires on the edge, the event will appear here."
                : "Everything is within limits right now."))
        : h("div", { className: "alarm-events" },
            ...filtered.map((a) => h("div", {
              key: a.id || `${a.tag}-${a.ts}`,
              className: `alarm-event ${a.event_type === "active" && !a.acknowledged ? "is-active" : "is-cleared"}`,
            },
              h("div", { className: "alarm-event-head" },
                h("span", { className: `status-pill ${sevClass(a.severity)}` },
                  h("span", { className: "pill-dot" }),
                  h("span", null, (a.severity || "info").toUpperCase())
                ),
                h("span", { className: "alarm-event-ts" }, fmtTs(a.ts)),
                a.acknowledged ? h("span", { className: "status-pill status-online" },
                  h("span", { className: "pill-dot" }),
                  h("span", null, "ACK")
                ) : null
              ),
              h("div", { className: "alarm-event-msg" }, a.message || `${a.tag} = ${fmtVal(a.value)}`),
              h("div", { className: "alarm-event-meta" },
                a.tag ? h("span", null, h("strong", null, "Tag: "), a.tag) : null,
                (a.gateway_name || a.gateway_id) ? h("span", null,
                  h("strong", null, "Gateway: "), a.gateway_name || a.gateway_id) : null,
                a.value != null ? h("span", null, h("strong", null, "Value: "), fmtVal(a.value)) : null,
                h("span", null, h("strong", null, "State: "),
                  a.event_type === "clear" ? "cleared" : (a.acknowledged ? "acknowledged" : "active"))
              )
            ))
          )
  );
}

function AlarmRulesView({ liveRows }) {
  const [rules, setRules] = useState(null);
  const [error, setError] = useState("");
  const [stateFilter, setStateFilter] = useState("all");  // all | triggered | ok
  const [search, setSearch] = useState("");

  useEffect(() => {
    let stop = false;
    const f = async () => {
      const { data, error: e } = await supabase
        .from("triggers_limits")
        .select("payload_json, version, updated_utc")
        .order("updated_utc", { ascending: false })
        .limit(1);
      if (stop) return;
      if (e) { setError(e.message); return; }
      const row = data && data[0];
      const list = Array.isArray(row?.payload_json?.trigger_rules) ? row.payload_json.trigger_rules : [];
      setRules(list);
      setError("");
    };
    f();
    const ch = supabase.channel("lite-alarms-rules-rt")
      .on("postgres_changes",
        { event: "*", schema: "public", table: "triggers_limits" },
        () => f())
      .subscribe();
    return () => { stop = true; supabase.removeChannel(ch).catch(() => {}); };
  }, []);

  const liveByKey = useMemo(() => {
    const m = new Map();
    for (const r of (liveRows || [])) m.set(`${r.gateway_id}|${r.tag_name}`, r);
    return m;
  }, [liveRows]);

  const evaluated = useMemo(() => {
    if (!Array.isArray(rules)) return [];
    return rules.map((r, idx) => {
      const gw  = String(r?.gateway_id || "");
      const tag = String(r?.tag_name || "");
      const row = liveByKey.get(`${gw}|${tag}`);
      const v = row ? Number(row.value) : NaN;
      const triggered = Number.isFinite(v) ? evalRule(r, v) : false;
      return {
        id: r?.id || `rule-${idx}`,
        name: r?.name || tag || `Rule ${idx + 1}`,
        gateway_id: gw,
        tag_name: tag,
        condition: ruleConditionLabel(r),
        enabled: r?.enabled !== false,
        value: row ? row.value : null,
        ts: row ? row.ts_utc : null,
        triggered,
      };
    });
  }, [rules, liveByKey]);

  const filtered = useMemo(() => {
    let list = evaluated;
    if (stateFilter === "triggered") list = list.filter((r) => r.triggered);
    else if (stateFilter === "ok")    list = list.filter((r) => !r.triggered && r.enabled);
    if (search.trim()) {
      const q = search.trim().toLowerCase();
      list = list.filter((r) =>
        (r.name || "").toLowerCase().includes(q) ||
        (r.tag_name || "").toLowerCase().includes(q) ||
        (r.gateway_id || "").toLowerCase().includes(q));
    }
    return list;
  }, [evaluated, stateFilter, search]);

  const triggeredCount = evaluated.filter((r) => r.triggered).length;

  return h("div", null,
    h("div", { className: "section-sub" },
      h("span", { className: "meta" },
        rules == null ? "" :
        `${evaluated.length} rule${evaluated.length === 1 ? "" : "s"} · ${triggeredCount} triggered`)
    ),
    h("div", { className: "hist-filters" },
      h("div", { className: "seg" },
        ...[["all", "All"], ["triggered", "Triggered"], ["ok", "OK"]].map(([k, label]) =>
          h("button", {
            key: k,
            className: `seg-btn ${stateFilter === k ? "active" : ""}`,
            onClick: () => setStateFilter(k),
          }, label))
      ),
      h("input", {
        className: "hist-filter-input",
        type: "text",
        placeholder: "Filter by name / tag / gateway",
        value: search,
        onChange: (e) => setSearch(e.target.value),
      }),
      search ? h("button", { className: "btn-ghost hist-filter-clear",
                              onClick: () => setSearch("") }, "Clear") : null
    ),
    error ? h("div", { className: "banner" }, error) : null,
    rules == null
      ? h("div", { className: "empty" }, h("div", { className: "spinner" }), " loading…")
      : !filtered.length
        ? h("div", { className: "empty" },
            evaluated.length === 0
              ? "No alarm rules have been configured on the edge yet."
              : "No rules match the filter.")
        : h("div", { className: "alarm-rules" },
            ...filtered.map((r) => h("div", {
              key: r.id,
              className: `alarm-rule-card ${r.triggered ? "is-triggered" : (r.enabled ? "is-ok" : "is-disabled")}`,
            },
              h("div", { className: "alarm-rule-head" },
                h("div", { className: "alarm-rule-name" }, r.name),
                h("span", {
                  className: `status-pill ${r.triggered ? "status-offline" : (r.enabled ? "status-online" : "status-muted")}`,
                },
                  h("span", { className: "pill-dot" }),
                  h("span", null, r.triggered ? "TRIGGERED" : (r.enabled ? "OK" : "DISABLED"))
                )
              ),
              h("div", { className: "alarm-rule-meta" },
                h("span", null, h("strong", null, "Tag: "), r.tag_name || "—"),
                h("span", null, h("strong", null, "Gateway: "), r.gateway_id || "—"),
                h("span", null, h("strong", null, "Condition: "), r.condition),
                h("span", null, h("strong", null, "Current: "), fmtVal(r.value),
                  r.ts ? ` · ${fmtAge(r.ts)} ago` : "")
              )
            ))
          )
  );
}

// LEGACY app_logs alarm feed — kept until reports/alarm wiring is done.
function _LegacyAppLogsAlarmsView() {
  const [rows, setRows] = useState(null);
  const [error, setError] = useState("");
  const [levelFilter, setLevelFilter] = useState("");     // "", "info", "warning", "error", ...
  const [categoryFilter, setCategoryFilter] = useState("");
  const [gwFilter, setGwFilter] = useState("");
  const [textFilter, setTextFilter] = useState("");
  const [limit, setLimit] = useState(200);
  // Distinct values seen so we can populate the dropdowns.
  const [knownLevels, setKnownLevels] = useState([]);
  const [knownCategories, setKnownCategories] = useState([]);

  useEffect(() => {
    let stop = false;
    const f = async () => {
      let q = supabase
        .from("app_logs")
        .select("ts_utc, level, category, message, gateway_id, gateway_name")
        .order("ts_utc", { ascending: false })
        .limit(Math.max(20, Math.min(2000, Number(limit) || 200)));
      if (levelFilter) q = q.eq("level", levelFilter);
      if (categoryFilter) q = q.eq("category", categoryFilter);
      if (gwFilter.trim()) q = q.ilike("gateway_id", `%${gwFilter.trim()}%`);
      if (textFilter.trim()) q = q.ilike("message", `%${textFilter.trim()}%`);
      const { data, error: e } = await q;
      if (stop) return;
      if (e) setError(e.message);
      else {
        setRows(data || []);
        setError("");
        // Refresh dropdown options from what we've seen.
        const lv = new Set(knownLevels);
        const cat = new Set(knownCategories);
        for (const r of data || []) {
          if (r.level) lv.add(r.level);
          if (r.category) cat.add(r.category);
        }
        setKnownLevels([...lv].sort());
        setKnownCategories([...cat].sort());
      }
    };
    f();
    // Realtime: only append if the new row passes the current filters.
    const ch = supabase.channel("lite-alarms-rt")
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "app_logs" },
        (payload) => {
          const r = payload.new || payload.record || null;
          if (!r) return;
          if (levelFilter && r.level !== levelFilter) return;
          if (categoryFilter && r.category !== categoryFilter) return;
          if (gwFilter.trim() && !String(r.gateway_id || "").toLowerCase().includes(gwFilter.trim().toLowerCase())) return;
          if (textFilter.trim() && !String(r.message || "").toLowerCase().includes(textFilter.trim().toLowerCase())) return;
          setRows((prev) => [r, ...(prev || [])].slice(0, Math.max(20, Math.min(2000, Number(limit) || 200))));
        }).subscribe();
    return () => { stop = true; supabase.removeChannel(ch).catch(() => {}); };
  }, [levelFilter, categoryFilter, gwFilter, textFilter, limit]);

  return h("div", null,
    h("div", { className: "section" },
      h("h2", null, "Recent events"),
      h("span", { className: "meta" }, rows ? `${rows.length} entries` : "")
    ),
    h("div", { className: "hist-filters" },
      h("select", {
        className: "hist-filter-input",
        value: levelFilter,
        onChange: (e) => setLevelFilter(e.target.value),
      },
        h("option", { value: "" }, "All levels"),
        ...knownLevels.map((l) => h("option", { key: l, value: l }, l))
      ),
      h("select", {
        className: "hist-filter-input",
        value: categoryFilter,
        onChange: (e) => setCategoryFilter(e.target.value),
      },
        h("option", { value: "" }, "All categories"),
        ...knownCategories.map((c) => h("option", { key: c, value: c }, c))
      ),
      h("input", {
        className: "hist-filter-input",
        type: "text",
        placeholder: "Gateway contains…",
        value: gwFilter,
        onChange: (e) => setGwFilter(e.target.value),
      }),
      h("input", {
        className: "hist-filter-input",
        type: "text",
        placeholder: "Message contains…",
        value: textFilter,
        onChange: (e) => setTextFilter(e.target.value),
      }),
      h("select", {
        className: "hist-filter-input",
        value: String(limit),
        onChange: (e) => setLimit(Number(e.target.value)),
      },
        ...[100, 200, 500, 1000].map((n) => h("option", { key: n, value: String(n) }, `${n} rows`))
      ),
      (levelFilter || categoryFilter || gwFilter || textFilter) ? h("button", {
        className: "btn-ghost hist-filter-clear",
        onClick: () => { setLevelFilter(""); setCategoryFilter(""); setGwFilter(""); setTextFilter(""); },
      }, "Clear") : null
    ),
    error ? h("div", { className: "banner" }, error) : null,
    rows == null
      ? h("div", { className: "empty" }, h("div", { className: "spinner" }), " loading…")
      : !rows.length
        ? h("div", { className: "empty" }, "No events match the filters.")
        : h("div", null, ...rows.map((r, i) => {
            const lvl = String(r.level || "").toLowerCase();
            const cls = lvl.includes("err") || lvl.includes("crit") ? "error" :
                        lvl.includes("warn") || lvl.includes("alarm") ? "warn" : "";
            return h("div", { key: i, className: `alarm-row ${cls}` },
              h("div", { className: "lvl" }),
              h("div", { className: "body" },
                h("div", { className: "msg" }, r.message || r.category || "—"),
                h("div", { className: "meta" },
                  fmtTs(r.ts_utc), " · ", r.level || "—",
                  r.category ? ` · ${r.category}` : "",
                  r.gateway_id ? ` · ${r.gateway_name || r.gateway_id}` : "")
              )
            );
          }))
  );
}

// Tags the edge's power_manager emits per device. Kept in module scope so
// PowerView and the synthetic chart widgets share one list.
const POWER_METER_TAGS = ["voltage_v","current_a","active_power_w","energy_wh","power_factor","frequency_hz"];

// Build a synthetic chart-widget shape so we can reuse the existing
// ChartWidget pipeline (useChartSeries + Recharts) without re-implementing
// historian fetching. Each entry mirrors a dashboard `line_chart` widget.
function buildPowerWidget(gw, tag, label, color) {
  return {
    id: `power-${gw}-${tag}`,
    type: "line_chart",
    config: {
      title: label,
      gateway_id: gw,
      tag_name: tag,
      color: color,
      // No compute_rules / no series_extra — single tag.
    },
  };
}

function PowerView({ liveRows }) {
  const prefs = useDashPrefs();
  const cardHeight = prefs.cardHeight || 220;

  const byGw = new Map();
  for (const r of liveRows) {
    if (!POWER_METER_TAGS.includes(r.tag_name)) continue;
    const gid = r.gateway_id || "—";
    if (!byGw.has(gid)) byGw.set(gid, { gateway_id: gid, gateway_name: r.gateway_name || gid, ts_utc: r.ts_utc, tags: {} });
    const e = byGw.get(gid);
    e.tags[r.tag_name] = r.value;
    if (!e.ts_utc || (r.ts_utc && r.ts_utc > e.ts_utc)) e.ts_utc = r.ts_utc;
  }
  const list = [...byGw.values()];
  if (!list.length) return h("div", { className: "empty" }, "No power meters reporting.");

  const fields = [
    ["voltage_v", "V", "Voltage"], ["current_a", "A", "Current"],
    ["active_power_w", "W", "Active power"], ["power_factor", "", "PF"],
    ["frequency_hz", "Hz", "Frequency"], ["energy_wh", "Wh", "Energy"],
  ];

  return h("div", null,
    h("div", { className: "section" }, h("h2", null, "Power overview"),
      h("span", { className: "meta" }, `${list.length} device${list.length === 1 ? "" : "s"}`)),
    ...list.map((d) => h("div", { key: d.gateway_id, className: "power-card" },
      h("h3", null, d.gateway_name || d.gateway_id),
      h("div", { className: "power-grid" }, ...fields.map(([k, unit, label]) => {
        const v = d.tags[k];
        if (v === undefined || v === null) return null;
        return h("div", { key: k, className: "power-stat" },
          h("div", { className: "label" }, label),
          h("div", { className: "value" }, `${fmtVal(v)}${unit ? " " + unit : ""}`)
        );
      })),
      // Live active-power line chart — same widget rendering as the dashboard.
      d.tags.active_power_w !== undefined ? h("div", {
        className: "power-chart-wrap widget widget-line_chart",
        style: { height: `${cardHeight}px` },
      },
        h(ChartWidget, { widget: buildPowerWidget(d.gateway_id, "active_power_w", "Active power (W)", "#14a89a") })
      ) : null
    ))
  );
}

// Reporting view: lists the report templates the operator published from
// the desktop. Mirrors are read from public.report_templates via RLS.
//
// "Run" / "Request" actions are intentionally deferred — Lite has no PDF
// generator and the edge backend's /api/reports/render is not yet exposed
// over the cloud. For v1 the catalogue alone is honest: customers see
// which reports exist and can fall back to the desktop to actually run
// them. We will wire generation through a cloud worker in a follow-up.
// Storage bucket for generated PDFs (matches db/migrations/20260518_alarms_reports_queue.sql).
const LITE_REPORTS_BUCKET = "lite-reports";

function ReportingView() {
  const [section, setSection] = useState("generated");  // "generated" | "templates"
  return h("div", null,
    h("div", { className: "section" },
      h("h2", null, "Reporting"),
      h("div", { className: "seg" },
        h("button", {
          className: `seg-btn ${section === "generated" ? "active" : ""}`,
          onClick: () => setSection("generated"),
        }, "Generated"),
        h("button", {
          className: `seg-btn ${section === "templates" ? "active" : ""}`,
          onClick: () => setSection("templates"),
        }, "Templates")
      )
    ),
    section === "generated" ? h(GeneratedReportsView, null) : h(ReportTemplatesView, null)
  );
}

// --- Generated reports list (preview + download via signed URL) ----------- //
function GeneratedReportsView() {
  const [rows, setRows] = useState(null);
  const [error, setError] = useState("");
  const [busyId, setBusyId] = useState("");      // id of report currently fetching a signed URL
  const [previewUrl, setPreviewUrl] = useState("");

  const refresh = async () => {
    const { data, error: e } = await supabase
      .from("generated_reports")
      .select("id, tenant_id, template_id, template_name, schedule_id, schedule_name, triggered_by, file_name, file_bytes, storage_path, created_utc")
      .order("created_utc", { ascending: false })
      .limit(200);
    if (e) { setError(e.message); return; }
    setRows(data || []);
    setError("");
  };

  useEffect(() => {
    let stop = false;
    const f = async () => { if (!stop) await refresh(); };
    f();
    const ch = supabase.channel("lite-generated-reports-rt")
      .on("postgres_changes", { event: "*", schema: "public", table: "generated_reports" },
        () => f())
      .subscribe();
    return () => { stop = true; supabase.removeChannel(ch).catch(() => {}); };
  }, []);

  const signedUrl = async (storagePath) => {
    if (!storagePath) return null;
    const { data, error: e } = await supabase
      .storage.from(LITE_REPORTS_BUCKET)
      .createSignedUrl(storagePath, 300);  // 5-minute link
    if (e) { setError(e.message); return null; }
    return data?.signedUrl || null;
  };

  const onPreview = async (r) => {
    if (!r.storage_path) {
      setError("This report has not finished uploading to cloud Storage yet — try again in a moment.");
      return;
    }
    setBusyId(r.id);
    const url = await signedUrl(r.storage_path);
    setBusyId("");
    if (url) setPreviewUrl(url);
  };

  const onDownload = async (r) => {
    if (!r.storage_path) {
      setError("This report has not finished uploading to cloud Storage yet.");
      return;
    }
    setBusyId(r.id);
    const url = await signedUrl(r.storage_path);
    setBusyId("");
    if (url) {
      const a = document.createElement("a");
      a.href = url;
      a.download = r.file_name || `${r.id}.pdf`;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }
  };

  return h("div", null,
    error ? h("div", { className: "banner" }, error) : null,
    rows == null
      ? h("div", { className: "empty" }, h("div", { className: "spinner" }), " loading…")
      : !rows.length
        ? h("div", { className: "card", style: { textAlign: "center", padding: "32px 20px" } },
            h("div", { style: { fontSize: 14, fontWeight: 600, marginBottom: 8 } },
              "No reports have been generated yet."),
            h("div", { className: "muted", style: { fontSize: 12 } },
              "Generate one from the Templates tab, or run a scheduled report on the edge."))
        : h("div", { className: "report-list" },
            ...rows.map((r) => h("div", { key: `${r.tenant_id}|${r.id}`, className: "report-card" },
              h("div", { className: "report-card-head" },
                h("div", { className: "report-card-title" }, r.template_name || r.file_name || r.id),
                h("span", { className: `status-pill ${r.storage_path ? "status-online" : "status-muted"}` },
                  h("span", { className: "pill-dot" }),
                  h("span", null, r.storage_path ? "READY" : "UPLOADING")
                )
              ),
              h("div", { className: "report-card-summary" },
                `${r.triggered_by || "manual"} · ${fmtBytes(r.file_bytes)} · ${fmtTs(r.created_utc)}`),
              r.schedule_name ? h("div", { className: "report-card-desc" },
                `Schedule: ${r.schedule_name}`) : null,
              h("div", { className: "report-card-actions" },
                h("button", {
                  className: "btn btn-primary",
                  disabled: !r.storage_path || busyId === r.id,
                  onClick: () => onPreview(r),
                }, busyId === r.id ? "…" : "Preview"),
                h("button", {
                  className: "btn-ghost",
                  disabled: !r.storage_path || busyId === r.id,
                  onClick: () => onDownload(r),
                }, "Download")
              )
            ))
          ),
    previewUrl ? h(PdfPreviewModal, { url: previewUrl, onClose: () => setPreviewUrl("") }) : null
  );
}

function PdfPreviewModal({ url, onClose }) {
  return h("div", { className: "monitor-back", onClick: onClose },
    h("div", { className: "monitor pdf-preview", onClick: (e) => e.stopPropagation() },
      h("div", { className: "monitor-head" },
        h("h3", null, "Report preview"),
        h("button", { className: "close", onClick: onClose }, "Close")
      ),
      h("iframe", { className: "pdf-frame", src: url, title: "PDF preview" })
    )
  );
}

// --- Templates list (read + Generate via queue) --------------------------- //
function ReportTemplatesView() {
  const [rows, setRows] = useState(null);
  const [error, setError] = useState("");
  const [selected, setSelected] = useState(null);
  const [queueing, setQueueing] = useState("");
  const [submittedFor, setSubmittedFor] = useState("");

  useEffect(() => {
    let stop = false;
    const f = async () => {
      const { data, error: e } = await supabase
        .from("report_templates")
        .select("id, tenant_id, name, description, definition_json, created_utc, updated_utc, created_by")
        .order("updated_utc", { ascending: false })
        .limit(100);
      if (stop) return;
      if (e) setError(e.message);
      else { setRows(data || []); setError(""); }
    };
    f();
    const ch = supabase.channel("lite-report-templates-rt")
      .on("postgres_changes", { event: "*", schema: "public", table: "report_templates" },
        () => f())
      .subscribe();
    return () => { stop = true; supabase.removeChannel(ch).catch(() => {}); };
  }, []);

  const summarize = (t) => {
    const def = t.definition_json || {};
    const sections = Array.isArray(def.sections) ? def.sections.length : 0;
    const filters = def.filters || {};
    return `${sections} section${sections === 1 ? "" : "s"}${filters.tag_name ? ` · ${filters.tag_name}` : ""}`;
  };

  const onGenerate = async (t) => {
    setQueueing(t.id);
    setError("");
    try {
      const { data: userRes } = await supabase.auth.getUser();
      const user = userRes?.user;
      const payload = {
        tenant_id: t.tenant_id || "default",
        template_id: t.id,
        template_name: t.name || t.id,
        requested_by: user?.id || null,
        requester_email: user?.email || null,
      };
      const { error: e } = await supabase.from("lite_report_requests").insert(payload);
      if (e) { setError(`Could not queue the request: ${e.message}`); return; }
      setSubmittedFor(t.id);
      setTimeout(() => setSubmittedFor((cur) => (cur === t.id ? "" : cur)), 4000);
    } finally {
      setQueueing("");
    }
  };

  return h("div", null,
    h("div", { className: "section-sub" },
      h("span", { className: "meta" }, rows ? `${rows.length} template${rows.length === 1 ? "" : "s"}` : "")
    ),
    error ? h("div", { className: "banner" }, error) : null,
    rows == null
      ? h("div", { className: "empty" }, h("div", { className: "spinner" }), " loading…")
      : !rows.length
        ? h("div", { className: "card", style: { textAlign: "center", padding: "32px 20px" } },
            h("div", { style: { fontSize: 14, fontWeight: 600, marginBottom: 8 } },
              "No report templates yet."),
            h("div", { className: "muted", style: { fontSize: 12 } },
              "Create a template in the TrustNode desktop app and it will appear here."))
        : h("div", { className: "report-list" },
            ...rows.map((t) => h("div", { key: `${t.tenant_id}|${t.id}`, className: "report-card" },
              h("div", { className: "report-card-head" },
                h("div", { className: "report-card-title" }, t.name || t.id),
                h("button", {
                  className: "btn-ghost",
                  onClick: () => setSelected(selected?.id === t.id ? null : t),
                }, selected?.id === t.id ? "Hide details" : "View details")
              ),
              h("div", { className: "report-card-summary" }, summarize(t)),
              t.description ? h("div", { className: "report-card-desc" }, t.description) : null,
              h("div", { className: "report-card-meta" },
                `Updated ${fmtTs(t.updated_utc)}${t.created_by ? ` · by ${t.created_by}` : ""}`),
              selected?.id === t.id ? h("pre", { className: "report-card-json" },
                JSON.stringify(t.definition_json, null, 2)) : null,
              h("div", { className: "report-card-actions" },
                h("button", {
                  className: "btn btn-primary",
                  disabled: queueing === t.id,
                  onClick: () => onGenerate(t),
                }, queueing === t.id ? "Queuing…" :
                   submittedFor === t.id ? "Queued ✓" : "Generate")
              )
            ))
          )
  );
}

// Tiny byte formatter for report sizes.
function fmtBytes(n) {
  const v = Number(n);
  if (!Number.isFinite(v) || v <= 0) return "—";
  if (v < 1024) return `${v} B`;
  if (v < 1024 * 1024) return `${(v / 1024).toFixed(1)} KB`;
  return `${(v / (1024 * 1024)).toFixed(1)} MB`;
}

        "Open the TrustNode desktop app on the edge to schedule, generate, ",
        "or email reports. Once cloud sync of the report registry is enabled, ",
        "every report will appear here read-only with a download link.")
    )

// ============================================================
// Login
// ============================================================
function LoginCard({ theme, onToggleTheme, onSignedIn }) {
  const [user, setUser] = useState("");
  const [pw, setPw] = useState("");
  const [show, setShow] = useState(false);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const submit = async () => {
    if (busy) return;
    setBusy(true); setErr("");
    try {
      if (!user.trim() || !pw) throw new Error("Enter username and password");
      const { data, error } = await supabase.auth.signInWithPassword({ email: user.trim(), password: pw });
      if (error) throw error;
      onSignedIn(data.session);
    } catch (e) {
      setErr(e.message || String(e));
      setBusy(false);
    }
  };
  const sendMagic = async () => {
    if (!user.trim()) { setErr("Type your email above first"); return; }
    try {
      const { error } = await supabase.auth.signInWithOtp({
        email: user.trim(),
        options: { emailRedirectTo: window.location.href },
      });
      if (error) throw error;
      setErr("Check your inbox for the sign-in link.");
    } catch (e) { setErr(e.message || String(e)); }
  };
  return h("div", { className: `login-container theme-${theme}` },
    h("div", { className: "auth-card" },
      h("button", {
        className: "icon-btn theme-toggle-btn",
        type: "button",
        title: `Switch to ${theme === "dark" ? "light" : "dark"} mode`,
        onClick: onToggleTheme,
      }, theme === "dark" ? icSun() : icMoon()),
      h("div", { className: "auth-brand" },
        h("img", { src: "./trustnode_login_logo.png", alt: "TrustNode", className: "auth-logo",
                    onError: (e) => { e.target.style.display = "none"; } })
      ),
      h("div", { className: "auth-subtitle" }, "Sign in to view your edge data"),
      h("label", null,
        h("span", null, "Username or email"),
        h("div", { className: "input-wrapper" },
          h("span", { className: "field-icon" }, icUser()),
          h("input", {
            type: "email", autoComplete: "username", placeholder: "e.g. m.silva@plant.io",
            value: user, onChange: (e) => setUser(e.target.value),
            onKeyDown: (e) => { if (e.key === "Enter") document.getElementById("lite-pass")?.focus(); }
          })
        )
      ),
      h("label", null,
        h("div", { className: "pw-field-header" },
          h("span", null, "Password"),
          h("button", { type: "button", className: "forgot-link", onClick: sendMagic }, "Forgot password?")
        ),
        h("div", { className: "pw-input-wrap" },
          h("span", { className: "field-icon" }, icLock()),
          h("input", {
            id: "lite-pass",
            type: show ? "text" : "password", autoComplete: "current-password",
            placeholder: "Enter your password",
            value: pw, onChange: (e) => setPw(e.target.value),
            onKeyDown: (e) => { if (e.key === "Enter") submit(); }
          }),
          h("button", { className: "pw-icon-btn", type: "button", onClick: () => setShow((s) => !s) },
            show ? icEyeOpen() : icEyeClosed())
        )
      ),
      h("div", { className: "auth-error" }, err),
      h("button", {
        className: "btn btn-primary auth-submit",
        onClick: submit, disabled: busy,
      }, busy ? "Signing in…" : "Sign in to TrustNode Lite"),
      h("button", { className: "btn-ghost-link", type: "button", onClick: sendMagic },
        "Email me a magic link instead")
    )
  );
}

// ============================================================
// App
// ============================================================
function App() {
  const [session, setSession] = useState(null);
  const [theme, setTheme] = useState(readTheme());
  const [tab, setTab] = useState("dashboard");
  // Tag Monitor modal payload. Two shapes:
  //   { widget }                                   → opened from a chart-widget "expand" button
  //   { gateway_id, gateway_name, tag_name, value, ts }  → opened from a tile/KPI tap
  const [monitor, setMonitor] = useState(null);
  const [tenantLabel, setTenantLabel] = useState(cfg?.customer_label || "");
  const [prefs, setPrefs] = useState(loadDashPrefs());
  // Side-menu collapse state. Persisted to localStorage so the user's
  // preference survives reloads. Defaults to visible on desktop and
  // hidden on phones (the bottom-tab bar replaces it there anyway).
  const [sidebarVisible, setSidebarVisible] = useState(() => {
    try {
      const raw = localStorage.getItem("tnlite-sidebar-visible");
      if (raw === "true" || raw === "false") return raw === "true";
    } catch (_) {}
    return true;
  });

  useEffect(() => { applyTheme(theme); }, [theme]);
  useEffect(() => { saveDashPrefs(prefs); }, [prefs]);
  useEffect(() => {
    try { localStorage.setItem("tnlite-sidebar-visible", String(!!sidebarVisible)); } catch (_) {}
  }, [sidebarVisible]);

  useEffect(() => {
    supabase.auth.getSession().then(({ data }) => setSession(data.session || null));
    const { data: sub } = supabase.auth.onAuthStateChange((_e, s) => setSession(s || null));
    return () => sub.subscription.unsubscribe();
  }, []);

  // Tenant label from lite_profiles once signed in.
  useEffect(() => {
    if (!session) return;
    supabase.from("lite_profiles").select("tenant_id, customer_id").limit(1).maybeSingle()
      .then(({ data }) => {
        if (data) setTenantLabel(data.customer_id || data.tenant_id || cfg?.customer_label || "");
      }).catch(() => {});
  }, [session]);

  // Hooks must run unconditionally. The hooks themselves check supabase/
  // session before making any RPC, so calling them when signed out is a
  // cheap no-op that returns empty state.
  const { rows: liveRows, transport } = useLiveLatest(!!session);
  const { profiles, active, activeKey, setActiveKey } = useDashboardProfiles(!!session);

  const gatewayLastSeen = useMemo(() => {
    const m = {};
    for (const r of (liveRows || [])) {
      const t = Date.parse(r.ts_utc || 0);
      if (Number.isFinite(t)) {
        const gid = r.gateway_id || "";
        if (gid && (!m[gid] || m[gid] < t)) m[gid] = t;
      }
    }
    return m;
  }, [liveRows]);

  // Open the Tag Monitor modal. Called by tile/KPI taps (single tag) or by
  // the expand button on a chart widget (full widget incl. multi-series).
  const onOpenDrawer = useCallback((gw, gwName, tag, value, ts) => {
    setMonitor({ gateway_id: gw, gateway_name: gwName, tag_name: tag, value, ts });
  }, []);
  const onOpenWidget = useCallback((widget) => {
    setMonitor({ widget });
  }, []);

  const toggleTheme = () => setTheme(theme === "dark" ? "light" : "dark");

  if (!session) {
    return h(LoginCard, { theme, onToggleTheme: toggleTheme, onSignedIn: setSession });
  }

  let content;
  if (tab === "dashboard") content = h(DashboardView, {
    liveRows, profiles, active, activeKey, setActiveKey,
    prefs, setPrefs, gatewayLastSeen, onOpenDrawer, onOpenWidget,
  });
  else if (tab === "history") content = h(HistorianView, null);
  else if (tab === "alarms") content = h(AlarmsView, { liveRows });
  else if (tab === "power") content = h(PowerView, { liveRows });
  else if (tab === "reporting") content = h(ReportingView, null);
  else content = h("div", { className: "empty" }, "Unknown tab");

  const user = session?.user?.email || "";

  return h(DashPrefsCtx.Provider, { value: prefs },
    h("div", { className: "app-shell" },
      h(Header, {
        user, tenantLabel, theme, onToggleTheme: toggleTheme,
        liveRows, transport,
        sidebarVisible,
        onToggleSidebar: () => setSidebarVisible((v) => !v),
        onJumpAlarms: () => setTab("alarms"),
        onSignOut: async () => {
          await supabase.auth.signOut().catch(() => {});
          setSession(null);
        },
      }),
      h("div", { className: `body ${sidebarVisible ? "" : "sidebar-hidden"}` },
        sidebarVisible ? h(Sidebar, { tab, setTab, user, tenantLabel }) : null,
        h("main", null, content)
      ),
      h(BottomTabs, { tab, setTab }),
      h(TagMonitor, { open: !!monitor, payload: monitor, onClose: () => setMonitor(null) })
    )
  );
}

// ============================================================
// Boot
// ============================================================
(async () => {
  applyTheme(readTheme());
  try {
    await loadConfig();
  } catch (e) {
    const root = document.getElementById("app");
    root.innerHTML = "";
    const r = createRoot(root);
    r.render(h("div", { className: "login-container theme-light" },
      h("div", { className: "auth-card" },
        h("div", { className: "auth-subtitle" }, "TrustNode Lite — not configured"),
        h("div", { className: "auth-error" }, e.message || String(e))
      )
    ));
    return;
  }
  if ("serviceWorker" in navigator) {
    try { navigator.serviceWorker.register("./sw.js"); } catch (_) {}
  }
  const root = document.getElementById("app");
  root.innerHTML = "";
  const r = createRoot(root);
  r.render(h(App));
})();
  </script>
