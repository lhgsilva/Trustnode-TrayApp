// ============================================================
// Config + Supabase client (loaded once at boot)
// ============================================================
let cfg = null;
let supabase = null;

async function loadConfig() {
  // Use an absolute URL so the share-link route /lite/view/<token> still
  // hits /lite/config.json instead of /lite/view/<token>/config.json
  // (relative resolution against the current pathname).
  const res = await fetch("/lite/config.json", { cache: "no-cache" });
  if (!res.ok) throw new Error(`config.json HTTP ${res.status}`);
  cfg = await res.json();
  if (!cfg?.supabase_url || !cfg?.supabase_anon_key) {
    throw new Error("config.json is missing supabase_url or supabase_anon_key");
  }
  supabase = createClient(cfg.supabase_url, cfg.supabase_anon_key, {
    auth: { persistSession: true, storageKey: "tnlite-auth", autoRefreshToken: true },
  });
}

// ============================================================
// Tenant scope (master-admin cross-tenant picker)
// ============================================================
// Lite's Supabase RLS normally restricts every read to the caller's
// tenant. The 20260518_lite_global_admin migration ADDS bypass policies
// for `role=admin AND tenant_id=default` so the master sees every
// tenant. When that's true we let the user pick which tenant's data to
// look at; the picked id is added as an explicit `.eq('tenant_id', ...)`
// to each query so we don't render a confusing pile of cross-tenant
// rows. For non-admin users the context value stays empty and queries
// behave exactly as before (RLS does the filtering).
const TenantScopeCtx = createContext({
  pickedTenantId: "",     // empty == no override (master's "all tenants" or non-admin)
  setPickedTenantId: () => {},
  isGlobalAdmin: false,
  userTenantId: "",       // the tenant_id the user actually belongs to
  // The TENANT to enforce on every scoped query, regardless of who's looking:
  //   - non-admin signed-in user → their lite_profiles tenant from the JWT
  //   - master with a picked tenant → that tenant
  //   - master with no picked tenant → "" (cross-tenant view; RLS lets master see all)
  //   - view-link viewer → the resolved share-link tenant
  // Use this as the gate in every defensive client-side filter so a
  // regular user can never see another tenant's row even if RLS were ever
  // mis-applied.
  effectiveTenantId: "",
  // Optional secondary filter for master/admin only — pick one edge to
  // narrow the dashboard profile / live view to that specific edge.
  // Regular users never set this; their RLS scope already limits them
  // to their own tenant's edges.
  pickedEdgeId: "",
  setPickedEdgeId: () => {},
});

// Wrap any `supabase.from(...)` call site with this helper so we apply
// the master-picker scope automatically. Returns the (potentially
// scoped) Supabase query builder. Safe to use everywhere — when no
// tenant is picked the call passes through untouched.
function applyTenantScope(query, pickedTenantId) {
  if (!pickedTenantId) return query;
  try { return query.eq("tenant_id", pickedTenantId); }
  catch (_) { return query; }
}

// Defensive client-side companion to applyTenantScope. Drops every row
// whose tenant_id does not match the active pickedTenantId. Necessary
// because the view-link RLS policy is structurally permissive ("any
// tenant with an active share link is readable"), so if Customer A and
// Customer B both have active links, an anon SELECT against the same
// table could see both. The server .eq filter handles that — this is
// the belt-and-braces guard for when the .eq slot was forgotten or
// when realtime row events stream a sibling tenant's row.
//   - pickedTenantId === "" (master admin "all tenants") → passthrough.
//   - row.tenant_id === pickedTenantId                   → keep.
//   - anything else                                      → drop.
// Use as `.filter(scopedTo(pickedTenantId))` on any fetched row array.
function scopedTo(pickedTenantId) {
  if (!pickedTenantId) return () => true;
  const target = String(pickedTenantId);
  return (row) => {
    if (!row || typeof row !== "object") return false;
    const t = String(row.tenant_id || "");
    return t === target;
  };
}

// Read role + tenant out of a Supabase JWT's user_metadata claim. The
// portal mirror (lite_user_mirror.py) writes these on user creation, so
// every Lite-capable account has them.
function isJwtGlobalAdmin(session) {
  const meta = session?.user?.user_metadata || {};
  return String(meta.role || "") === "admin" && String(meta.tenant_id || "") === "default";
}
function jwtTenantId(session) {
  const meta = session?.user?.user_metadata || {};
  return String(meta.tenant_id || "");
}

const fmtAge = (iso) => {
  if (!iso) return "never";
  const t = Date.parse(iso);
  if (!Number.isFinite(t)) return "never";
  const dt = Math.max(0, Date.now() - t);
  if (dt < 1500) return "now";
  if (dt < 60_000) return `${Math.round(dt / 1000)}s`;
  if (dt < 3_600_000) return `${Math.round(dt / 60_000)}m`;
  if (dt < 86_400_000) return `${Math.round(dt / 3_600_000)}h`;
  return `${Math.round(dt / 86_400_000)}d`;
};
const fmtVal = (v) => {
  if (v === null || v === undefined) return "—";
  const n = Number(v);
  if (!Number.isFinite(n)) return String(v);
  if (Math.abs(n) >= 1000) return n.toFixed(0);
  if (Math.abs(n) >= 1) return n.toFixed(2);
  return n.toFixed(3);
};
const fmtTs = (iso) => {
  if (!iso) return "—";
  try { return new Date(iso).toLocaleString(); } catch { return String(iso); }
};
const freshnessClass = (ts) => {
  const t = ts ? Date.parse(ts) : 0;
  if (!t) return "bad";
  const age = Date.now() - t;
  if (age < 10_000) return "fresh";
  if (age < 60_000) return "stale";
  return "bad";
};
const SKIPPED_TYPES = new Set(["ip_camera", "cloud_sync_status"]);

// Theme helpers (write to <html data-theme=...>; persist in localStorage)
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  try { localStorage.setItem("trustnode_lite_theme", theme); } catch (_) {}
}
function readTheme() {
  try {
    const s = localStorage.getItem("trustnode_lite_theme");
    if (s === "light" || s === "dark") return s;
  } catch (_) {}
  return "light";
}

// Data hooks
// ============================================================
function useLiveLatest(enabled = true) {
  const [rows, setRows] = useState([]);
  const [error, setError] = useState("");
  const [rtt, setRtt] = useState(null);
  const [transport, setTransport] = useState("polling");
  // Master-picker scope. When picked, filter queries AND drop realtime
  // rows that don't match (Supabase realtime doesn't filter by RLS for
  // global-admin subscriptions — we'd otherwise get every tenant's rows).
  // effectiveTenantId is the tenant we GATE every row against, regardless
  // of who the viewer is. pickedEdgeId narrows further for master.
  const { pickedTenantId, effectiveTenantId, pickedEdgeId } = useContext(TenantScopeCtx);

  useEffect(() => {
    if (!enabled) return;
    let stopped = false;
    let channel = null;
    let pollTimer = null;
    // Clear stale rows immediately when the tenant changes. Without this
    // the header latency pill briefly mixes the previous tenant's age
    // with the new one until the next fetchAll lands.
    setRows([]);

    // Cap the seed fetch tighter than before (was 400). Dashboards rarely
    // need more than the most recent value per tag — a couple of hundred
    // rows is plenty for the largest customer today and cuts the round
    // trip enough to noticeably lower the StatusPill "ms" reading.
    const LIVE_SEED_LIMIT = Math.max(50, Math.min(400, Number(cfg?.live_seed_limit || 200)));
    const fetchAll = async () => {
      const t0 = performance.now();
      const { data, error: e } = await applyTenantScope(
        supabase
          .from("live_latest")
          // plc_ip is included so widgets can fall back to (IP, tag)
          // matching when their configured gateway_id stops publishing
          // (two gateways pointing at the same PLC scenario).
          .select("gateway_id, gateway_name, device_name, tag_name, value, quality, quality_label, ts_utc, tenant_id, plc_ip"),
        pickedTenantId,
      )
        .order("ts_utc", { ascending: false })
        .limit(LIVE_SEED_LIMIT);
      if (stopped) return;
      if (e) { setError(e.message); return; }
      // Strict tenant gate on every row regardless of who the viewer is.
      // For a regular signed-in user effectiveTenantId is their own
      // tenant; for master with the picker it's the picked tenant; for a
      // view-link viewer it's the share-link tenant. Empty effective
      // tenant means master-without-picker (allowed to see all).
      const filtered = (data || []).filter((r) => {
        if (effectiveTenantId) {
          if (!r?.tenant_id || r.tenant_id !== effectiveTenantId) return false;
        }
        if (pickedEdgeId && r?.gateway_id) {
          // Drop rows that belong to other edges when master picked one.
          // Lookup by edge_id requires cross-reference; for now we narrow
          // by checking the scope_key on dashboards only — for live rows
          // we just keep them tenant-scoped.
        }
        return true;
      });
      setRows(filtered);
      setError("");
      setRtt(Math.round(performance.now() - t0));
    };

    fetchAll();
    // Realtime: append/update in place. The channel + reconnect cycle is
    // explicit because previous builds leaked timers on CHANNEL_ERROR and
    // then never reconnected — the page silently "went polling" without
    // re-subscribing, and the StatusPill froze at the last age it had.
    let realtimeHealthy = false;
    let backoffMs = 2000;          // current reconnect delay
    let reconnectTimer = null;     // pending reconnect
    let safetyPollTimer = null;    // last-resort fallback poll
    const stopAllTimers = () => {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      if (safetyPollTimer) { clearInterval(safetyPollTimer); safetyPollTimer = null; }
      if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    };
    const startFallbackPolls = () => {
      // Active poll while we're disconnected from realtime.
      if (!pollTimer) {
        pollTimer = setInterval(fetchAll, Math.max(1000, Number(cfg?.live_poll_ms || 2000)));
      }
      // Safety-net poll fires regardless so the StatusPill always sees a
      // fresh state every ~5 s even if the active poll above was killed.
      if (!safetyPollTimer) {
        safetyPollTimer = setInterval(fetchAll, 5000);
      }
    };
    const reconnect = () => {
      if (stopped) return;
      if (reconnectTimer) return;
      reconnectTimer = setTimeout(() => {
        reconnectTimer = null;
        if (stopped) return;
        // Tear down the dead channel and open a fresh one. Without this
        // the subscription stays in CHANNEL_ERROR forever and we just
        // poll until the operator refreshes the page.
        if (channel) {
          try { supabase.removeChannel(channel).catch(() => {}); } catch (_) {}
          channel = null;
        }
        openChannel();
        // Exponential-ish backoff capped at 30 s so a long Supabase
        // outage doesn't hammer the API.
        backoffMs = Math.min(30000, backoffMs * 2);
      }, backoffMs);
    };
    const openChannel = () => {
      if (stopped) return;
      channel = supabase.channel("lite-live-rt")
        .on("postgres_changes",
          { event: "*", schema: "public", table: "live_latest" },
          (payload) => {
            const r = payload.new || payload.record || null;
            if (!r || !r.tag_name) return;
            // Strict tenant gate: drop foreign rows AND drop rows with
            // empty/missing tenant_id (cannot prove they belong to us).
            if (effectiveTenantId && (!r.tenant_id || r.tenant_id !== effectiveTenantId)) return;
            setRows((prev) => {
              const key = `${r.gateway_id || ""}|${r.tag_name}`;
              const next = prev.filter((p) => `${p.gateway_id || ""}|${p.tag_name}` !== key);
              next.unshift(r);
              return next.slice(0, LIVE_SEED_LIMIT);
            });
          })
        .subscribe((status) => {
          if (status === "SUBSCRIBED") {
            setTransport("realtime");
            realtimeHealthy = true;
            backoffMs = 2000;                // reset backoff on success
            if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
            // Keep the 5 s safety-net poll running so the StatusPill
            // reflects gateway death within ~5 s even if realtime keeps
            // saying "subscribed" but the server stopped sending rows.
            if (!safetyPollTimer) safetyPollTimer = setInterval(fetchAll, 5000);
          } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") {
            setTransport("polling");
            realtimeHealthy = false;
            startFallbackPolls();
            reconnect();
          }
        });
    };
    openChannel();
    // Always start the safety-net poll so we never go blind.
    if (!safetyPollTimer) safetyPollTimer = setInterval(fetchAll, 5000);

    return () => {
      stopped = true;
      if (channel) supabase.removeChannel(channel).catch(() => {});
      stopAllTimers();
    };
  }, [enabled, pickedTenantId, effectiveTenantId, pickedEdgeId]);

  return { rows, error, rtt, transport };
}

function useDashboardProfiles(enabled = true) {
  const [profiles, setProfiles] = useState([]);
  const [activeKey, setActiveKey] = useState(() => {
    try { return localStorage.getItem("tnlite-profile") || ""; } catch (_) { return ""; }
  });
  const [error, setError] = useState("");
  const { pickedTenantId, effectiveTenantId, pickedEdgeId } = useContext(TenantScopeCtx);
  // Clear the persisted active profile key whenever the tenant changes
  // (share-link switch, master picker change, login under a different
  // account). Carrying a previous tenant's scope_key as activeKey caused
  // the picker to fall through to profiles[0] from a different company
  // when the new tenant's dashboards hadn't loaded yet.
  useEffect(() => {
    setActiveKey((prev) => {
      if (!prev || !effectiveTenantId) return prev;
      return prev.startsWith(effectiveTenantId + "|") ? prev : "";
    });
  }, [effectiveTenantId]);
  // Also reset on edge change so master's profile picker re-aims at the
  // newly-selected edge's first profile.
  useEffect(() => {
    setActiveKey((prev) => {
      if (!prev || !pickedEdgeId) return prev;
      const parts = String(prev).split("|");
      const edgeSeg = parts[2] || "";
      return edgeSeg === pickedEdgeId ? prev : "";
    });
  }, [pickedEdgeId]);

  useEffect(() => {
    if (!enabled) return;
    let stopped = false;
    let channel = null;
    const load = async () => {
      // Resolve friendly names for edges (and customers) so the
      // dashboard picker shows "local-A" instead of "edge-7b56310a92".
      // cp_edges has the operator-set edge_name; cp_customers has the
      // company_name. Both lookups are cheap, RLS-scoped to the tenant.
      const edgeNameById = {};
      try {
        const { data: edgeRows } = await applyTenantScope(
          supabase.from("cp_edges").select("edge_id, edge_name, tenant_id"),
          pickedTenantId,
        );
        for (const e of (edgeRows || [])) {
          const id = String(e.edge_id || "").trim();
          if (id) edgeNameById[id] = String(e.edge_name || "").trim() || id;
        }
      } catch (_) {}

      const { data, error: e } = await applyTenantScope(
        supabase
          .from("dashboard_configurations")
          .select("scope_key, payload_json, version, updated_utc, tenant_id"),
        pickedTenantId,
      )
        .order("updated_utc", { ascending: false })
        .limit(50);
      if (stopped) return;
      if (e) { setError(e.message); return; }
      setError("");
      // Defensive double-filter. effectiveTenantId is the row's required
      // tenant — for a regular signed-in user it's their JWT tenant; for
      // master with a picked tenant it's the picker; for view-link it's
      // the share-link tenant. We NEVER trust an empty tenant_id on a row.
      const seen = new Set();
      const raw = (data || []).map((r) => ({
        key: r.scope_key || "",
        label: profileLabel(r.scope_key || "", edgeNameById),
        payload: r.payload_json || {},
        widgetCount: Array.isArray(r.payload_json?.widgets) ? r.payload_json.widgets.length : 0,
        tenant_id: r.tenant_id || "",
      })).filter((p) => {
        if (!p.key) return false;
        if (seen.has(p.key)) return false;
        // When effectiveTenantId is set (regular user, view-link, or
        // master with a picked tenant), require an exact match. Drop
        // rows with empty/null tenant_id rather than letting them
        // through under the "RLS will sort it" assumption.
        if (effectiveTenantId) {
          if (!p.tenant_id || p.tenant_id !== effectiveTenantId) return false;
          if (!p.key.startsWith(effectiveTenantId + "|")) return false;
        }
        // Optional master-only edge filter: keep only scope_keys whose
        // middle segment (the edge_id) matches the picked edge.
        if (pickedEdgeId) {
          const parts = String(p.key).split("|");
          const edgeSeg = parts[2] || "";
          if (edgeSeg !== pickedEdgeId) return false;
        }
        seen.add(p.key);
        return true;
      });
      const withWidgets = raw.filter((p) => p.widgetCount > 0);
      const profs = withWidgets.length ? withWidgets : raw;
      setProfiles(profs);
    };
    load();
    channel = supabase.channel("lite-dash-rt")
      .on("postgres_changes",
        { event: "*", schema: "public", table: "dashboard_configurations" },
        () => load())
      .subscribe();
    return () => {
      stopped = true;
      if (channel) supabase.removeChannel(channel).catch(() => {});
    };
  }, [enabled, pickedTenantId, effectiveTenantId, pickedEdgeId]);

  const setActive = (key) => {
    setActiveKey(key || "");
    try { localStorage.setItem("tnlite-profile", key || ""); } catch (_) {}
  };

  const active = useMemo(() => {
    if (!profiles.length) return null;
    return profiles.find((p) => p.key === activeKey) || profiles[0];
  }, [profiles, activeKey]);

  return { profiles, active, activeKey: active?.key || "", setActiveKey: setActive, error };
}

function profileLabel(scopeKey, edgeNameById = {}) {
  if (!scopeKey) return "Default";
  const parts = String(scopeKey).split("|");
  const edge = parts[2] || "";
  const user = parts[3] || "";
  // Friendly name resolution: prefer the operator-set edge_name (e.g.
  // "local-A") over the cryptic "edge-7b56310a92". Falls back to the
  // raw id only when no name has been set yet.
  const friendlyEdge = (edge && edgeNameById && edgeNameById[edge]) ? edgeNameById[edge] : edge;
  if (friendlyEdge && user) return `${friendlyEdge} · ${user}`;
  if (friendlyEdge) return friendlyEdge;
  return scopeKey;
}

// Per-(gw|tag) chart series, fetched once then appended via realtime.
function useChartSeries(gw, tag, sampleCount, plcEndpoint = "") {
  const [series, setSeries] = useState([]); // [{ ts, value, idx }]
  const seriesRef = useRef(series);
  seriesRef.current = series;
  const { pickedTenantId } = useContext(TenantScopeCtx);

  useEffect(() => {
    let stopped = false;
    if (!gw || !tag) { setSeries([]); return; }
    const fetchSeed = async () => {
      // Match by gateway_id OR plc_ip. When plcEndpoint is unknown we
      // collapse the OR to the original gateway_id-only filter.
      const baseQuery = applyTenantScope(
        supabase
          .from("historian_readings")
          .select("ts_utc, value, tenant_id, gateway_id, plc_ip"),
        pickedTenantId,
      ).eq("tag_name", tag);
      const filtered = plcEndpoint
        ? baseQuery.or(`gateway_id.eq.${gw},plc_ip.eq.${plcEndpoint}`)
        : baseQuery.eq("gateway_id", gw);
      const { data, error } = await filtered
        .order("ts_utc", { ascending: false })
        .limit(Math.max(2, Math.min(2000, Number(sampleCount) || 20)));
      if (stopped) return;
      if (error) return;
      const rows = (data || []).slice().reverse();
      setSeries(rows.map((r, idx) => ({
        idx,
        ts: r.ts_utc,
        value: Number(r.value),
      })));
    };
    fetchSeed();

    // Realtime: accept a row when its (gateway_id, tag_name) matches OR
    // its (plc_ip, tag_name) matches the widget's endpoint.
    const handler = (row) => {
      if (!row || row.tag_name !== tag) return;
      // Tenant guard: Supabase realtime delivers ALL inserts to the
      // channel regardless of RLS. Without this filter Customer A's
      // historian rows would update Customer B's charts whenever a
      // gateway_id/tag_name pair collided across tenants.
      if (pickedTenantId && row.tenant_id && row.tenant_id !== pickedTenantId) return;
      const gatewayMatch = row.gateway_id === gw;
      const endpointMatch = plcEndpoint && row.plc_ip && row.plc_ip === plcEndpoint;
      if (!gatewayMatch && !endpointMatch) return;
      const v = Number(row.value);
      setSeries((prev) => {
        const next = [...prev, { idx: prev.length, ts: row.ts_utc, value: Number.isFinite(v) ? v : null }];
        const cap = Math.max(2, Number(sampleCount) || 20);
        if (next.length > cap) next.splice(0, next.length - cap);
        // Re-number idx so XAxis stays monotonic.
        for (let i = 0; i < next.length; i++) next[i].idx = i;
        return next;
      });
    };
    historianSubscribers.add(handler);
    return () => { stopped = true; historianSubscribers.delete(handler); };
  }, [gw, tag, sampleCount, pickedTenantId, plcEndpoint]);

  return series;
}

// One shared historian realtime channel; chart hooks register a handler.
const historianSubscribers = new Set();
let _historianChan = null;
function ensureHistorianChannel() {
  if (_historianChan || !supabase) return;
  _historianChan = supabase.channel("lite-hist-rt")
    .on("postgres_changes",
      { event: "INSERT", schema: "public", table: "historian_readings" },
      (payload) => {
        const r = payload.new || payload.record || null;
        if (!r) return;
        historianSubscribers.forEach((fn) => { try { fn(r); } catch (_) {} });
      })
    .subscribe();
}

// ============================================================
// Charts (Recharts) — styled to match the desktop edge dashboard
// ============================================================
// Generous margins so the axis tick labels never collide with the card
// borders. Bottom: room for x-axis labels. Left: room for the y-axis
// tick numbers (we use width:38 on the YAxis itself but margins help
// when the body resizes small).
// Default chart margins. Mobile values (≤600px viewport) are tighter so
// the actual plot area gets most of the card; otherwise on a phone the
// axis labels eat half the widget. Recharts re-measures whenever the
// container resizes, so the chart picks the right margin automatically
// when the viewport rotates.
const isMobileViewport = () =>
  typeof window !== "undefined" && window.matchMedia && window.matchMedia("(max-width: 600px)").matches;
const chartMargin = { top: 10, right: 16, left: 8, bottom: 18 };
const chartMarginMobile = { top: 4, right: 4, left: 0, bottom: 4 };
function getChartMargin() {
  return isMobileViewport() ? chartMarginMobile : chartMargin;
}
const chartTooltipProps = {
  contentStyle: {
    background: "var(--card, #171717)",
    border: "1px solid var(--stroke, rgba(255,255,255,0.14))",
    borderRadius: 8,
    color: "var(--text, #f2f4f7)",
    fontSize: 12,
  },
  labelStyle: { color: "var(--text, #f2f4f7)", fontWeight: 600 },
  itemStyle: { color: "var(--text, #f2f4f7)" },
};
function buildXAxisProps(series) {
  const mobile = isMobileViewport();
  return {
    dataKey: "idx",
    tickFormatter: (v) => {
      const p = series.find((p) => p.idx === v);
      if (!p?.ts) return "";
      try { return new Date(p.ts).toLocaleTimeString().slice(0, 5); } catch { return ""; }
    },
    stroke: "var(--soft, #8a98ab)",
    tick: { fill: "var(--soft, #8a98ab)", fontSize: mobile ? 9 : 10 },
    // Wider tick gap on mobile so labels don't overlap when the plot
    // shrinks. Keeps the axis readable at single-column phone widths.
    minTickGap: mobile ? 40 : 28,
    height: mobile ? 18 : undefined,
    axisLine: { stroke: "var(--line, rgba(138,152,171,0.25))" },
    tickLine: { stroke: "var(--line, rgba(138,152,171,0.25))" },
  };
}
// Compact tick formatter: 2-decimal max, k/M/G suffixes for big numbers.
// Keeps the Y axis readable for both ~119.84 sensor values AND large Wh
// totals like 11_279_318 that would otherwise wreck the layout.
const fmtTick = (v) => {
  if (v === null || v === undefined || !Number.isFinite(Number(v))) return "";
  const n = Number(v);
  const abs = Math.abs(n);
  if (abs >= 1e9) return (n / 1e9).toFixed(2) + "G";
  if (abs >= 1e6) return (n / 1e6).toFixed(2) + "M";
  if (abs >= 1e3) return (n / 1e3).toFixed(2) + "k";
  // Decimals only when meaningful — integers stay clean.
  return (Math.round(n * 100) / 100).toString();
};

// YAxis tick + width responsive to viewport. On phones the default
// width:48 + fontSize:10 gives away ~25% of a small card's width to
// labels; shrink both so the actual plot has room.
const yAxisProps = {
  stroke: "var(--soft, #8a98ab)",
  tick: { fill: "var(--soft, #8a98ab)", fontSize: 10 },
  width: 48,
  tickFormatter: fmtTick,
  axisLine: { stroke: "var(--line, rgba(138,152,171,0.25))" },
  tickLine: { stroke: "var(--line, rgba(138,152,171,0.25))" },
};
const yAxisPropsMobile = {
  ...yAxisProps,
  tick: { fill: "var(--soft, #8a98ab)", fontSize: 9 },
  width: 30,
};
const getYAxisBase = () => isMobileViewport() ? yAxisPropsMobile : yAxisProps;

// `domain` for `<YAxis>` — when autoFit is true we hug the data with a 5%
// pad above the max (so the peak isn't clipped by the chart frame) and 2%
// below the min. When off, fall back to Recharts default padded auto.
function buildYAxisProps(autoFit) {
  const pad = (n) => (Number.isFinite(n) ? n : 0);
  const base = getYAxisBase();
  if (autoFit) {
    return {
      ...base,
      // Generous top pad so the peak (e.g. a bar top) is fully visible.
      domain: [
        (dataMin) => pad(dataMin) - Math.abs(pad(dataMin)) * 0.02 - 0.001,
        (dataMax) => pad(dataMax) + Math.abs(pad(dataMax)) * 0.05 + 0.001,
      ],
      allowDataOverflow: false,
    };
  }
  return base;
}

// Resolve the full series list for a chart widget: primary + every
// non-limit `cfg.series_extra` row. Each series carries gw/tag/color/axis/
// chart_type so we can render a multi-series ComposedChart that overlays
// lines, areas and bars on shared or split Y axes — matching the edge.
function widgetAllSeries(widget) {
  const cfg = widget?.config || {};
  const widgetType = String(widget?.type || "line_chart");
  const primaryColor = String(widget?.color || "#14a89a");
  const primaryKind =
    widgetType === "bar_chart" ? "bar" :
    widgetType === "line_area_chart" ? "area" : "line";
  // Per-widget rescale — same rule the edge dashboard uses so values
  // displayed in Lite match the edge to the decimal.
  const cleanMul = (v) => {
    const n = Number(v);
    return Number.isFinite(n) && n !== 0 ? n : 1;
  };
  const cleanOff = (v) => {
    const n = Number(v);
    return Number.isFinite(n) ? n : 0;
  };
  // PLC endpoint snapshot the edge wrote when the widget was saved
  // (saveDashboardWidget in App.jsx). Used as an IP-fallback so a chart
  // configured for gateway A keeps drawing samples from gateway B when
  // both target the same PLC. Older widgets predate the snapshot —
  // they just won't get the fallback until they're re-saved.
  const widgetEndpoint = String(cfg.plc_endpoint || cfg.plc_ip || "");
  const out = [];
  // Top-level chart styling pulled in once so the primary series can
  // inherit the widget's line thickness / dot setting same way the edge
  // does. Per-series overrides on extras still win.
  const widgetLineWidth = Number(cfg.chart_line_width);
  const widgetLineDot = String(cfg.chart_line_dot || "none");
  if (cfg.tag_name) {
    out.push({
      id: "primary",
      gateway_id: cfg.gateway_id || "",
      plc_endpoint: widgetEndpoint,
      tag_name: cfg.tag_name,
      label: String(widget?.title || cfg.tag_name || "").trim() || cfg.tag_name,
      color: primaryColor,
      axis: "left",
      chart_type: primaryKind,
      multiplier: cleanMul(cfg.multiplier),
      offset: cleanOff(cfg.offset),
      unit: String(cfg.primary_unit || ""),
      suffix: String(cfg.primary_suffix || ""),
      line_width: Number.isFinite(widgetLineWidth) && widgetLineWidth > 0 ? widgetLineWidth : 2,
      line_dot: widgetLineDot,
    });
  }
  const extras = Array.isArray(cfg.series_extra) ? cfg.series_extra : [];
  extras.forEach((s, i) => {
    if (!s || !s.tag_name) return;
    if (String(s.chart_type || "").toLowerCase() === "limit") return; // limits handled separately
    const sw = Number(s.line_width);
    const bw = Number(s.bar_width);
    out.push({
      id: String(s.id || `s${i + 1}`),
      gateway_id: String(s.gateway_id || cfg.gateway_id || ""),
      // extras carry their own endpoint if set, otherwise fall back to the
      // primary widget's snapshot (extras almost always share the same gw).
      plc_endpoint: String(s.plc_endpoint || s.plc_ip || widgetEndpoint || ""),
      tag_name: String(s.tag_name),
      label: String(s.label || s.tag_name),
      color: String(s.color || pickPaletteColor(i + 1)),
      axis: String(s.axis || "left").toLowerCase() === "right" ? "right" : "left",
      chart_type: String(s.chart_type || primaryKind).toLowerCase() || primaryKind,
      multiplier: cleanMul(s.multiplier),
      offset: cleanOff(s.offset),
      unit: String(s.unit || ""),
      suffix: String(s.suffix || ""),
      line_width: Number.isFinite(sw) && sw > 0
        ? sw
        : (Number.isFinite(widgetLineWidth) && widgetLineWidth > 0 ? widgetLineWidth : 2),
      bar_width: Number.isFinite(bw) && bw > 0 ? bw : null,
      line_dot: String(s.line_dot || widgetLineDot),
    });
  });
  return out;
}

function pickPaletteColor(i) {
  const palette = ["#14a89a", "#f97316", "#6e8dd2", "#e2585d", "#a855f7", "#0e8479", "#22c55e", "#fbbf24"];
  return palette[i % palette.length];
}

// Extract limit lines from a widget's series_extra rows and resolve each
// to its current numeric value. Constants use the typed number; tag-bound
// limits read the latest sample of the named tag from the live broadcast
// so the line "moves" with the PLC value — same rule the edge uses.
//
// Returns { value, color, axis, label, style, dash } per limit, plus the
// already-rescaled value (multiplier + offset) so it lines up with the
// scaled series the chart draws.
function widgetLimitLines(widget, liveByKey, liveRows) {
  const cfg = widget?.config || {};
  const extras = Array.isArray(cfg.series_extra) ? cfg.series_extra : [];
  const out = [];
  extras.forEach((s, idx) => {
    if (!s || String(s.chart_type || "").toLowerCase() !== "limit") return;
    const mul = (() => { const n = Number(s.multiplier); return Number.isFinite(n) && n !== 0 ? n : 1; })();
    const off = (() => { const n = Number(s.offset); return Number.isFinite(n) ? n : 0; })();
    let raw = null;
    const constant = Number(s.limit_value);
    const constantText = String(s.limit_value ?? "").trim();
    if (constantText !== "" && Number.isFinite(constant)) {
      raw = constant;
    } else if (s.tag_name) {
      // Latest sample of the bound tag — try the lookup map first,
      // then walk the raw live rows as a fallback so the legacy
      // tag-only widget shape keeps working.
      const gw = String(s.gateway_id || cfg.gateway_id || "");
      const tag = String(s.tag_name);
      const hit = (liveByKey?.lookup ? liveByKey.lookup({ gateway_id: gw, tag_name: tag }) : null)
        || (Array.isArray(liveRows)
              ? liveRows.find((r) => String(r?.tag_name || "") === tag
                  && (!gw || String(r?.gateway_id || "") === gw))
              : null);
      const num = Number(hit?.value);
      if (Number.isFinite(num)) raw = num;
    }
    if (raw == null) return;
    const value = raw * mul + off;
    const dashByStyle = { solid: undefined, dashed: "4 4", dotted: "1 4" };
    const style = String(s.limit_line_style || s.line_style || "dashed").toLowerCase();
    out.push({
      id: String(s.id || `limit${idx + 1}`),
      value,
      color: String(s.color || "#e2585d"),
      axis: String(s.axis || "left").toLowerCase() === "right" ? "right" : "left",
      label: String(s.label || s.tag_name || `Limit ${idx + 1}`),
      dash: dashByStyle[style] || "4 4",
      width: (() => { const n = Number(s.line_width); return Number.isFinite(n) && n > 0 ? n : 2; })(),
    });
  });
  return out;
}

// Hook: fetch + realtime-append every series for a chart widget at once,
// then merge them into a single Recharts dataset keyed by index.
//
// Returns { merged, seriesDefs } where `merged` is an array of rows like
// { idx, ts, val_primary, val_s1, val_s2, ... } so Recharts dataKey can
// pick each series by its id.
function useMultiSeries(widget, sampleCount) {
  const seriesDefs = useMemo(() => widgetAllSeries(widget), [
    widget?.id, widget?.type, widget?.color, widget?.title,
    widget?.config?.tag_name, widget?.config?.gateway_id,
    JSON.stringify(widget?.config?.series_extra || []),
  ]);
  const { pickedTenantId } = useContext(TenantScopeCtx);
  // Each series has its own running buffer keyed by ts_utc -> value.
  const [tick, setTick] = useState(0);
  const buffersRef = useRef(new Map()); // id -> Map<ts, value>
  // Track the deepest seed size we've ever fetched per series so a later
  // sampleCount bump only re-fetches when the new value EXCEEDS what we
  // already have. Going from 100 → 20 keeps the buffer untouched and the
  // chart just re-slices the last 20 in render — instant.
  const seededDepthRef = useRef(new Map()); // id -> int
  // Keep sampleCount fresh inside the realtime closure without re-running
  // the subscription effect: we re-cap the buffer using sampleCountRef
  // on every realtime row instead of binding it as a dep.
  const sampleCountRef = useRef(sampleCount);
  useEffect(() => { sampleCountRef.current = sampleCount; }, [sampleCount]);

  // Subscription + initial seed effect. Runs ONLY when the series identity
  // set changes (i.e. the operator switches the tag, gateway, or
  // series_extra), or when the tenant changes. Crucially: changing
  // sampleCount alone does NOT re-run this — see the deeper-seed effect
  // below for handling that case.
  useEffect(() => {
    buffersRef.current = new Map(seriesDefs.map((s) => [s.id, new Map()]));
    seededDepthRef.current = new Map(seriesDefs.map((s) => [s.id, 0]));
    setTick((t) => t + 1);
    if (!seriesDefs.length) return;

    let stopped = false;
    const subs = new Set();

    const scale = (s, raw) => {
      const v = Number(raw);
      if (!Number.isFinite(v)) return null;
      const m = Number.isFinite(s?.multiplier) && s.multiplier !== 0 ? s.multiplier : 1;
      const o = Number.isFinite(s?.offset) ? s.offset : 0;
      return v * m + o;
    };

    const fetchSeed = async (s, targetDepth) => {
      const base = applyTenantScope(
        supabase
          .from("historian_readings")
          .select("ts_utc, value, tenant_id, gateway_id, plc_ip"),
        pickedTenantId,
      ).eq("tag_name", s.tag_name);
      const filtered = s.plc_endpoint
        ? base.or(`gateway_id.eq.${s.gateway_id},plc_ip.eq.${s.plc_endpoint}`)
        : base.eq("gateway_id", s.gateway_id);
      const limit = Math.max(2, Math.min(5000, Number(targetDepth) || 20));
      const { data, error } = await filtered
        .order("ts_utc", { ascending: false })
        .limit(limit);
      if (stopped || error) return;
      const buf = buffersRef.current.get(s.id);
      if (!buf) return;
      // Merge into the existing buffer instead of clearing it. Existing
      // realtime appends that arrived during the fetch are preserved;
      // the seed only inserts the older rows the buffer didn't have.
      (data || []).slice().reverse().forEach((r) => {
        buf.set(r.ts_utc, scale(s, r.value));
      });
      seededDepthRef.current.set(s.id, Math.max(
        seededDepthRef.current.get(s.id) || 0, limit
      ));
      setTick((t) => t + 1);
    };

    Promise.all(
      seriesDefs.map((s) => fetchSeed(s, sampleCountRef.current))
    ).catch(() => {});

    // Register one realtime handler per (gw|tag) so each new row appends.
    for (const s of seriesDefs) {
      const fn = (row) => {
        if (!row || row.tag_name !== s.tag_name) return;
        const gatewayMatch = row.gateway_id === s.gateway_id;
        const endpointMatch = s.plc_endpoint && row.plc_ip && row.plc_ip === s.plc_endpoint;
        if (!gatewayMatch && !endpointMatch) return;
        const buf = buffersRef.current.get(s.id);
        if (!buf) return;
        buf.set(row.ts_utc, scale(s, row.value));
        // Cap each buffer at sampleCount * 2 entries so we always keep
        // a bit of headroom for re-rendering at the larger preset.
        const cap = Math.max(20, (Number(sampleCountRef.current) || 20) * 2);
        if (buf.size > cap) {
          const keys = [...buf.keys()].sort();
          for (let i = 0; i < keys.length - cap; i++) buf.delete(keys[i]);
        }
        setTick((t) => t + 1);
      };
      historianSubscribers.add(fn);
      subs.add(fn);
    }
    return () => {
      stopped = true;
      subs.forEach((fn) => historianSubscribers.delete(fn));
    };
  // Deliberately omit sampleCount — see comment above. The
  // deeper-seed effect below handles bumps without resetting the
  // realtime channel.
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [seriesDefs, pickedTenantId]);

  // Sample-count growth effect: when the operator picks a larger window
  // (e.g. 20 → 500), fetch the extra history once and merge it into
  // each series's existing buffer without clearing or re-subscribing.
  // Picking a SMALLER window does nothing — the render just slices the
  // last N from the existing buffer, which is instant.
  useEffect(() => {
    if (!seriesDefs.length) return;
    let stopped = false;
    const target = Math.max(2, Math.min(5000, Number(sampleCount) || 20));
    const scale = (s, raw) => {
      const v = Number(raw);
      if (!Number.isFinite(v)) return null;
      const m = Number.isFinite(s?.multiplier) && s.multiplier !== 0 ? s.multiplier : 1;
      const o = Number.isFinite(s?.offset) ? s.offset : 0;
      return v * m + o;
    };
    const deepen = async (s) => {
      const have = seededDepthRef.current.get(s.id) || 0;
      if (target <= have) return; // nothing to do; render will just slice
      const base = applyTenantScope(
        supabase
          .from("historian_readings")
          .select("ts_utc, value, tenant_id, gateway_id, plc_ip"),
        pickedTenantId,
      ).eq("tag_name", s.tag_name);
      const filtered = s.plc_endpoint
        ? base.or(`gateway_id.eq.${s.gateway_id},plc_ip.eq.${s.plc_endpoint}`)
        : base.eq("gateway_id", s.gateway_id);
      const { data, error } = await filtered
        .order("ts_utc", { ascending: false })
        .limit(target);
      if (stopped || error) return;
      const buf = buffersRef.current.get(s.id);
      if (!buf) return;
      (data || []).slice().reverse().forEach((r) => {
        buf.set(r.ts_utc, scale(s, r.value));
      });
      seededDepthRef.current.set(s.id, target);
      setTick((t) => t + 1);
    };
    Promise.all(seriesDefs.map(deepen)).catch(() => {});
    return () => { stopped = true; };
  }, [sampleCount, seriesDefs, pickedTenantId]);

  // Build the merged dataset. Take the union of all timestamps across
  // every series, sort, then for each timestamp emit a row carrying each
  // series's most recent value at-or-before that timestamp (carry-forward
  // resample). Without this, two series sampled on slightly different
  // clocks render as alternating null/value rows and the line never
  // appears even with connectNulls.
  const merged = useMemo(() => {
    if (!seriesDefs.length) return [];
    const tsSet = new Set();
    for (const def of seriesDefs) {
      const buf = buffersRef.current.get(def.id);
      if (!buf) continue;
      for (const ts of buf.keys()) tsSet.add(ts);
    }
    const sortedTs = [...tsSet].sort();
    if (!sortedTs.length) return [];
    const cap = Math.max(2, Number(sampleCount) || 20);
    const window = sortedTs.slice(-cap);

    // For each series, pre-sort its entries; walk the window in lockstep
    // with each series's pointer to forward-fill the current value.
    const seriesEntries = seriesDefs.map((def) => {
      const buf = buffersRef.current.get(def.id);
      const entries = buf ? [...buf.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1) : [];
      return { def, entries, ptr: 0, last: null };
    });

    return window.map((ts, idx) => {
      const row = { idx, ts };
      for (const st of seriesEntries) {
        while (st.ptr < st.entries.length && st.entries[st.ptr][0] <= ts) {
          st.last = st.entries[st.ptr][1];
          st.ptr += 1;
        }
        row[st.def.id] = (st.last === undefined ? null : st.last);
      }
      return row;
    });
    // tick triggers re-build on any new sample.
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [seriesDefs, sampleCount, tick]);

  return { merged, seriesDefs };
}

// Time-grouping intervals — same labels and bucket sizes the edge
// dashboard exposes. "none" returns the input untouched.
const GROUP_INTERVAL_MS = {
  none: 0,
  "1s": 1000, "5s": 5000, "10s": 10000, "30s": 30000,
  "1m": 60000, "5m": 300000, "15m": 900000, "1h": 3600000,
};

// Apply query_group_interval + query_result_aggregation to a merged
// dataset (output of useMultiSeries). Each series's values get bucketed
// by tickMs and reduced (last/avg/min/max/sum) inside each bucket.
// Mirrors the edge's bucketAndAggregateRows so the chart looks the
// same on Lite as it does on the desktop.
function bucketMergedRows(merged, seriesDefs, groupKey, aggKey) {
  const bucketMs = GROUP_INTERVAL_MS[String(groupKey || "none").toLowerCase()] || 0;
  if (!bucketMs || !merged?.length) return merged;
  const reducer = String(aggKey || "last").toLowerCase();
  const buckets = new Map(); // bucketStartMs -> { ts, lastTs, valuesById: { id -> [..] }, lastById }
  for (const row of merged) {
    const tsMs = Date.parse(row.ts || "");
    if (!Number.isFinite(tsMs)) continue;
    const key = Math.floor(tsMs / bucketMs) * bucketMs;
    let b = buckets.get(key);
    if (!b) {
      b = { ts: new Date(key + Math.floor(bucketMs / 2)).toISOString(),
            lastTs: tsMs, valuesById: {}, lastById: {} };
      buckets.set(key, b);
    }
    for (const def of seriesDefs) {
      const v = row[def.id];
      if (v == null || !Number.isFinite(Number(v))) continue;
      if (!b.valuesById[def.id]) b.valuesById[def.id] = [];
      b.valuesById[def.id].push(Number(v));
      if (tsMs >= b.lastTs) { b.lastById[def.id] = Number(v); }
    }
    if (tsMs > b.lastTs) b.lastTs = tsMs;
  }
  const reduce = (vals) => {
    if (!vals?.length) return null;
    if (reducer === "avg" || reducer === "mean" || reducer === "average") {
      return vals.reduce((a, b) => a + b, 0) / vals.length;
    }
    if (reducer === "min") return Math.min(...vals);
    if (reducer === "max") return Math.max(...vals);
    if (reducer === "sum") return vals.reduce((a, b) => a + b, 0);
    if (reducer === "first") return vals[0];
    if (reducer === "count") return vals.length;
    // default + "last"
    return vals[vals.length - 1];
  };
  const out = [];
  const sortedKeys = [...buckets.keys()].sort((a, b) => a - b);
  sortedKeys.forEach((k, idx) => {
    const b = buckets.get(k);
    const row = { idx, ts: b.ts };
    for (const def of seriesDefs) {
      if (reducer === "last") {
        row[def.id] = (def.id in b.lastById) ? b.lastById[def.id] : null;
      } else {
        row[def.id] = reduce(b.valuesById[def.id]);
      }
    }
    out.push(row);
  });
  return out;
}

function ChartWidget({ widget, liveByKey }) {
  const cfg = widget?.config || {};
  const widgetType = String(widget?.type || "line_chart");
  const sampleCount = useDashSamples();
  const { yAxisAutoFit } = useDashPrefs();
  const yProps = buildYAxisProps(!!yAxisAutoFit);
  const { merged: rawMerged, seriesDefs } = useMultiSeries(widget, sampleCount);

  // Apply the operator's time-grouping + aggregation so Lite respects
  // the same Time grouping / Result aggregation settings the edge does.
  const merged = useMemo(
    () => bucketMergedRows(rawMerged, seriesDefs, cfg.query_group_interval, cfg.query_result_aggregation),
    [rawMerged, seriesDefs, cfg.query_group_interval, cfg.query_result_aggregation]
  );

  // IMPORTANT: every hook call MUST run on every render — putting an
  // early-return before useMemo violates React's rules-of-hooks and
  // crashes with "Rendered more hooks than during the previous render"
  // (React error #310) the moment a tag arrives. Keep all useMemo /
  // useState / useEffect calls above the early returns below.
  const limitLines = useMemo(
    () => widgetLimitLines(widget, liveByKey, null),
    [widget?.config?.series_extra, liveByKey?.lookup, merged.length]
  );

  if (!seriesDefs.length) return h("div", { className: "widget-empty muted" }, "no tag");
  if (!merged.length) return h("div", { className: "widget-empty muted" }, "no samples");

  // Per-series unit/suffix lookup keyed by both label and id so the
  // tooltip can format each value with its own physical units. Built
  // from seriesDefs which already carried unit/suffix down.
  const fmtByKey = {};
  for (const s of seriesDefs) {
    const u = String(s.unit || "");
    const sx = String(s.suffix || "");
    const fmt = (v) => {
      const base = fmtVal(v);
      if (sx) return `${base}${sx}`;
      if (u) return `${base} ${u}`;
      return base;
    };
    fmtByKey[s.label] = fmt;
    fmtByKey[s.id] = fmt;
  }
  const fmtDefault = (v) => fmtVal(v);

  const labelFmt = (v) => merged.find((p) => p.idx === v)?.ts || String(v);
  const hasRightAxis = seriesDefs.some((s) => s.axis === "right")
    || limitLines.some((l) => l.axis === "right");

  // Interpolation (linear / monotone / step / stepAfter / stepBefore /
  // basis / natural) — same option set the edge designer offers. Default
  // monotone matches what Recharts produced before this round.
  const interpolation = (() => {
    const t = String(cfg.interpolation || "monotone").toLowerCase();
    const allowed = new Set(["linear", "monotone", "step", "stepafter", "stepbefore", "basis", "natural"]);
    if (!allowed.has(t)) return "monotone";
    if (t === "stepafter") return "stepAfter";
    if (t === "stepbefore") return "stepBefore";
    return t;
  })();

  // Manual Y axis (left + right): operator-typed [min, max] anchors the
  // axis; otherwise yProps' auto domain is used. ticks are evenly spaced
  // by y_tick_step when provided. Mirrors the edge's manual mode.
  const buildManualY = (mode, lo, hi, step) => {
    if (String(mode || "auto").toLowerCase() !== "manual") return null;
    const a = Number(lo), b = Number(hi);
    if (!Number.isFinite(a) || !Number.isFinite(b) || b <= a) return null;
    const s = Number(step);
    const ticks = Number.isFinite(s) && s > 0
      ? (() => {
          const out = [];
          for (let v = a, i = 0; v <= b + s * 1e-9 && i < 50; v += s, i += 1) {
            out.push(Number(v.toFixed(10)));
          }
          return out;
        })()
      : undefined;
    // Manual mode starts at 0 unless the operator typed a negative min,
    // matching the edge fix shipped earlier today.
    const domainLo = a < 0 ? a : 0;
    return { domain: [domainLo, b], ticks };
  };
  const manualLeft = buildManualY(cfg.y_axis_mode, cfg.y_min, cfg.y_max, cfg.y_tick_step);
  const manualRight = buildManualY(cfg.y_right_axis_mode, cfg.y_right_min, cfg.y_right_max, cfg.y_right_tick_step);
  const leftYProps = manualLeft
    ? { ...yProps, domain: manualLeft.domain, ticks: manualLeft.ticks, allowDataOverflow: true }
    : yProps;
  const rightYProps = manualRight
    ? { ...yProps, domain: manualRight.domain, ticks: manualRight.ticks, allowDataOverflow: true }
    : yProps;

  // Optional axis labels rotated 90° on the inside of each axis.
  const leftAxisLabel = String(cfg.y_axis_label || cfg.primary_unit || "");
  const rightAxisLabel = String(cfg.y_axis_right_label || "");
  const showLegend = cfg.chart_show_legend === true || seriesDefs.length > 1;

  // Extra bottom space so the X-axis tick labels don't overlap the
  // card edge. Operator complaint 2026-06-11: "we need a little bit
  // of space below the charts for the time labels".
  const margin = { ...getChartMargin(), bottom: 22 };

  return h(ResponsiveContainer, { width: "100%", height: "100%" },
    h(buildChartRoot(widgetType, seriesDefs.length), { data: merged, margin },
      h(CartesianGrid, { stroke: "var(--line, rgba(255,255,255,0.07))", strokeDasharray: "3 3" }),
      h(XAxis, buildXAxisProps(merged)),
      h(YAxis, {
        ...leftYProps, yAxisId: "left",
        label: leftAxisLabel
          ? { value: leftAxisLabel, angle: -90, position: "insideLeft", fill: "var(--muted, #8a98ab)", fontSize: 11 }
          : undefined,
      }),
      hasRightAxis ? h(YAxis, {
        ...rightYProps, yAxisId: "right", orientation: "right",
        label: rightAxisLabel
          ? { value: rightAxisLabel, angle: 90, position: "insideRight", fill: "var(--muted, #8a98ab)", fontSize: 11 }
          : undefined,
      }) : null,
      h(Tooltip, {
        ...chartTooltipProps,
        labelFormatter: labelFmt,
        formatter: (v, name) => {
          const fmt = fmtByKey[name] || fmtDefault;
          return [fmt(v), name];
        },
      }),
      showLegend ? h(Legend, { wrapperStyle: { fontSize: 11, color: "var(--muted, #8a98ab)" } }) : null,
      ...seriesDefs.map((s) => renderSeriesElement(s, widgetType, interpolation)),
      // Limit lines render on top of every series. Each one targets
      // its configured axis (left or right) and labels itself with a
      // short caption near the right edge.
      ...limitLines.map((ll) =>
        h(ReferenceLine, {
          key: ll.id,
          y: ll.value,
          yAxisId: ll.axis,
          stroke: ll.color,
          strokeWidth: ll.width,
          strokeDasharray: ll.dash,
          label: {
            value: `${ll.label}: ${fmtVal(ll.value)}`,
            position: "right",
            fill: ll.color,
            fontSize: 10,
          },
        })
      )
    )
  );
}

// Pick the Recharts root for a chart. For single-series widgets the
// natural Line/Area/BarChart is used; for multi-series widgets we use
// ComposedChart which is the only Recharts container that lets you mix
// Line + Area + Bar children freely.
function buildChartRoot(widgetType, seriesCount = 1) {
  if (seriesCount > 1) return ComposedChart;
  if (widgetType === "bar_chart") return BarChart;
  if (widgetType === "line_area_chart") return AreaChart;
  return LineChart;
}

function renderSeriesElement(s, widgetType, interpolation = "monotone") {
  const strokeWidth = Number.isFinite(s.line_width) && s.line_width > 0 ? s.line_width : 1.8;
  const dotProp = (() => {
    const d = String(s.line_dot || "none");
    if (d === "none") return false;
    if (d === "small") return { r: 1.5, fill: s.color };
    if (d === "medium") return { r: 2.5, fill: s.color };
    if (d === "large") return { r: 3.5, fill: s.color };
    return false;
  })();
  if (s.chart_type === "bar" || (widgetType === "bar_chart" && s.chart_type === "")) {
    const barProps = {
      key: s.id, dataKey: s.id, name: s.label,
      yAxisId: s.axis === "right" ? "right" : "left",
      isAnimationActive: false, fill: s.color,
    };
    if (Number.isFinite(s.bar_width) && s.bar_width > 0) barProps.barSize = s.bar_width;
    return h(Bar, barProps);
  }
  if (s.chart_type === "area" || (widgetType === "line_area_chart" && s.chart_type === "")) {
    return h(Area, {
      key: s.id, dataKey: s.id, name: s.label,
      yAxisId: s.axis === "right" ? "right" : "left",
      type: interpolation, stroke: s.color, fill: s.color + "33",
      strokeWidth, dot: dotProp, isAnimationActive: false, connectNulls: true,
    });
  }
  // default: line
  return h(Line, {
    key: s.id, dataKey: s.id, name: s.label,
    yAxisId: s.axis === "right" ? "right" : "left",
    type: interpolation, stroke: s.color, strokeWidth,
    dot: dotProp, isAnimationActive: false, connectNulls: true,
  });
}

// ============================================================
// Widgets (KPI, Meter, Pie, Table, Image, FixedText, Divider)
// ============================================================
function widgetTitle(w) {
  const cfg = w?.config || {};
  return String(w?.title || cfg.title || cfg.tag_name || cfg.text || "").trim();
}

function KpiWidget({ widget, liveByKey, onOpen }) {
  const cfg = widget?.config || {};
  const color = String(widget?.color || "#14a89a");
  const isText = widget?.type === "text_kpi";
  // Prefer the new lookup() (IP-fallback aware) when available; fall
  // back to .get() so older code paths still work during deploy
  // rollover.
  const row = (liveByKey?.lookup
    ? liveByKey.lookup({ gateway_id: cfg.gateway_id, tag_name: cfg.tag_name, plc_endpoint: cfg.plc_endpoint })
    : liveByKey.get(`${cfg.gateway_id}|${cfg.tag_name}`));
  const value = row ? row.value : null;
  const ts = row ? row.ts_utc : null;
  const cls = `widget-kpi ${freshnessClass(ts)}`;
  return h("button", {
      className: cls,
      onClick: () => cfg.tag_name && onOpen(cfg.gateway_id, cfg.gateway_id || "", cfg.tag_name, value, ts),
    },
    h("div", { className: "widget-title" }, widgetTitle(widget) || cfg.tag_name || "—"),
    h("div", { className: "widget-value", style: { color } },
      isText ? (row?.value_text || row?.quality_label || (value == null ? "—" : String(value)))
             : fmtVal(value)),
    h("div", { className: "widget-sub" },
      (cfg.gateway_name || cfg.gateway_id || "—"), " · ", fmtAge(ts), " ago")
  );
}

// Compute color ranges for a meter from widget.config.compute_rules.
// Each rule has { operator, value1, value2, label, color }. Mirrors the
// edge's computeMeterRanges() so the same configured ranges render the
// same arcs in Lite. Falls back to a sensible Low/Normal/High split when
// no rules are configured.
function computeMeterRanges(widget, value) {
  const rules = Array.isArray(widget?.config?.compute_rules) ? widget.config.compute_rules : [];
  const parsed = [];
  rules.forEach((r, idx) => {
    const op = String((r || {}).operator || "between").toLowerCase();
    const v1 = Number(r?.value1);
    const v2 = Number(r?.value2);
    let min = NaN, max = NaN;
    if (op === "between") {
      if (Number.isFinite(v1) && Number.isFinite(v2)) { min = Math.min(v1, v2); max = Math.max(v1, v2); }
    } else if (op === "lt" || op === "lte") { if (Number.isFinite(v1)) { min = -Infinity; max = v1; } }
    else if (op === "gt" || op === "gte") { if (Number.isFinite(v1)) { min = v1; max = Infinity; } }
    else if (op === "eq") { if (Number.isFinite(v1)) { min = v1 - 0.5; max = v1 + 0.5; } }
    if (!Number.isFinite(min) && !Number.isFinite(max)) return;
    parsed.push({
      id: String(r?.id || `range-${idx}`),
      label: String(r?.label || `Range ${idx + 1}`),
      color: String(r?.color || "#14a89a"),
      min, max,
    });
  });
  if (!parsed.length) {
    const v = Number.isFinite(Number(value)) ? Number(value) : 0;
    const floor = Math.floor((v - 10) / 10) * 10;
    const ceil = Math.ceil((v + 10) / 10) * 10;
    const span = Math.max(10, ceil - floor);
    const a = floor;
    const b = floor + span * 0.6;
    const c = floor + span * 0.85;
    return [
      { id: "low", label: "Low", color: "#22c55e", min: a, max: b },
      { id: "normal", label: "Normal", color: "#14a89a", min: b, max: c },
      { id: "high", label: "High", color: "#e2585d", min: c, max: ceil },
    ];
  }
  const finiteMins = parsed.map((r) => r.min).filter((n) => Number.isFinite(n));
  const finiteMaxs = parsed.map((r) => r.max).filter((n) => Number.isFinite(n));
  const cur = Number(value);
  const baseMin = finiteMins.length ? Math.min(...finiteMins) : (Number.isFinite(cur) ? cur - 10 : 0);
  const baseMax = finiteMaxs.length ? Math.max(...finiteMaxs) : (Number.isFinite(cur) ? cur + 10 : 100);
  const domainMin = Math.min(baseMin, Number.isFinite(cur) ? cur : baseMin);
  const domainMax = Math.max(baseMax, Number.isFinite(cur) ? cur : baseMax);
  return parsed.map((r) => ({
    ...r,
    min: Number.isFinite(r.min) ? r.min : domainMin,
    max: Number.isFinite(r.max) ? r.max : domainMax,
  })).sort((a, b) => a.min - b.min);
}

function MeterWidget({ widget, liveByKey, onOpen }) {
  const cfg = widget?.config || {};
  const row = (liveByKey?.lookup
    ? liveByKey.lookup({ gateway_id: cfg.gateway_id, tag_name: cfg.tag_name, plc_endpoint: cfg.plc_endpoint })
    : liveByKey.get(`${cfg.gateway_id}|${cfg.tag_name}`));
  const value = row ? Number(row.value) : NaN;
  const ts = row ? row.ts_utc : null;
  // Honour explicit min/max if the operator set them on the widget; the
  // computed ranges (from compute_rules) still drive the colored arcs.
  const explicitMin = Number(cfg.meter_min);
  const explicitMax = Number(cfg.meter_max);
  const ranges = computeMeterRanges(widget, value);
  const rangeMin = ranges.length ? Math.min(...ranges.map((r) => Number(r.min))) : 0;
  const rangeMax = ranges.length ? Math.max(...ranges.map((r) => Number(r.max))) : 100;
  const domainMin = Number.isFinite(explicitMin) ? explicitMin : rangeMin;
  const domainMax = Number.isFinite(explicitMax) ? explicitMax : rangeMax;
  const gaugeData = ranges
    .map((r) => ({ name: r.label, color: r.color, value: Math.max(0, Number(r.max) - Number(r.min)) }))
    .filter((r) => Number.isFinite(r.value) && r.value > 0);
  const currentPct = Number.isFinite(value)
    ? ((Math.max(domainMin, Math.min(domainMax, value)) - domainMin) / Math.max(1e-9, (domainMax - domainMin))) * 100
    : NaN;
  const pointerDeg = Number.isFinite(currentPct) ? (Math.max(0, Math.min(100, currentPct)) * 180) / 100 - 90 : -90;

  return h("button", {
    className: `widget-meter ${freshnessClass(ts)}`,
    onClick: () => cfg.tag_name && onOpen(cfg.gateway_id, cfg.gateway_id || "", cfg.tag_name, value, ts),
  },
    h("div", { className: "widget-title" }, widgetTitle(widget) || cfg.tag_name || "—"),
    h("div", { className: "widget-meter-gauge" },
      h(ResponsiveContainer, { width: "100%", height: "100%" },
        h(PieChart, null,
          h(Pie, {
            data: gaugeData, dataKey: "value",
            startAngle: 180, endAngle: 0,
            cx: "50%", cy: "70%", innerRadius: "60%", outerRadius: "95%",
            stroke: "none", paddingAngle: 0.6, isAnimationActive: false,
          },
            ...gaugeData.map((entry, idx) =>
              h(Cell, { key: `mseg-${idx}`, fill: entry.color }))
          )
        )
      ),
      // SVG pointer overlay
      h("div", { className: "meter-pointer-wrap", "aria-hidden": "true" },
        h("div", { className: "meter-pointer", style: { transform: `translate(-50%, 0) rotate(${pointerDeg}deg)` } }),
        h("div", { className: "meter-pointer-cap" })
      ),
      h("div", { className: "meter-caption" },
        h("div", { className: "meter-caption-value" }, Number.isFinite(value) ? value.toFixed(2) : "—"),
        h("div", { className: "meter-caption-pct" }, Number.isFinite(currentPct) ? `${currentPct.toFixed(1)}%` : "—")
      )
    ),
    // Compact legend underneath
    ranges.length ? h("div", { className: "meter-legend" },
      ...ranges.map((r) => h("span", { key: r.id, className: "meter-legend-item" },
        h("span", { className: "meter-legend-swatch", style: { background: r.color } }),
        h("span", { className: "meter-legend-label" }, `${r.label} ${Number(r.min).toFixed(1)}–${Number(r.max).toFixed(1)}`)
      ))
    ) : null,
    h("div", { className: "widget-sub" }, fmtAge(ts), " ago")
  );
}

// Match a value against a single computed rule.
function ruleMatches(rule, v) {
  if (!Number.isFinite(v)) return false;
  const op = String(rule?.operator || "between").toLowerCase();
  const v1 = Number(rule?.value1);
  const v2 = Number(rule?.value2);
  if (op === "between" && Number.isFinite(v1) && Number.isFinite(v2))
    return v >= Math.min(v1, v2) && v <= Math.max(v1, v2);
  if ((op === "lt" || op === "lte") && Number.isFinite(v1)) return op === "lt" ? v < v1 : v <= v1;
  if ((op === "gt" || op === "gte") && Number.isFinite(v1)) return op === "gt" ? v > v1 : v >= v1;
  if (op === "eq" && Number.isFinite(v1)) return Math.abs(v - v1) < 1e-9;
  return false;
}

// Fetch the last-N values for a (gw, tag) from historian — used by pie
// "computed" mode to count rule matches. Cached for CHART_TTL_MS like the
// chart widgets so we don't hammer Supabase.
const pieCache = new Map();
async function fetchPieValues(gw, tag, sampleCount, pickedTenantId = "") {
  // Cache key includes pickedTenantId so master switching tenants doesn't
  // serve a stale per-tenant result.
  const key = `${pickedTenantId || "*"}|${gw}|${tag}|${sampleCount}`;
  const now = Date.now();
  const hit = pieCache.get(key);
  if (hit && (now - hit.t) < 30_000) return hit.values;
  const { data, error } = await applyTenantScope(
    supabase
      .from("historian_readings")
      .select("value, tenant_id"),
    pickedTenantId,
  )
    .eq("gateway_id", gw)
    .eq("tag_name", tag)
    .order("ts_utc", { ascending: false })
    .limit(Math.max(20, Number(sampleCount) || 200));
  if (error) return [];
  const values = (data || []).map((r) => Number(r.value)).filter(Number.isFinite);
  pieCache.set(key, { values, t: now });
  return values;
}

// Pie chart widget. Modes:
//   * computed: each rule's slice value = count of historian samples that
//     match the rule. We fetch the last-N samples once per widget (cached
//     30s) and count matches client-side. This matches the desktop's
//     aggregation: 'count' behaviour without needing the stats endpoint.
//   * tag_direct (default): one slice per series_extra + primary tag.
//     Value is the latest absolute reading from live_latest.
function PieWidget({ widget, liveByKey }) {
  const cfg = widget?.config || {};
  const showLegend = cfg.pie_show_legend !== false;
  const isComputed = String(cfg.data_source_type || "").toLowerCase() === "computed";
  const sampleCount = useDashSamples();
  const [computedCounts, setComputedCounts] = useState(null);
  const { pickedTenantId } = useContext(TenantScopeCtx);

  // Fetch historian samples for computed mode, refresh when rule set or
  // sampleCount changes. Also re-run on each new live tick for the
  // primary tag so the counts stay current.
  useEffect(() => {
    if (!isComputed) return;
    let stopped = false;
    const refresh = async () => {
      const rules = Array.isArray(cfg.compute_rules) ? cfg.compute_rules : [];
      if (!rules.length) { setComputedCounts([]); return; }
      // Each rule can carry its own (gateway_id, tag_name); fall back to
      // the widget's primary tag if missing.
      const fetched = new Map();
      const counts = [];
      // Same aggregation semantics the edge applies in dashboardAnalytics.js:
      //   count   — number of samples that match the rule
      //   sum     — total of matching values
      //   avg     — mean of matching values
      //   min/max — extremes of matching values
      //   latest  — most-recent matching value (values arrive oldest-first
      //             from fetchPieValues, so this is the last entry)
      const reduce = (matchVals, mode) => {
        if (!matchVals.length) return mode === "count" ? 0 : null;
        switch (String(mode || "count").toLowerCase()) {
          case "sum":    return matchVals.reduce((a, b) => a + b, 0);
          case "avg":    return matchVals.reduce((a, b) => a + b, 0) / matchVals.length;
          case "min":    return Math.min(...matchVals);
          case "max":    return Math.max(...matchVals);
          case "latest":
          case "last":   return matchVals[matchVals.length - 1];
          case "count":
          default:       return matchVals.length;
        }
      };
      for (const r of rules) {
        const gw  = r.gateway_id || cfg.gateway_id || "";
        const tag = r.tag_name || cfg.tag_name || "";
        const k = `${gw}|${tag}`;
        if (!fetched.has(k)) fetched.set(k, await fetchPieValues(gw, tag, Number(sampleCount) || 200, pickedTenantId));
        const values = fetched.get(k);
        const matching = values.filter((v) => ruleMatches(r, v));
        const agg = reduce(matching, r.aggregation || "count");
        counts.push(Number.isFinite(agg) ? agg : 0);
      }
      if (!stopped) setComputedCounts(counts);
    };
    refresh();
    // Re-run when a fresh live sample for the configured tag arrives.
    const handler = (row) => {
      if (!row || row.tag_name !== cfg.tag_name || row.gateway_id !== cfg.gateway_id) return;
      // Invalidate cache so the next refresh picks the new sample up.
      const key = `${cfg.gateway_id}|${cfg.tag_name}|${Number(sampleCount) || 200}`;
      pieCache.delete(key);
      refresh();
    };
    historianSubscribers.add(handler);
    ensureHistorianChannel();
    return () => { stopped = true; historianSubscribers.delete(handler); };
  }, [isComputed, JSON.stringify(cfg.compute_rules || []), cfg.gateway_id, cfg.tag_name, sampleCount, pickedTenantId]);

  let data;
  if (isComputed) {
    const rules = Array.isArray(cfg.compute_rules) ? cfg.compute_rules : [];
    if (computedCounts == null) {
      return h("div", { className: "widget-empty muted" }, h("span", { className: "spinner" }), " loading…");
    }
    data = rules.map((r, idx) => ({
      name: String(r?.label || `Item ${idx + 1}`),
      value: Math.max(0, Number(computedCounts[idx] || 0)),
      color: String(r?.color || pickPaletteColor(idx)),
    }));
  } else {
    const series = widgetAllSeries(widget);
    data = series.map((s, idx) => {
      const row = (liveByKey?.lookup
        ? liveByKey.lookup({ gateway_id: s.gateway_id, tag_name: s.tag_name, plc_endpoint: s.plc_endpoint || cfg.plc_endpoint })
        : liveByKey.get(`${s.gateway_id}|${s.tag_name}`));
      const v = Number(row?.value);
      return {
        name: s.label,
        value: Number.isFinite(v) ? Math.abs(v) : 0,
        color: s.color || pickPaletteColor(idx),
      };
    });
  }
  const total = data.reduce((acc, d) => acc + (d.value || 0), 0);
  if (!total) return h("div", { className: "widget-empty muted" }, "no matches");
  return h("div", { className: "widget-pie-wrap" },
    h("div", { className: "widget-pie-chart" },
      h(ResponsiveContainer, { width: "100%", height: "100%" },
        h(PieChart, null,
          h(Pie, {
            data, dataKey: "value", nameKey: "name",
            cx: "50%", cy: "50%", innerRadius: "55%", outerRadius: "90%",
            stroke: "none", paddingAngle: 1.4, isAnimationActive: false,
          },
            ...data.map((entry, idx) => h(Cell, { key: `pie-${idx}`, fill: entry.color }))
          ),
          h(Tooltip, { ...chartTooltipProps, formatter: (v, n) => [fmtVal(v), n] })
        )
      )
    ),
    showLegend ? h("div", { className: "widget-pie-legend" },
      ...data.map((d, i) => {
        const pct = total > 0 ? (d.value / total * 100) : 0;
        return h("span", { key: i, className: "pie-legend-item" },
          h("span", { className: "pie-legend-dot", style: { background: d.color } }),
          h("span", null, d.name),
          h("span", { className: "pie-legend-value" }, `${fmtVal(d.value)} (${pct.toFixed(0)}%)`)
        );
      })
    ) : null
  );
}

function TableWidget({ widget }) {
  const cfg = widget?.config || {};
  const sampleCount = useDashSamples();
  // Per-widget table size (query_row_limit / list_limit) takes precedence
  // over the dashboard-level sample count so the edge editor's table-row
  // selector is honoured in Lite. Falls back to the dashboard default
  // when no per-widget limit is set.
  const rowLimit = Math.max(1, Math.min(2000, Number(cfg.query_row_limit || cfg.list_limit || sampleCount || 20)));
  const rowSel = String(cfg.query_row_selection || "all").toLowerCase();
  const series = useChartSeries(cfg.gateway_id || "", cfg.tag_name || "", rowLimit, cfg.plc_endpoint || cfg.plc_ip || "");
  // useChartSeries returns oldest-first; pick the right slice for the
  // configured row_selection (latest/last_n = tail, oldest = head, all = full).
  let rows;
  if (rowSel === "oldest") {
    rows = series.slice(0, rowLimit).reverse();
  } else if (rowSel === "all") {
    rows = series.slice().reverse();
  } else {
    rows = series.slice(-rowLimit).reverse();
  }
  if (!cfg.tag_name) return h("div", { className: "widget-empty muted" }, "no tag");
  if (!rows.length) return h("div", { className: "widget-empty muted" }, "no samples");
  return h("div", { className: "widget-table-mount" },
    h("table", { className: "hist-table", style: { fontSize: 11 } },
      h("thead", null, h("tr", null,
        h("th", null, "Time"), h("th", null, "Value"))),
      h("tbody", null, ...rows.map((r, i) =>
        h("tr", { key: i },
          h("td", null, fmtTs(r.ts)),
          h("td", { className: "num" }, fmtVal(r.value))
        )))
    )
  );
}

function ImageWidget({ widget }) {
  const cfg = widget?.config || {};
  if (!cfg.source_url) return h("div", { className: "widget-empty muted" }, "no image");
  return h("img", { className: "widget-image", src: cfg.source_url, alt: widgetTitle(widget) || "image" });
}

function Widget({ widget, liveByKey, onOpen, onOpenWidget, gridStyle }) {
  const type = String(widget?.type || "");
  if (SKIPPED_TYPES.has(type)) return null;
  const isChart = type === "line_chart" || type === "line_area_chart" || type === "bar_chart";
  const isKpi   = type === "value_kpi" || type === "text_kpi";
  const inner =
    isChart        ? h(ChartWidget,  { widget, liveByKey }) :
    isKpi          ? h(KpiWidget,    { widget, liveByKey, onOpen }) :
    type === "meter_chart" ? h(MeterWidget, { widget, liveByKey, onOpen }) :
    type === "pie_chart"   ? h(PieWidget,   { widget, liveByKey }) :
    type === "table_list"  ? h(TableWidget, { widget }) :
    type === "image"       ? h(ImageWidget, { widget }) :
    type === "fixed_text"  ? h("div", { className: "widget-text" }, widget?.config?.text || "") :
    type === "divider"     ? h("div", { className: "widget-divider" }, widget?.config?.text || "") :
                              h("div", { className: "widget-empty muted" }, type || "widget");
  const cfg = widget?.config || {};
  // Operator can hide the widget title bar on the edge to give the
  // chart the full card area. Mirror that here so headerless widgets
  // look identical between edge and Lite.
  const hideHeader = !!cfg.hide_widget_header;
  // Edge dashboards show "<value> | <tag> | <type>" in the title bar
  // (one pair per series for multi-series charts). Reproduce that here
  // by resolving every series's current value from liveByKey, applying
  // the same multiplier/offset that the chart uses, and rendering each
  // value in its own series color. Operator-reported gap 2026-06-11.
  const headerBuild = (() => {
    if (!isChart || hideHeader) return null;
    const palette = ["#14a89a", "#f97316", "#6e8dd2", "#e2585d", "#a855f7", "#0e8479", "#22c55e", "#fbbf24"];
    const typeLabel = (
      widget?.title && String(widget.title).trim()
    ) || (
      type === "line_chart" ? "Line Chart" :
      type === "line_area_chart" ? "Area Chart" :
      type === "bar_chart" ? "Bar Chart" :
      String(type || "Chart")
    );
    const items = [];
    const fmtHead = (v) => {
      if (v == null || !Number.isFinite(Number(v))) return "—";
      return Number(v).toLocaleString(undefined, { maximumFractionDigits: 3 });
    };
    const scale = (raw, mul, off) => {
      const v = Number(raw);
      if (!Number.isFinite(v)) return null;
      const m = Number.isFinite(Number(mul)) && Number(mul) !== 0 ? Number(mul) : 1;
      const o = Number.isFinite(Number(off)) ? Number(off) : 0;
      return v * m + o;
    };
    // Primary
    if (cfg.tag_name) {
      const row = liveByKey?.lookup ? liveByKey.lookup({
        gateway_id: cfg.gateway_id,
        tag_name: cfg.tag_name,
        plc_endpoint: cfg.plc_endpoint || cfg.plc_ip,
      }) : null;
      const v = row ? scale(row.value, cfg.multiplier, cfg.offset) : null;
      items.push({
        value: fmtHead(v),
        tag: String(cfg.tag_name),
        color: String(widget?.color || "#14a89a"),
      });
    }
    // Extras (skip limits)
    const extras = Array.isArray(cfg.series_extra) ? cfg.series_extra : [];
    extras.forEach((s, i) => {
      if (!s || !s.tag_name) return;
      if (String(s.chart_type || "").toLowerCase() === "limit") return;
      const row = liveByKey?.lookup ? liveByKey.lookup({
        gateway_id: s.gateway_id || cfg.gateway_id,
        tag_name: s.tag_name,
        plc_endpoint: s.plc_endpoint || s.plc_ip || cfg.plc_endpoint,
      }) : null;
      const v = row ? scale(row.value, s.multiplier, s.offset) : null;
      items.push({
        value: fmtHead(v),
        tag: String(s.label || s.tag_name),
        color: String(s.color || palette[(i + 1) % palette.length]),
      });
    });
    if (!items.length) return { typeLabel, items: [] };
    return { typeLabel, items };
  })();
  const renderHeader = () => {
    if (!headerBuild) return h("div", { className: "widget-title" }, widgetTitle(widget) || cfg.tag_name || "—");
    const { items, typeLabel } = headerBuild;
    const children = [];
    items.forEach((it, idx) => {
      if (idx > 0) children.push(h("span", { key: `sep-${idx}`, className: "widget-head-sep" }, "·"));
      children.push(h("span", { key: `v-${idx}`, className: "widget-head-value", style: { color: it.color } }, it.value));
      children.push(h("span", { key: `b-${idx}`, className: "widget-head-sep" }, "|"));
      children.push(h("span", { key: `t-${idx}`, className: "widget-head-tag" }, it.tag));
    });
    if (items.length) children.push(h("span", { key: "tsep", className: "widget-head-sep" }, "|"));
    children.push(h("span", { key: "typ", className: "widget-head-type" }, typeLabel));
    return h("div", { className: "widget-head-text" }, ...children);
  };
  const titleBar = (isChart && !hideHeader)
    ? h("div", { className: "widget-title-row" },
        renderHeader(),
        onOpenWidget ? h("button", {
          className: "widget-expand",
          title: "Open in Tag Monitor",
          "aria-label": "Open in Tag Monitor",
          onClick: () => onOpenWidget(widget),
        }, h("span", { dangerouslySetInnerHTML: { __html:
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>'
        } })) : null
      )
    : null;
  return h("div", {
    className: `widget widget-${type}`,
    "data-gw": cfg.gateway_id || "",
    "data-tag": cfg.tag_name || "",
    // gridStyle is set by DashboardView when the parent container is the
    // 20-col widget-grid. It places the widget at its edge-defined x/y
    // and spans w/h cells. Empty/undefined when using the auto-flow
    // layout, where the browser sizes naturally.
    style: gridStyle || undefined,
  },
    titleBar,
    h("div", { className: "widget-body" + (isChart ? " widget-chart" : "") }, inner)
  );
}
