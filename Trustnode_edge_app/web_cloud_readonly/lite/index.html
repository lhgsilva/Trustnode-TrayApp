// Drawer (tap a tile -> uPlot would have been the old way; with
// Recharts loaded we render the chart full-size inside the modal).
// ============================================================
const RANGE_OPTS = [
  { label: "5m", ms: 5 * 60_000 },
  { label: "15m", ms: 15 * 60_000 },
  { label: "1h", ms: 60 * 60_000 },
  { label: "6h", ms: 6 * 60 * 60_000 },
  { label: "24h", ms: 24 * 60 * 60_000 },
  { label: "7d", ms: 7 * 24 * 60 * 60_000 },
];

// Merge multiple per-series ts->value buffers into one Recharts dataset.
// Uses the same carry-forward resample as useMultiSeries so missing
// samples in one series don't blank out the other.
function buildMergedFromBuffers(defs, buffers, cap) {
  const tsSet = new Set();
  for (const def of defs) {
    const buf = buffers.get(def.id);
    if (!buf) continue;
    for (const ts of buf.keys()) tsSet.add(ts);
  }
  const sortedTs = [...tsSet].sort();
  if (!sortedTs.length) return [];
  const limit = Math.max(20, Math.min(20000, Number(cap) || 500));
  const window = sortedTs.slice(-limit);
  const seriesEntries = defs.map((def) => {
    const buf = buffers.get(def.id);
    const entries = buf ? [...buf.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1) : [];
    return { def, entries, ptr: 0, last: null };
  });
  return window.map((ts, idx) => {
    const row = { idx, ts };
    for (const st of seriesEntries) {
      while (st.ptr < st.entries.length && st.entries[st.ptr][0] <= ts) {
        st.last = st.entries[st.ptr][1];
        st.ptr += 1;
      }
      row[st.def.id] = (st.last === undefined ? null : st.last);
    }
    return row;
  });
}

// Tag Monitor: full-screen modal that overlays every series of a chart
// widget (or a single ad-hoc tag from a tile tap) onto one big chart.
// Range tabs from 5 minutes to 7 days. Max-points selector to keep large
// ranges responsive. Live-appends each new historian row in place via the
// shared realtime channel so the chart stays current while open.
function TagMonitor({ open, payload, onClose }) {
  const [rangeMs, setRangeMs] = useState(60 * 60_000);
  const [maxPoints, setMaxPoints] = useState(500);
  const [data, setData] = useState(null);
  const [error, setError] = useState("");
  const [seriesDefs, setSeriesDefs] = useState([]);
  const { pickedTenantId } = useContext(TenantScopeCtx);
  // Keep raw per-series buffers in a ref so the live handler can mutate
  // without triggering a re-merge on every tick (we throttle to rAF).
  const buffersRef = useRef(new Map());

  useEffect(() => {
    if (!open || !payload) return;
    let stopped = false;
    setData(null); setError("");
    let defs;
    if (payload.widget) {
      defs = widgetAllSeries(payload.widget);
    } else if (payload.tag_name) {
      defs = [{
        id: "primary",
        gateway_id: payload.gateway_id || "",
        plc_endpoint: payload.plc_endpoint || payload.plc_ip || "",
        tag_name: payload.tag_name,
        label: payload.tag_name,
        color: "#14a89a",
        axis: "left",
        chart_type: "line",
      }];
    } else { defs = []; }
    setSeriesDefs(defs);
    buffersRef.current = new Map(defs.map((s) => [s.id, new Map()]));

    const fromTs = new Date(Date.now() - rangeMs).toISOString();
    (async () => {
      const results = await Promise.all(defs.map((s) => {
        const base = applyTenantScope(
          supabase.from("historian_readings")
            .select("ts_utc, value, tenant_id, gateway_id, plc_ip"),
          pickedTenantId,
        ).eq("tag_name", s.tag_name);
        const filtered = s.plc_endpoint
          ? base.or(`gateway_id.eq.${s.gateway_id},plc_ip.eq.${s.plc_endpoint}`)
          : base.eq("gateway_id", s.gateway_id);
        return filtered
          .gte("ts_utc", fromTs)
          .order("ts_utc", { ascending: true })
          .limit(Math.max(50, Math.min(20000, Number(maxPoints) || 500)))
          .then(({ data, error }) => ({ s, rows: data || [], error }));
      }));
      if (stopped) return;
      const errored = results.find((r) => r.error);
      if (errored) { setError(errored.error.message); return; }
      // Fill buffers + first merge.
      results.forEach(({ s, rows }) => {
        const buf = buffersRef.current.get(s.id);
        if (!buf) return;
        for (const r of rows) {
          const v = Number(r.value);
          if (Number.isFinite(v)) buf.set(r.ts_utc, v);
        }
      });
      setData(buildMergedFromBuffers(defs, buffersRef.current, maxPoints));
    })();

    // Live-append: subscribe to historian inserts for each (gw,tag) pair.
    ensureHistorianChannel();
    let rafScheduled = false;
    const handler = (row) => {
      if (!row || !row.tag_name) return;
      // Same gateway-id-or-endpoint match as the seed query.
      const match = defs.find((s) =>
        s.tag_name === row.tag_name &&
        (s.gateway_id === row.gateway_id ||
          (s.plc_endpoint && row.plc_ip && s.plc_endpoint === row.plc_ip)));
      if (!match) return;
      const buf = buffersRef.current.get(match.id);
      const v = Number(row.value);
      if (!Number.isFinite(v)) return;
      buf.set(row.ts_utc, v);
      // Throttle the merge to one per animation frame.
      if (rafScheduled) return;
      rafScheduled = true;
      requestAnimationFrame(() => {
        rafScheduled = false;
        if (stopped) return;
        setData(buildMergedFromBuffers(defs, buffersRef.current, maxPoints));
      });
    };
    historianSubscribers.add(handler);

    return () => {
      stopped = true;
      historianSubscribers.delete(handler);
    };
  }, [open, payload, rangeMs, maxPoints, pickedTenantId]);

  const { yAxisAutoFit: monAutoFit } = useDashPrefs();
  const monYProps = buildYAxisProps(!!monAutoFit);
  if (!open) return null;
  const title = payload?.widget
    ? widgetTitle(payload.widget) || "Tag Monitor"
    : `${payload?.tag_name || ""} · ${payload?.gateway_name || payload?.gateway_id || ""}`;
  const hasRight = seriesDefs.some((s) => s.axis === "right");
  const widgetType = String(payload?.widget?.type || "line_chart");
  const labelFmt = (v) => (data && data.find((p) => p.idx === v)?.ts) || String(v);

  return h("div", { className: "monitor-back", onClick: (e) => { if (e.target.classList.contains("monitor-back")) onClose(); } },
    h("div", { className: "monitor" },
      h("div", { className: "monitor-head" },
        h("h3", null, title),
        h("button", { className: "close", onClick: onClose }, "Close")
      ),
      h("div", { className: "monitor-chart-wrap" },
        data == null ? h("div", { className: "empty" }, h("div", { className: "spinner" }), " loading…") :
        error       ? h("div", { className: "banner" }, error) :
        (data.length === 0 || seriesDefs.length === 0)
          ? h("div", { className: "empty" }, "No samples in this range.")
          : h(ResponsiveContainer, { width: "100%", height: "100%" },
              h(buildChartRoot(widgetType, seriesDefs.length), { data, margin: getChartMargin() },
                h(CartesianGrid, { stroke: "var(--line, rgba(255,255,255,0.07))", strokeDasharray: "3 3" }),
                h(XAxis, buildXAxisProps(data)),
                h(YAxis, { ...monYProps, yAxisId: "left" }),
                hasRight ? h(YAxis, { ...monYProps, yAxisId: "right", orientation: "right" }) : null,
                h(Tooltip, { ...chartTooltipProps, labelFormatter: labelFmt, formatter: (v, n) => [fmtVal(v), n] }),
                h(Legend, { wrapperStyle: { fontSize: 12, color: "var(--muted, #8a98ab)" } }),
                ...seriesDefs.map((s) => renderSeriesElement(s, widgetType))
              )
            )
      ),
      h("div", { className: "monitor-meta" },
        h("span", { className: "status-pill status-online" },
          h("span", { className: "pill-dot" }),
          h("span", null, "LIVE")
        ),
        h("span", null, "Series: ", seriesDefs.length),
        h("span", null, "Samples: ", data ? data.length : 0),
        h("label", { className: "monitor-points-pick" },
          h("span", null, "Points"),
          h("select", {
            value: String(maxPoints),
            onChange: (e) => setMaxPoints(Number(e.target.value)),
          },
            ...[50, 100, 200, 500, 1000, 2000, 5000].map((n) =>
              h("option", { key: n, value: String(n) }, String(n))
            )
          )
        )
      ),
      h("div", { className: "range-tabs" },
        ...RANGE_OPTS.map((opt) => h("button", {
          key: opt.label,
          className: rangeMs === opt.ms ? "active" : "",
          onClick: () => setRangeMs(opt.ms),
        }, opt.label))
      )
    )
  );
}

// ============================================================
// Dashboard prefs (per-row, card-height, sample-count)
// ============================================================
// `yAxisAutoFit` — when true, chart Y-axes hug `[dataMin, dataMax]` so small
// variations are visible. When false (default) Recharts pads the domain with
// rounded ticks (`['auto', 'auto']`), giving more headroom but flattening
// small swings. Toggle from the Settings modal.
const DashPrefsCtx = React.createContext({ perRow: 2, cardHeight: 220, sampleCount: 20, yAxisAutoFit: false });
function useDashPrefs() { return React.useContext(DashPrefsCtx); }
function useDashSamples() { return useDashPrefs().sampleCount; }

const DEFAULT_DASH_PREFS = { perRow: 2, cardHeight: 220, sampleCount: 20, yAxisAutoFit: false };
function loadDashPrefs() {
  try {
    const raw = localStorage.getItem("tnlite-dash-prefs");
    if (raw) return { ...DEFAULT_DASH_PREFS, ...JSON.parse(raw) };
  } catch (_) {}
  return { ...DEFAULT_DASH_PREFS };
}
function saveDashPrefs(p) {
  try { localStorage.setItem("tnlite-dash-prefs", JSON.stringify(p)); } catch (_) {}
}

// ============================================================
// Header + Sidebar + Tabs
// ============================================================
function StatusPill({ liveRows, transport, gatewayLastSeen }) {
  // Belt-and-braces: when a tenant is picked, the badge MUST only reflect
  // that tenant's freshness. Even though useLiveLatest already filters
  // liveRows, a race during tenant switching can briefly leak rows from
  // the previous tenant. Re-filter here so the header age never flickers
  // between two customers.
  const { pickedTenantId } = useContext(TenantScopeCtx);
  // Self-tick once a second so the displayed age advances even when no
  // new realtime row has arrived. Without this, the StatusPill froze at
  // the last fetched timestamp and the operator had to refresh the page
  // to see whether the edge was still alive.
  const [nowMs, setNowMs] = useState(() => Date.now());
  useEffect(() => {
    const t = setInterval(() => setNowMs(Date.now()), 1000);
    return () => clearInterval(t);
  }, []);
  let newest = 0;
  for (const r of liveRows) {
    if (pickedTenantId && r.tenant_id !== pickedTenantId) continue;
    const t = Date.parse(r.ts_utc || 0);
    if (Number.isFinite(t) && t > newest) newest = t;
  }
  // Count how many gateways have ever reported. If zero, this tenant has
  // no active edge — show OFFLINE instead of STALE so the operator can
  // distinguish "edge is dead" from "edge is slow".
  const gatewayCount = gatewayLastSeen ? Object.keys(gatewayLastSeen).length : 0;
  const age = newest ? Math.max(0, nowMs - newest) : null;
  let label = "LIVE", cls = "status-online";
  if (gatewayCount === 0 && age == null) {
    label = "OFFLINE"; cls = "status-offline";
  } else if (age == null) {
    label = "LOADING"; cls = "status-muted";
  } else if (age > 60000) {
    // No new sample for more than a minute on ANY gateway → treat the
    // edge as offline rather than stale.
    label = "OFFLINE"; cls = "status-offline";
  } else if (age > 3000) {
    label = "STALE"; cls = "status-offline";
  } else if (age > 1000) {
    label = "DELAYED"; cls = "status-warning";
  } else if (transport !== "realtime") {
    label = "POLLING"; cls = "status-online";
  }
  const fmt = (v) => v == null ? "—" : v < 1000 ? `${Math.round(v)} ms` : `${(v / 1000).toFixed(1)} s`;
  return h("span", { className: `status-pill ${cls}` },
    h("span", { className: "pill-dot" }),
    h("span", null, `${label} · ${fmt(age)}`)
  );
}

function Header({ user, tenantLabel, theme, onToggleTheme, onSignOut, liveRows, transport, gatewayLastSeen, onJumpAlarms, sidebarVisible, onToggleSidebar,

                  // longer rendered here — the picker moved into the
                  // dashboard-settings modal so mobile (where the header
                  // is cramped) can reach it. We keep the static
                  // tenantLabel in the header for at-a-glance context.
                  isGlobalAdmin, availableTenants, pickedTenantId, onPickTenant }) {
  const activeAlarms = useActiveAlarmCount();
  // Browser fullscreen state. Tracked via the fullscreenchange event so
  // the icon flips even when the user pressed F11/Esc directly.
  const [isFullscreen, setIsFullscreen] = useState(() => {
    try { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
    catch (_) { return false; }
  });
  useEffect(() => {
    const sync = () => {
      try { setIsFullscreen(!!(document.fullscreenElement || document.webkitFullscreenElement)); }
      catch (_) { setIsFullscreen(false); }
    };
    document.addEventListener("fullscreenchange", sync);
    document.addEventListener("webkitfullscreenchange", sync);
    return () => {
      document.removeEventListener("fullscreenchange", sync);
      document.removeEventListener("webkitfullscreenchange", sync);
    };
  }, []);
  const toggleFullscreen = async () => {
    try {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        if (document.exitFullscreen) await document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      } else {
        const el = document.documentElement;
        if (el.requestFullscreen) await el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      }
    } catch (_) { /* ignore */ }
  };
  return h("header", { className: "app-header" },
    h("div", { className: "header-left" },
      // Sidebar toggle — hidden in share-link mode where the link is
      // intentionally distraction-free (Dashboard only). Tenant users
      // and master keep their menu chevron.
      isViewLinkMode ? null : h("button", {
        className: "icon-btn header-sidebar-toggle",
        title: sidebarVisible ? "Hide menu" : "Show menu",
        onClick: onToggleSidebar,

        h("img", {
          src: "/lite/trustnode_logo.png",
          alt: "TrustNode",
          className: "brand-full-logo",
          onError: (e) => { e.target.style.display = "none"; },
        })
      )
    ),
    h("div", { className: "header-center" },
      h("div", { className: "header-cloud-controls" },
        h("span", { className: "header-cloud-label" }, "Customer"),
        // Static label only. The master-admin tenant picker lives in
        // the dashboard-settings modal (the gear button) so it stays
        // reachable on mobile, where the header has no room for a
        // dropdown.
        h("span", { style: { fontWeight: 600, fontSize: 13 } }, tenantLabel),
        h(StatusPill, { liveRows, transport, gatewayLastSeen })
      )
    ),
    h("div", { className: "header-right" },
      h("button", {
        className: `icon-btn ${activeAlarms > 0 ? "has-alerts" : ""}`,
        title: activeAlarms > 0 ? `${activeAlarms} active alarm${activeAlarms === 1 ? "" : "s"}` : "Alarms",
        onClick: onJumpAlarms,
      },
        icBell(),
        activeAlarms > 0 ? h("span", { className: "alarm-badge" },
          activeAlarms > 99 ? "99+" : String(activeAlarms)) : null
      ),
      h("button", { className: "icon-btn", title: "Refresh", onClick: () => window.location.reload() }, icRefresh()),
      h("button", {
        className: "icon-btn",
        title: `Switch to ${theme === "dark" ? "light" : "dark"} mode`,
        onClick: onToggleTheme,
      }, theme === "dark" ? icSun() : icMoon()),
      h("button", {
        className: "icon-btn",
        title: isFullscreen ? "Exit fullscreen" : "Enter fullscreen",
        onClick: toggleFullscreen,
      }, isFullscreen ? icMinimize() : icMaximize()),
      // Sign-out is meaningless in share-link mode (no session). Instead
      // show an Exit button so the operator embedded in the portal has a
      // visible way to leave the read-only view — closes the tab when the
      // page was opened in its own window, posts a message to the parent
      // portal otherwise so the iframe host can hide the embed.
      isViewLinkMode
        ? h("button", {
            className: "icon-btn",
            title: "Exit Client View",
            onClick: () => {
              try {
                if (window.parent && window.parent !== window) {
                  window.parent.postMessage({ source: "tnlite", action: "close-view-link" }, "*");
                }
              } catch (_) {}
              try { window.close(); } catch (_) {}
              // Fallback for browsers that block window.close on tabs they
              // didn't open: navigate to the public portal root.
              try { window.location.replace("/portal/"); } catch (_) {}
            },
          }, icSignOut())
        : h("button", { className: "icon-btn", title: "Sign out", onClick: onSignOut }, icSignOut())
    )
  );
}

function DashboardView({ liveRows, profiles, active, activeKey, setActiveKey, prefs, setPrefs, gatewayLastSeen, onOpenDrawer, onOpenWidget,
                         // Master-admin picker props — passed through to the settings modal.
                         isGlobalAdmin, availableTenants, pickedTenantId, onPickTenant,
                         availableEdges = [], pickedEdgeId = "", onPickEdge = null }) {
  const [settingsOpen, setSettingsOpen] = useState(false);
  // ensure historian channel is up so chart widgets can append.
  useEffect(() => { ensureHistorianChannel(); }, []);

  const widgets = useMemo(() => {
    const ws = Array.isArray(active?.payload?.widgets) ? active.payload.widgets : [];
    return ws.filter((w) => w && !SKIPPED_TYPES.has(String(w.type || "")));
  }, [active]);

  // Honour the per_row saved in the dashboard payload (1..4) — this is
  // what the operator configured on the edge. Lite was ignoring it and
  // always reading the local "Cards per row" preference, which made the
  // cloud view look different from the desktop view. The user can still
  // override locally from the settings modal; profile per_row wins on
  // first load.
  const profilePerRow = useMemo(() => {
    const n = Number(active?.payload?.per_row);
    return Number.isFinite(n) && n >= 1 && n <= 4 ? Math.round(n) : null;
  }, [active]);
  const effectivePerRow = profilePerRow ?? prefs.perRow;

  // Two-layer index: gateway_id-keyed (primary) + plc_ip-keyed (fallback).
  // When a widget's configured gateway is silent, lookups can still hit
  // a row from a second gateway pointing at the same PLC. Widget code
  // calls `liveByKey.lookup(widget)`; we keep `.get(key)` for the
  // legacy chart-series code path elsewhere.
  const liveByKey = useMemo(() => {
    const byId = new Map();   // `${gateway_id}|${tag}` -> row
    const byIp = new Map();   // `IP::${plc_ip}|${tag}` -> row
    for (const r of liveRows) {
      byId.set(`${r.gateway_id || ""}|${r.tag_name}`, r);
      if (r.plc_ip) byIp.set(`IP::${r.plc_ip}|${r.tag_name}`, r);
    }
    return {
      get: (key) => byId.get(key),
      // widget can carry { gateway_id, tag_name, plc_endpoint }; lookup
      // tries gateway-id first, then plc_endpoint fallback. plc_endpoint
      // is written by the edge at widget-save time (saveDashboardWidget).
      lookup: (widget) => {
        if (!widget?.tag_name) return null;
        const gid = widget.gateway_id || "";
        const tag = widget.tag_name;
        const primary = byId.get(`${gid}|${tag}`);
        if (primary) return primary;
        const ip = widget.plc_endpoint || widget.plc_ip || "";
        if (ip) return byIp.get(`IP::${ip}|${tag}`) || null;
        return null;
      },
    };
  }, [liveRows]);

  return h("div", null,
    h(DashboardToolbar, {
      widgetCount: widgets.length, profiles, activeKey, setActiveKey,
      prefs, setPrefs, gatewayLastSeen,
      settingsOpen, setSettingsOpen,
    }),
    h(DashboardSettingsModal, {
      open: settingsOpen, onClose: () => setSettingsOpen(false),
      profiles, activeKey, setActiveKey, prefs, setPrefs,
      isGlobalAdmin, availableTenants, pickedTenantId, onPickTenant,
      availableEdges, pickedEdgeId, onPickEdge,
    }),
    widgets.length === 0 ?
      h("div", { className: "empty" },
        "No dashboard widgets have been published from the edge yet. ",
        "Configure widgets in the TrustNode desktop app and they will appear here.")
    :
      // Layout: when every widget carries x/y/w/h (set on the edge via
      // drag-and-drop in the desktop dashboard), render on the 20x20
      // grid so the cloud view mirrors the operator's arrangement. Fall
      // back to the auto-flow `widget-flow` layout for older payloads
      // without coordinates. Mobile (≤720px) collapses to a stacked
      // single column either way (see styles.css media query).
      ((widgets.every((w) => Number.isFinite(Number(w?.w)) && Number.isFinite(Number(w?.h))))
        ? h("div", { className: "widget-grid" },
            ...widgets.map((w) => h(Widget, {
              key: w.id || `${w.type}-${w.config?.tag_name || Math.random()}`,
              widget: w,
              liveByKey,
              onOpen: onOpenDrawer,
              onOpenWidget,
              // Inline grid-position so each widget lands where the edge
              // operator placed it. clamp() guards against bad data:
              // x/y default to auto, w/h to a sensible cell footprint.
              gridStyle: {
                gridColumn: `${Math.max(1, Number(w.x || 0) + 1)} / span ${Math.max(1, Math.min(20, Number(w.w) || 10))}`,
                gridRow: `${Math.max(1, Number(w.y || 0) + 1)} / span ${Math.max(1, Math.min(40, Number(w.h) || 5))}`,
              },
            }))
          )
        : h("div", { className: `widget-flow per-row-${effectivePerRow}` },
            ...widgets.map((w) => h(Widget, {
              key: w.id || `${w.type}-${w.config?.tag_name || Math.random()}`,
              widget: w,
              liveByKey,
              onOpen: onOpenDrawer,
              onOpenWidget,
            }))
          )
      )
  );
}

// ============================================================
// Other tabs (Historian, Alarms, Power, Reporting)
// ============================================================
// Historian view with a one-row filter bar: gateway / tag / time range /
// limit. Filters are server-side so we don't drag thousands of rows down
// just to grep them client-side. Both gateway and tag use case-insensitive
// substring matching via ilike. Re-runs whenever a filter changes; auto-
// refreshes every 5s.
const HISTORY_RANGES = [
  { label: "15m", ms: 15 * 60_000 },
  { label: "1h",  ms: 60 * 60_000 },
  { label: "6h",  ms: 6 * 60 * 60_000 },
  { label: "24h", ms: 24 * 60 * 60_000 },
  { label: "7d",  ms: 7 * 24 * 60 * 60_000 },
  { label: "All", ms: 0 },
];
function HistorianView() {
  const [rows, setRows] = useState(null);
  const [error, setError] = useState("");
  const [gwFilter, setGwFilter] = useState("");
  const [tagFilter, setTagFilter] = useState("");
  const [rangeMs, setRangeMs] = useState(60 * 60_000);
  const [limit, setLimit] = useState(300);
  const { pickedTenantId } = useContext(TenantScopeCtx);

  useEffect(() => {
    let stop = false;
    const f = async () => {
      let q = applyTenantScope(
        supabase
          .from("historian_readings")
          .select("gateway_id, gateway_name, device_name, tag_name, value, quality, quality_label, ts_utc, tenant_id"),
        pickedTenantId,
      )
        .order("ts_utc", { ascending: false })
        .limit(Math.max(20, Math.min(5000, Number(limit) || 300)));
      if (rangeMs > 0) {
        const from = new Date(Date.now() - rangeMs).toISOString();
        q = q.gte("ts_utc", from);
      }
      if (gwFilter.trim())  q = q.ilike("gateway_id", `%${gwFilter.trim()}%`);
      if (tagFilter.trim()) q = q.ilike("tag_name", `%${tagFilter.trim()}%`);
      const { data, error: e } = await q;
      if (stop) return;
      if (e) setError(e.message);
      else {
        // Defense in depth — never display rows from another tenant.
        setRows((data || []).filter(scopedTo(pickedTenantId)));
        setError("");
      }
    };
    f();
    // Faster cadence than before (was 5 s) so the table feels live even
    // when the realtime channel is interrupted by Supabase free-tier
    // backpressure. Cheap query — server-side index seek on (tenant_id,
    // ts_utc DESC) with the row limit.
    const t = setInterval(f, 2000);
    // Live append: every historian_readings INSERT for the scoped tenant
    // is prepended into the table immediately. The 2 s poller above stays
    // as a safety net to catch up if the realtime socket drops a window.
    const gwNeedle = gwFilter.trim().toLowerCase();
    const tagNeedle = tagFilter.trim().toLowerCase();
    const liveHandler = (r) => {
      if (!r) return;
      const rowTenant = String(r.tenant_id || "");
      if (pickedTenantId && rowTenant && rowTenant !== pickedTenantId) return;
      if (gwNeedle) {
        const gid = String(r.gateway_id || "").toLowerCase();
        if (!gid.includes(gwNeedle)) return;
      }
      if (tagNeedle) {
        const tag = String(r.tag_name || "").toLowerCase();
        if (!tag.includes(tagNeedle)) return;
      }
      // Respect the active time window — only prepend rows newer than the
      // configured `from` bound so an "Last 1h" view doesn't suddenly start
      // showing rows from outside the range.
      if (rangeMs > 0) {
        const fromMs = Date.now() - rangeMs;
        const tsMs = Date.parse(String(r.ts_utc || ""));
        if (Number.isFinite(tsMs) && tsMs < fromMs) return;
      }
      setRows((prev) => {
        const cap = Math.max(20, Math.min(5000, Number(limit) || 300));
        const next = [r, ...(Array.isArray(prev) ? prev : [])];
        return next.length > cap ? next.slice(0, cap) : next;
      });
    };
    historianSubscribers.add(liveHandler);
    ensureHistorianChannel();
    return () => {
      stop = true;
      clearInterval(t);
      historianSubscribers.delete(liveHandler);
    };
  }, [gwFilter, tagFilter, rangeMs, limit, pickedTenantId]);

  return h("div", null,
    h("div", { className: "section" },
      h("h2", null, "Historian"),
      h("span", { className: "meta" }, rows ? `${rows.length} rows` : "")
    ),
    // One-row filter bar
    h("div", { className: "hist-filters" },
      h("input", {
        className: "hist-filter-input",
        type: "text",
        placeholder: "Gateway contains…",
        value: gwFilter,
        onChange: (e) => setGwFilter(e.target.value),
      }),
      h("input", {
        className: "hist-filter-input",
        type: "text",
        placeholder: "Tag contains…",
        value: tagFilter,
        onChange: (e) => setTagFilter(e.target.value),
      }),
      h("div", { className: "seg" },
        ...HISTORY_RANGES.map((opt) => h("button", {
          key: opt.label,
          className: `seg-btn ${rangeMs === opt.ms ? "active" : ""}`,
          onClick: () => setRangeMs(opt.ms),
        }, opt.label))
      ),
      h("select", {
        className: "hist-filter-input",
        value: String(limit),
        onChange: (e) => setLimit(Number(e.target.value)),
        title: "Max rows to fetch",
      },
        ...[100, 300, 500, 1000, 2000].map((n) => h("option", { key: n, value: String(n) }, `${n} rows`))
      ),
      (gwFilter || tagFilter) ? h("button", {
        className: "btn-ghost hist-filter-clear",
        onClick: () => { setGwFilter(""); setTagFilter(""); },
      }, "Clear") : null
    ),
    error ? h("div", { className: "banner" }, error) : null,
    rows == null
      ? h("div", { className: "empty" }, h("div", { className: "spinner" }), " loading…")
      : !rows.length
        ? h("div", { className: "empty" }, "no rows match the filters")
        : h("div", { className: "hist-table-wrap" },
            h("table", { className: "hist-table" },
              h("thead", null, h("tr", null,
                h("th", null, "Time"), h("th", null, "Gateway"),
                h("th", null, "Tag"), h("th", null, "Value"), h("th", null, "Q"))),
              h("tbody", null, ...rows.map((r, i) =>
                h("tr", { key: i },
                  h("td", { "data-label": "Time" }, fmtTs(r.ts_utc)),
                  h("td", { "data-label": "Gateway" }, r.gateway_name || r.gateway_id || "—"),
                  h("td", { "data-label": "Tag" }, r.tag_name || "—"),
                  h("td", { "data-label": "Value", className: "num" }, fmtVal(r.value)),
                  h("td", { "data-label": "Quality" }, r.quality_label || (r.quality != null ? String(r.quality) : ""))
                )))
            )
          )
  );
}

// Alarms view: shows the alarm RULES the operator configured on the edge
// (mirrored via triggers_limits.trigger_rules), each evaluated against
// the latest live_latest row for its (gateway, tag) pair. Realtime updates
// as live_latest changes — when a value crosses a threshold the row's
// TRIGGERED badge flips instantly.
function evalRule(rule, value) {
  if (rule == null || !Number.isFinite(value)) return false;
  // Match the edge's two-threshold shape: lower_enabled/lower_operator/lower_value
  // and upper_enabled/upper_operator/upper_value. If neither lower nor upper is
  // enabled the rule is informational (never triggers).
  const cmp = (op, v, t) => {
    switch (String(op || "").toLowerCase()) {
      case "<":   case "lt":   return v <  t;
      case "<=":  case "lte":  return v <= t;
      case ">":   case "gt":   return v >  t;
      case ">=":  case "gte":  return v >= t;
      case "==":  case "eq":   return v === t;
      case "!=":  case "ne":   return v !== t;
      default:                  return false;
    }
  };
  const lower = rule.lower_enabled ? cmp(rule.lower_operator || "<", value, Number(rule.lower_value)) : false;
  const upper = rule.upper_enabled ? cmp(rule.upper_operator || ">=", value, Number(rule.upper_value)) : false;
  return lower || upper;
}

function ruleConditionLabel(rule) {
  const parts = [];
  if (rule?.lower_enabled) parts.push(`${rule.lower_operator || "<"} ${rule.lower_value}`);
  if (rule?.upper_enabled) parts.push(`${rule.upper_operator || ">="} ${rule.upper_value}`);
  return parts.join("  OR  ") || "—";
}

// Reads the `alarms_setup.payload_json.alarms[]` events list from Supabase
// in realtime. The edge frontend appends to this list every time a trigger
// rule fires or clears — same payload schema, so Lite renders the exact
// same events.
//
// `activeOnly` filter is applied in derived state, not in the fetch, so the
// caller can compute a total count + a filtered list from a single sub.
function useAlarmEvents(enabled = true) {
  const [events, setEvents] = useState(null);
  const [error, setError] = useState("");
  const { pickedTenantId } = useContext(TenantScopeCtx);

  useEffect(() => {
    if (!enabled) return;
    let stop = false;
    const f = async () => {
      // Pull EVERY alarms_setup row the tenant scope allows (each scope_key
      // is one row — edge-wide, per-user, etc.). The previous `limit(1)
      // order by updated_utc` picked whichever row was touched most
      // recently, which on multi-user installs is often an EMPTY user-
      // scoped row, hiding the real edge-wide alarms list. RLS still
      // restricts the result to the caller's tenant; we just stop relying
      // on a fragile single-row pick.
      const { data, error: e } = await applyTenantScope(
        supabase
          .from("alarms_setup")
          .select("scope_key, payload_json, updated_utc, tenant_id"),
        pickedTenantId,
      )
        .order("updated_utc", { ascending: false })
        .limit(20);
      if (stop) return;
      if (e) { setError(e.message); return; }
      // Merge every row's `alarms` array, dedupe by event id, sort newest
      // first. Edge writes one alarms_setup row per `(tenant, edge_id)`
      // scope and one per user scope; alarms only live in the edge-scope
      // row but we union to be safe.
      const seen = new Set();
      const merged = [];
      // Defense in depth — drop any row whose tenant_id slipped past
      // applyTenantScope (RLS permissiveness for view-link viewers).
      const safeRows = (data || []).filter(scopedTo(pickedTenantId));
      for (const row of safeRows) {
        const list = Array.isArray(row?.payload_json?.alarms) ? row.payload_json.alarms : [];
        for (const a of list) {
          if (!a || typeof a !== "object") continue;
          const k = String(a.id || `${a.alert_key || ""}|${a.ts || ""}|${a.event_type || ""}`);
          if (seen.has(k)) continue;
          seen.add(k);
          merged.push(a);
        }
      }
      merged.sort((a, b) => String(b?.ts || "").localeCompare(String(a?.ts || "")));
      setEvents(merged);
      setError("");
    };
    f();
    const ch = supabase.channel("lite-alarms-events-rt")
      .on("postgres_changes",
        { event: "*", schema: "public", table: "alarms_setup" },
        () => f())
      .subscribe();
    return () => { stop = true; supabase.removeChannel(ch).catch(() => {}); };
  }, [enabled, pickedTenantId]);
  return { events, error };
}

// Shared window for "what counts as currently active on Lite". Used by both
// the header bell badge and the Alarms → Active tab.
const ACTIVE_ALARM_WINDOW_MS = 15 * 60_000;

// Returns the number of active, unacknowledged alarms — used by the header
// bell icon to show a red badge with the count. Matches ActiveAlarmsList's
// 15-minute recent-firing window so the bell and the tab agree.
function useActiveAlarmCount() {
  const { events } = useAlarmEvents(true);
  return useMemo(() => {
    if (!Array.isArray(events)) return 0;
    const cutoff = Date.now() - ACTIVE_ALARM_WINDOW_MS;
    const byKey = new Map();
    for (const a of events) {
      if (!a || typeof a !== "object") continue;
      if (a.event_type !== "active" || a.acknowledged) continue;
      const tsMs = Date.parse(String(a.ts || ""));
      if (!Number.isFinite(tsMs) || tsMs < cutoff) continue;
      const key = String(a.alert_key || a.id || `${a.gateway_id || ""}|${a.tag || ""}`);
      const prev = byKey.get(key);
      if (!prev || tsMs > Date.parse(String(prev.ts || ""))) byKey.set(key, a);
    }
    return byKey.size;
  }, [events]);
}

// Active alarms list: shows every UNACKNOWLEDGED `active` event that fired
// within the last 15 minutes, deduped to one row per alert_key (the most
// recent active firing wins). This matches what operators see on the edge
// alarms screen — a flat log of recent activations — instead of the
// "latest-event-per-key" model which silently went to zero whenever the
// alarm oscillated below the threshold between sync ticks.
//
// Read-only on Lite — acknowledging is an edge-side action because that's
// where the rule engine lives.
function ActiveAlarmsList() {
  const { events, error } = useAlarmEvents(true);

  // For each alert_key, keep the MOST RECENT `active` (unacknowledged) firing
  // within the last 15 minutes. Older actives age out automatically — once a
  // rule stops firing for 15 min it disappears from the Active view even if
  // the edge never explicitly cleared it.
  const recentActivesByKey = useMemo(() => {
    if (!Array.isArray(events)) return [];
    const cutoff = Date.now() - ACTIVE_ALARM_WINDOW_MS;
    const byKey = new Map();
    for (const a of events) {
      if (!a || typeof a !== "object") continue;
      if (a.event_type !== "active" || a.acknowledged) continue;
      const tsMs = Date.parse(String(a.ts || ""));
      if (!Number.isFinite(tsMs) || tsMs < cutoff) continue;
      const key = String(a.alert_key || a.id || `${a.gateway_id || ""}|${a.tag || ""}`);
      const prev = byKey.get(key);
      if (!prev || tsMs > Date.parse(String(prev.ts || ""))) {
        byKey.set(key, a);
      }
    }
    return [...byKey.values()].sort(
      (x, y) => String(y?.ts || "").localeCompare(String(x?.ts || ""))
    );
  }, [events]);

  // Build the History list as every event NOT already shown in the
  // Active section (or as a duplicate of an active event that has since
  // been cleared/acknowledged). Sorted newest first, capped at 200 to
  // keep DOM small on noisy edges.
  const activeIds = useMemo(
    () => new Set(recentActivesByKey.map((a) => a.id || `${a.alert_key}|${a.ts}`)),
    [recentActivesByKey]
  );
  const historyList = useMemo(() => {
    if (!Array.isArray(events)) return [];
    return events
      .filter((a) => {
        if (!a) return false;
        const id = a.id || `${a.alert_key}|${a.ts}`;
        return !activeIds.has(id);
      })
      .slice(0, 200);
  }, [events, activeIds]);

  const activeCount = recentActivesByKey.length;

  const sevClass = (s) => {
    const k = String(s || "").toLowerCase();
    if (k === "critical") return "status-offline";
    if (k === "warning")  return "status-warning";
    return "status-muted";
  };

  const renderEvent = (a) => h("div", {
    key: a.id || `${a.tag}-${a.ts}`,
    className: `alarm-event ${a.event_type === "active" && !a.acknowledged ? "is-active" : "is-cleared"}`,
  },
    h("div", { className: "alarm-event-head" },
      h("span", { className: `status-pill ${sevClass(a.severity)}` },
        h("span", { className: "pill-dot" }),
        h("span", null, (a.severity || "info").toUpperCase())
      ),
      h("span", { className: "alarm-event-ts" }, fmtTs(a.ts)),
      a.acknowledged ? h("span", { className: "status-pill status-online" },
        h("span", { className: "pill-dot" }),
        h("span", null, "ACK")
      ) : null
    ),
    h("div", { className: "alarm-event-msg" }, a.message || `${a.tag} = ${fmtVal(a.value)}`),
    h("div", { className: "alarm-event-meta" },
      a.tag ? h("span", null, h("strong", null, "Tag: "), a.tag) : null,
      (a.gateway_name || a.gateway_id) ? h("span", null,
        h("strong", null, "Gateway: "), a.gateway_name || a.gateway_id) : null,
      a.value != null ? h("span", null, h("strong", null, "Value: "), fmtVal(a.value)) : null,
      h("span", null, h("strong", null, "State: "),
        a.event_type === "clear" ? "cleared" : (a.acknowledged ? "acknowledged" : "active"))
    )
  );

  return h("div", null,
    h("div", { className: "section-sub" },
      h("span", { className: "meta" },
        events == null ? "" :
        `${activeCount} active in the last 15 min · ${events.length} total events`)
    ),
    error ? h("div", { className: "banner" }, error) : null,
    events == null
      ? h("div", { className: "empty" }, h("div", { className: "spinner" }), " loading…")
      : h("div", null,
          // Active section — always rendered (placeholder if empty) so the
          // operator can tell the difference between "everything fine" and
          // "alarms tab broken / never loaded".
          h("div", { className: "section-sub", style: { marginTop: 18 } },
            h("h3", { style: { margin: "0 8px 0 0", fontSize: 14 } }, "Active"),
            h("span", { className: "meta" },
              `${recentActivesByKey.length} firing in last 15 min`)
          ),
          recentActivesByKey.length
            ? h("div", { className: "alarm-events" }, ...recentActivesByKey.map(renderEvent))
            : h("div", { className: "card", style: { textAlign: "center", padding: "20px 16px" } },
                h("div", { className: "muted", style: { fontSize: 12 } },
                  "No alarms currently firing — everything within limits.")
              ),
          // History section — every past event, including cleared and
          // acknowledged. Capped at 200 rows to keep the DOM small.
          h("div", { className: "section-sub", style: { marginTop: 24 } },
            h("h3", { style: { margin: "0 8px 0 0", fontSize: 14 } }, "History"),
            h("span", { className: "meta" },
              historyList.length >= 200
                ? "Showing latest 200 events"
                : `${historyList.length} event${historyList.length === 1 ? "" : "s"}`)
          ),
          historyList.length
            ? h("div", { className: "alarm-events" }, ...historyList.map(renderEvent))
            : h("div", { className: "card", style: { textAlign: "center", padding: "20px 16px" } },
                h("div", { className: "muted", style: { fontSize: 12 } },
                  "No past events to show yet.")
              )
        )
  );
}

function AlarmRulesView({ liveRows }) {
  const [rules, setRules] = useState(null);
  const [error, setError] = useState("");
  const [stateFilter, setStateFilter] = useState("all");  // all | triggered | ok
  const [search, setSearch] = useState("");
  const { pickedTenantId } = useContext(TenantScopeCtx);

  useEffect(() => {
    let stop = false;
    const f = async () => {
      // Same shape as useAlarmEvents: union across every scoped row
      // so we don't miss rules just because the most-recently-touched
      // row was an empty user-scope one.
      const { data, error: e } = await applyTenantScope(
        supabase
          .from("triggers_limits")
          .select("scope_key, payload_json, version, updated_utc, tenant_id"),
        pickedTenantId,
      )
        .order("updated_utc", { ascending: false })
        .limit(20);
      if (stop) return;
      if (e) { setError(e.message); return; }
      const seen = new Set();
      const merged = [];
      const safeRows = (data || []).filter(scopedTo(pickedTenantId));
      for (const row of safeRows) {
        const list = Array.isArray(row?.payload_json?.trigger_rules) ? row.payload_json.trigger_rules : [];
        for (const r of list) {
          if (!r || typeof r !== "object") continue;
          const k = String(r.id || `${r.gateway_id || ""}|${r.tag_name || ""}|${r.condition || ""}`);
          if (seen.has(k)) continue;
          seen.add(k);
          merged.push(r);
        }
      }
      setRules(merged);
      setError("");
    };
    f();
    const ch = supabase.channel("lite-alarms-rules-rt")
      .on("postgres_changes",
        { event: "*", schema: "public", table: "triggers_limits" },
        () => f())
      .subscribe();
    return () => { stop = true; supabase.removeChannel(ch).catch(() => {}); };
  }, [pickedTenantId]);

  const liveByKey = useMemo(() => {
    const m = new Map();
    for (const r of (liveRows || [])) m.set(`${r.gateway_id}|${r.tag_name}`, r);
    return m;
  }, [liveRows]);

  const evaluated = useMemo(() => {
    if (!Array.isArray(rules)) return [];
    return rules.map((r, idx) => {
      const gw  = String(r?.gateway_id || "");
      const tag = String(r?.tag_name || "");
      const row = liveByKey.get(`${gw}|${tag}`);
      const v = row ? Number(row.value) : NaN;
      const triggered = Number.isFinite(v) ? evalRule(r, v) : false;
      return {
        id: r?.id || `rule-${idx}`,
        name: r?.name || tag || `Rule ${idx + 1}`,
        gateway_id: gw,
        tag_name: tag,
        condition: ruleConditionLabel(r),
        enabled: r?.enabled !== false,
        value: row ? row.value : null,
        ts: row ? row.ts_utc : null,
        triggered,
      };
    });
  }, [rules, liveByKey]);

  const filtered = useMemo(() => {
    let list = evaluated;
    if (stateFilter === "triggered") list = list.filter((r) => r.triggered);
    else if (stateFilter === "ok")    list = list.filter((r) => !r.triggered && r.enabled);
    if (search.trim()) {
      const q = search.trim().toLowerCase();
      list = list.filter((r) =>
        (r.name || "").toLowerCase().includes(q) ||
        (r.tag_name || "").toLowerCase().includes(q) ||
        (r.gateway_id || "").toLowerCase().includes(q));
    }
    return list;
  }, [evaluated, stateFilter, search]);

  const triggeredCount = evaluated.filter((r) => r.triggered).length;

  return h("div", null,
    h("div", { className: "section-sub" },
      h("span", { className: "meta" },
        rules == null ? "" :
        `${evaluated.length} rule${evaluated.length === 1 ? "" : "s"} · ${triggeredCount} triggered`)
    ),
    h("div", { className: "hist-filters" },
      h("div", { className: "seg" },
        ...[["all", "All"], ["triggered", "Triggered"], ["ok", "OK"]].map(([k, label]) =>
          h("button", {
            key: k,
            className: `seg-btn ${stateFilter === k ? "active" : ""}`,
            onClick: () => setStateFilter(k),
          }, label))
      ),
      h("input", {
        className: "hist-filter-input",
        type: "text",
        placeholder: "Filter by name / tag / gateway",
        value: search,
        onChange: (e) => setSearch(e.target.value),
      }),
      search ? h("button", { className: "btn-ghost hist-filter-clear",
                              onClick: () => setSearch("") }, "Clear") : null
    ),
    error ? h("div", { className: "banner" }, error) : null,
    rules == null
      ? h("div", { className: "empty" }, h("div", { className: "spinner" }), " loading…")
      : !filtered.length
        ? h("div", { className: "empty" },
            evaluated.length === 0
              ? "No alarm rules have been configured on the edge yet."
              : "No rules match the filter.")
        : h("div", { className: "alarm-rules" },
            ...filtered.map((r) => h("div", {
              key: r.id,
              className: `alarm-rule-card ${r.triggered ? "is-triggered" : (r.enabled ? "is-ok" : "is-disabled")}`,
            },
              h("div", { className: "alarm-rule-head" },
                h("div", { className: "alarm-rule-name" }, r.name),
                h("span", {
                  className: `status-pill ${r.triggered ? "status-offline" : (r.enabled ? "status-online" : "status-muted")}`,
                },
                  h("span", { className: "pill-dot" }),
                  h("span", null, r.triggered ? "TRIGGERED" : (r.enabled ? "OK" : "DISABLED"))
                )
              ),
              h("div", { className: "alarm-rule-meta" },
                h("span", null, h("strong", null, "Tag: "), r.tag_name || "—"),
                h("span", null, h("strong", null, "Gateway: "), r.gateway_id || "—"),
                h("span", null, h("strong", null, "Condition: "), r.condition),
                h("span", null, h("strong", null, "Current: "), fmtVal(r.value),
                  r.ts ? ` · ${fmtAge(r.ts)} ago` : "")
              )
            ))
          )
  );
}

// LEGACY app_logs alarm feed — kept until reports/alarm wiring is done.
function _LegacyAppLogsAlarmsView() {
  const [rows, setRows] = useState(null);
  const [error, setError] = useState("");
  const [levelFilter, setLevelFilter] = useState("");     // "", "info", "warning", "error", ...
  const [categoryFilter, setCategoryFilter] = useState("");
  const [gwFilter, setGwFilter] = useState("");
  const [textFilter, setTextFilter] = useState("");
  const [limit, setLimit] = useState(200);
  // Distinct values seen so we can populate the dropdowns.
  const [knownLevels, setKnownLevels] = useState([]);
  const [knownCategories, setKnownCategories] = useState([]);

  useEffect(() => {
    let stop = false;
    const f = async () => {
      let q = supabase
        .from("app_logs")
        .select("ts_utc, level, category, message, gateway_id, gateway_name")
        .order("ts_utc", { ascending: false })
        .limit(Math.max(20, Math.min(2000, Number(limit) || 200)));
      if (levelFilter) q = q.eq("level", levelFilter);
      if (categoryFilter) q = q.eq("category", categoryFilter);
      if (gwFilter.trim()) q = q.ilike("gateway_id", `%${gwFilter.trim()}%`);
      if (textFilter.trim()) q = q.ilike("message", `%${textFilter.trim()}%`);
      const { data, error: e } = await q;
      if (stop) return;
      if (e) setError(e.message);
      else {
        setRows((data || []).filter(scopedTo(pickedTenantId)));
        setError("");
        // Refresh dropdown options from what we've seen.
        const lv = new Set(knownLevels);
        const cat = new Set(knownCategories);
        for (const r of data || []) {
          if (r.level) lv.add(r.level);
          if (r.category) cat.add(r.category);
        }
        setKnownLevels([...lv].sort());
        setKnownCategories([...cat].sort());
      }
    };
    f();
    // Realtime: only append if the new row passes the current filters.
    const ch = supabase.channel("lite-alarms-rt")
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "app_logs" },
        (payload) => {
          const r = payload.new || payload.record || null;
          if (!r) return;
          if (pickedTenantId && r.tenant_id !== pickedTenantId) return;
          if (levelFilter && r.level !== levelFilter) return;
          if (categoryFilter && r.category !== categoryFilter) return;
          if (gwFilter.trim() && !String(r.gateway_id || "").toLowerCase().includes(gwFilter.trim().toLowerCase())) return;
          if (textFilter.trim() && !String(r.message || "").toLowerCase().includes(textFilter.trim().toLowerCase())) return;
          setRows((prev) => [r, ...(prev || [])].slice(0, Math.max(20, Math.min(2000, Number(limit) || 200))));
        }).subscribe();
    return () => { stop = true; supabase.removeChannel(ch).catch(() => {}); };
  }, [levelFilter, categoryFilter, gwFilter, textFilter, limit]);

  return h("div", null,
    h("div", { className: "section" },
      h("h2", null, "Recent events"),
      h("span", { className: "meta" }, rows ? `${rows.length} entries` : "")
    ),
    h("div", { className: "hist-filters" },
      h("select", {
        className: "hist-filter-input",
        value: levelFilter,
        onChange: (e) => setLevelFilter(e.target.value),
      },
        h("option", { value: "" }, "All levels"),
        ...knownLevels.map((l) => h("option", { key: l, value: l }, l))
      ),
      h("select", {
        className: "hist-filter-input",
        value: categoryFilter,
        onChange: (e) => setCategoryFilter(e.target.value),
      },
        h("option", { value: "" }, "All categories"),
        ...knownCategories.map((c) => h("option", { key: c, value: c }, c))
      ),
      h("input", {
        className: "hist-filter-input",
        type: "text",
        placeholder: "Gateway contains…",
        value: gwFilter,
        onChange: (e) => setGwFilter(e.target.value),
      }),
      h("input", {
        className: "hist-filter-input",
        type: "text",
        placeholder: "Message contains…",
        value: textFilter,
        onChange: (e) => setTextFilter(e.target.value),
      }),
      h("select", {
        className: "hist-filter-input",
        value: String(limit),
        onChange: (e) => setLimit(Number(e.target.value)),
      },
        ...[100, 200, 500, 1000].map((n) => h("option", { key: n, value: String(n) }, `${n} rows`))
      ),
      (levelFilter || categoryFilter || gwFilter || textFilter) ? h("button", {
        className: "btn-ghost hist-filter-clear",
        onClick: () => { setLevelFilter(""); setCategoryFilter(""); setGwFilter(""); setTextFilter(""); },
      }, "Clear") : null
    ),
    error ? h("div", { className: "banner" }, error) : null,
    rows == null
      ? h("div", { className: "empty" }, h("div", { className: "spinner" }), " loading…")
      : !rows.length
        ? h("div", { className: "empty" }, "No events match the filters.")
        : h("div", null, ...rows.map((r, i) => {
            const lvl = String(r.level || "").toLowerCase();
            const cls = lvl.includes("err") || lvl.includes("crit") ? "error" :
                        lvl.includes("warn") || lvl.includes("alarm") ? "warn" : "";
            return h("div", { key: i, className: `alarm-row ${cls}` },
              h("div", { className: "lvl" }),
              h("div", { className: "body" },
                h("div", { className: "msg" }, r.message || r.category || "—"),
                h("div", { className: "meta" },
                  fmtTs(r.ts_utc), " · ", r.level || "—",
                  r.category ? ` · ${r.category}` : "",
                  r.gateway_id ? ` · ${r.gateway_name || r.gateway_id}` : "")
              )
            );
          }))
  );
}

// Tags the edge's power_manager emits per device. Kept in module scope so
// PowerView and the synthetic chart widgets share one list.
const POWER_METER_TAGS = ["voltage_v","current_a","active_power_w","energy_wh","power_factor","frequency_hz"];

// Build a synthetic chart-widget shape so we can reuse the existing
// ChartWidget pipeline (useChartSeries + Recharts) without re-implementing
// historian fetching. Each entry mirrors a dashboard `line_chart` widget.
function buildPowerWidget(gw, tag, label, color) {
  return {
    id: `power-${gw}-${tag}`,
    type: "line_chart",
    config: {
      title: label,
      gateway_id: gw,
      tag_name: tag,
      color: color,
      // No compute_rules / no series_extra — single tag.
    },
  };
}

function PowerView({ liveRows }) {
  const prefs = useDashPrefs();
  const cardHeight = prefs.cardHeight || 220;

  const byGw = new Map();
  for (const r of liveRows) {
    if (!POWER_METER_TAGS.includes(r.tag_name)) continue;
    const gid = r.gateway_id || "—";
    if (!byGw.has(gid)) byGw.set(gid, { gateway_id: gid, gateway_name: r.gateway_name || gid, ts_utc: r.ts_utc, tags: {} });
    const e = byGw.get(gid);
    e.tags[r.tag_name] = r.value;
    if (!e.ts_utc || (r.ts_utc && r.ts_utc > e.ts_utc)) e.ts_utc = r.ts_utc;
  }
  const list = [...byGw.values()];
  if (!list.length) return h("div", { className: "empty" }, "No power meters reporting.");

  const fields = [
    ["voltage_v", "V", "Voltage"], ["current_a", "A", "Current"],
    ["active_power_w", "W", "Active power"], ["power_factor", "", "PF"],
    ["frequency_hz", "Hz", "Frequency"], ["energy_wh", "Wh", "Energy"],
  ];

  return h("div", null,
    h("div", { className: "section" }, h("h2", null, "Power overview"),
      h("span", { className: "meta" }, `${list.length} device${list.length === 1 ? "" : "s"}`)),
    ...list.map((d) => h("div", { key: d.gateway_id, className: "power-card" },
      h("h3", null, d.gateway_name || d.gateway_id),
      h("div", { className: "power-grid" }, ...fields.map(([k, unit, label]) => {
        const v = d.tags[k];
        if (v === undefined || v === null) return null;
        return h("div", { key: k, className: "power-stat" },
          h("div", { className: "label" }, label),
          h("div", { className: "value" }, `${fmtVal(v)}${unit ? " " + unit : ""}`)
        );
      })),
      // Live active-power line chart — same widget rendering as the dashboard.
      d.tags.active_power_w !== undefined ? h("div", {
        className: "power-chart-wrap widget widget-line_chart",
        style: { height: `${cardHeight}px` },
      },
        h(ChartWidget, { widget: buildPowerWidget(d.gateway_id, "active_power_w", "Active power (W)", "#14a89a") })
      ) : null
    ))
  );
}

// --- Generated reports list (preview + download via signed URL) ----------- //
function GeneratedReportsView() {
  const [rows, setRows] = useState(null);
  const [error, setError] = useState("");
  const [busyId, setBusyId] = useState("");      // id of report currently fetching a signed URL
  const [previewUrl, setPreviewUrl] = useState("");
  const { pickedTenantId } = useContext(TenantScopeCtx);

  const refresh = async () => {
    const { data, error: e } = await applyTenantScope(
      supabase
        .from("generated_reports")
        .select("id, tenant_id, template_id, template_name, schedule_id, schedule_name, triggered_by, file_name, file_bytes, storage_path, created_utc"),
      pickedTenantId,
    )
      .order("created_utc", { ascending: false })
      .limit(200);
    if (e) { setError(e.message); return; }
    setRows((data || []).filter(scopedTo(pickedTenantId)));
    setError("");
  };

  useEffect(() => {
    let stop = false;
    const f = async () => { if (!stop) await refresh(); };
    f();
    const ch = supabase.channel("lite-generated-reports-rt")
      .on("postgres_changes", { event: "*", schema: "public", table: "generated_reports" },
        () => f())
      .subscribe();
    return () => { stop = true; supabase.removeChannel(ch).catch(() => {}); };
  }, [pickedTenantId]);

  const signedUrl = async (storagePath) => {
    if (!storagePath) return null;
    const { data, error: e } = await supabase
      .storage.from(LITE_REPORTS_BUCKET)
      .createSignedUrl(storagePath, 300);  // 5-minute link
    if (e) { setError(e.message); return null; }
    return data?.signedUrl || null;
  };

  const onPreview = async (r) => {
    if (!r.storage_path) {
      setError("This report has not finished uploading to cloud Storage yet — try again in a moment.");
      return;
    }
    setBusyId(r.id);
    const url = await signedUrl(r.storage_path);
    setBusyId("");
    if (url) setPreviewUrl(url);
  };

  const onDownload = async (r) => {
    if (!r.storage_path) {
      setError("This report has not finished uploading to cloud Storage yet.");
      return;
    }
    setBusyId(r.id);
    const url = await signedUrl(r.storage_path);
    setBusyId("");
    if (url) {
      const a = document.createElement("a");
      a.href = url;
      a.download = r.file_name || `${r.id}.pdf`;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }
  };

  return h("div", null,
    error ? h("div", { className: "banner" }, error) : null,
    rows == null
      ? h("div", { className: "empty" }, h("div", { className: "spinner" }), " loading…")
      : !rows.length
        ? h("div", { className: "card", style: { textAlign: "center", padding: "32px 20px" } },
            h("div", { style: { fontSize: 14, fontWeight: 600, marginBottom: 8 } },
              "No reports have been generated yet."),
            h("div", { className: "muted", style: { fontSize: 12 } },
              "Generate one from the Templates tab, or run a scheduled report on the edge."))
        : h("div", { className: "report-list" },
            ...rows.map((r) => h("div", { key: `${r.tenant_id}|${r.id}`, className: "report-card" },
              h("div", { className: "report-card-head" },
                h("div", { className: "report-card-title" }, r.template_name || r.file_name || r.id),
                h("span", { className: `status-pill ${r.storage_path ? "status-online" : "status-muted"}` },
                  h("span", { className: "pill-dot" }),
                  h("span", null, r.storage_path ? "READY" : "UPLOADING")
                )
              ),
              h("div", { className: "report-card-summary" },
                `${r.triggered_by || "manual"} · ${fmtBytes(r.file_bytes)} · ${fmtTs(r.created_utc)}`),
              r.schedule_name ? h("div", { className: "report-card-desc" },
                `Schedule: ${r.schedule_name}`) : null,
              h("div", { className: "report-card-actions" },
                h("button", {
                  className: "btn btn-primary",
                  disabled: !r.storage_path || busyId === r.id,
                  onClick: () => onPreview(r),
                }, busyId === r.id ? "…" : "Preview"),
                h("button", {
                  className: "btn-ghost",
                  disabled: !r.storage_path || busyId === r.id,
                  onClick: () => onDownload(r),
                }, "Download")
              )
            ))
          ),
    previewUrl ? h(PdfPreviewModal, { url: previewUrl, onClose: () => setPreviewUrl("") }) : null
  );
}

function PdfPreviewModal({ url, onClose }) {
  // Extra `pdf-preview-back` class on the backdrop so CSS can drop the
  // centring padding on mobile WITHOUT relying on :has() (Android
  // WebView <12 and old Samsung Internet don't support it).
  return h("div", { className: "monitor-back pdf-preview-back", onClick: onClose },
    h("div", { className: "monitor pdf-preview", onClick: (e) => e.stopPropagation() },
      h("div", { className: "monitor-head" },
        h("h3", null, "Report preview"),
        h("button", {
          className: "close",
          onClick: onClose,
          "aria-label": "Close preview",
        }, "Close")
      ),
      h("iframe", { className: "pdf-frame", src: url, title: "PDF preview" })
    )
  );
}

// --- Templates list (read + Generate via queue) --------------------------- //
function ReportTemplatesView() {
  const [rows, setRows] = useState(null);
  const [error, setError] = useState("");
  const [selected, setSelected] = useState(null);
  const [queueing, setQueueing] = useState("");
  const [submittedFor, setSubmittedFor] = useState("");
  const { pickedTenantId } = useContext(TenantScopeCtx);

  useEffect(() => {
    let stop = false;
    const f = async () => {
      const { data, error: e } = await applyTenantScope(
        supabase
          .from("report_templates")
          .select("id, tenant_id, name, description, definition_json, created_utc, updated_utc, created_by"),
        pickedTenantId,
      )
        .order("updated_utc", { ascending: false })
        .limit(100);
      if (stop) return;
      if (e) setError(e.message);
      else { setRows((data || []).filter(scopedTo(pickedTenantId))); setError(""); }
    };
    f();
    const ch = supabase.channel("lite-report-templates-rt")
      .on("postgres_changes", { event: "*", schema: "public", table: "report_templates" },
        () => f())
      .subscribe();
    return () => { stop = true; supabase.removeChannel(ch).catch(() => {}); };
  }, [pickedTenantId]);

  const summarize = (t) => {
    const def = t.definition_json || {};
    const sections = Array.isArray(def.sections) ? def.sections.length : 0;
    const filters = def.filters || {};
    return `${sections} section${sections === 1 ? "" : "s"}${filters.tag_name ? ` · ${filters.tag_name}` : ""}`;
  };

  const onGenerate = async (t) => {
    setQueueing(t.id);
    setError("");
    try {
      const { data: userRes } = await supabase.auth.getUser();
      const user = userRes?.user;
      const payload = {
        tenant_id: t.tenant_id || "default",
        template_id: t.id,
        template_name: t.name || t.id,
        requested_by: user?.id || null,
        requester_email: user?.email || null,
      };
      const { error: e } = await supabase.from("lite_report_requests").insert(payload);
      if (e) { setError(`Could not queue the request: ${e.message}`); return; }
      setSubmittedFor(t.id);
      setTimeout(() => setSubmittedFor((cur) => (cur === t.id ? "" : cur)), 4000);
    } finally {
      setQueueing("");
    }
  };

  return h("div", null,
    h("div", { className: "section-sub" },
      h("span", { className: "meta" }, rows ? `${rows.length} template${rows.length === 1 ? "" : "s"}` : "")
    ),
    error ? h("div", { className: "banner" }, error) : null,
    rows == null
      ? h("div", { className: "empty" }, h("div", { className: "spinner" }), " loading…")
      : !rows.length
        ? h("div", { className: "card", style: { textAlign: "center", padding: "32px 20px" } },
            h("div", { style: { fontSize: 14, fontWeight: 600, marginBottom: 8 } },
              "No report templates yet."),
            h("div", { className: "muted", style: { fontSize: 12 } },
              "Create a template in the TrustNode desktop app and it will appear here."))
        : h("div", { className: "report-list" },
            ...rows.map((t) => h("div", { key: `${t.tenant_id}|${t.id}`, className: "report-card" },
              h("div", { className: "report-card-head" },
                h("div", { className: "report-card-title" }, t.name || t.id),
                h("button", {
                  className: "btn-ghost",
                  onClick: () => setSelected(selected?.id === t.id ? null : t),
                }, selected?.id === t.id ? "Hide details" : "View details")
              ),
              h("div", { className: "report-card-summary" }, summarize(t)),
              t.description ? h("div", { className: "report-card-desc" }, t.description) : null,
              h("div", { className: "report-card-meta" },
                `Updated ${fmtTs(t.updated_utc)}${t.created_by ? ` · by ${t.created_by}` : ""}`),
              selected?.id === t.id ? h("pre", { className: "report-card-json" },
                JSON.stringify(t.definition_json, null, 2)) : null,
              h("div", { className: "report-card-actions" },
                h("button", {
                  className: "btn btn-primary",
                  disabled: queueing === t.id,
                  onClick: () => onGenerate(t),
                }, queueing === t.id ? "Queuing…" :
                   submittedFor === t.id ? "Queued ✓" : "Generate")
              )
            ))
          )
  );
}

// Tiny byte formatter for report sizes.
function fmtBytes(n) {
  const v = Number(n);
  if (!Number.isFinite(v) || v <= 0) return "—";
  if (v < 1024) return `${v} B`;
  if (v < 1024 * 1024) return `${(v / 1024).toFixed(1)} KB`;
  return `${(v / (1024 * 1024)).toFixed(1)} MB`;
}

function LoginCard({ theme, onToggleTheme, onSignedIn }) {
  const [user, setUser] = useState("");
  const [pw, setPw] = useState("");
  const [show, setShow] = useState(false);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const submit = async () => {
    if (busy) return;
    setBusy(true); setErr("");
    try {
      if (!user.trim() || !pw) throw new Error("Enter username and password");
      const { data, error } = await supabase.auth.signInWithPassword({ email: user.trim(), password: pw });
      if (error) throw error;
      onSignedIn(data.session);
    } catch (e) {
      setErr(e.message || String(e));
      setBusy(false);
    }
  };
  const sendMagic = async () => {
    if (!user.trim()) { setErr("Type your email above first"); return; }
    try {
      const { error } = await supabase.auth.signInWithOtp({
        email: user.trim(),
        options: { emailRedirectTo: window.location.href },
      });
      if (error) throw error;
      setErr("Check your inbox for the sign-in link.");
    } catch (e) { setErr(e.message || String(e)); }
  };
  return h("div", { className: `login-container theme-${theme}` },
    h("div", { className: "auth-card" },
      h("button", {
        className: "icon-btn theme-toggle-btn",
        type: "button",
        title: `Switch to ${theme === "dark" ? "light" : "dark"} mode`,
        onClick: onToggleTheme,
      }, theme === "dark" ? icSun() : icMoon()),
      h("div", { className: "auth-brand" },
        h("img", { src: "/lite/trustnode_login_logo.png", alt: "TrustNode", className: "auth-logo",
                    onError: (e) => { e.target.style.display = "none"; } })
      ),
      h("div", { className: "auth-subtitle" }, "Sign in to view your edge data"),
      h("label", null,
        h("span", null, "Username or email"),
        h("div", { className: "input-wrapper" },
          h("span", { className: "field-icon" }, icUser()),
          h("input", {
            type: "email", autoComplete: "username", placeholder: "e.g. m.silva@plant.io",
            value: user, onChange: (e) => setUser(e.target.value),
            onKeyDown: (e) => { if (e.key === "Enter") document.getElementById("lite-pass")?.focus(); }
          })
        )
      ),
      h("label", null,
        h("div", { className: "pw-field-header" },
          h("span", null, "Password"),
          h("button", { type: "button", className: "forgot-link", onClick: sendMagic }, "Forgot password?")
        ),
        h("div", { className: "pw-input-wrap" },
          h("span", { className: "field-icon" }, icLock()),
          h("input", {
            id: "lite-pass",
            type: show ? "text" : "password", autoComplete: "current-password",
            placeholder: "Enter your password",
            value: pw, onChange: (e) => setPw(e.target.value),
            onKeyDown: (e) => { if (e.key === "Enter") submit(); }
          }),
          h("button", { className: "pw-icon-btn", type: "button", onClick: () => setShow((s) => !s) },
            show ? icEyeOpen() : icEyeClosed())
        )
      ),
      h("div", { className: "auth-error" }, err),
      h("button", {
        className: "btn btn-primary auth-submit",
        onClick: submit, disabled: busy,
      }, busy ? "Signing in…" : "Sign in to TrustNode Lite"),
      h("button", { className: "btn-ghost-link", type: "button", onClick: sendMagic },
        "Email me a magic link instead")
    )
  );
}
