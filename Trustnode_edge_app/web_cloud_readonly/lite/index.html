function App({ viewLink = null }) {
  // viewLink = { tenant_id, customer_id, edge_id } when this load came
  // from a /lite/view/<token> URL. In that mode there is no Supabase
  // Auth session — the App runs anonymous, scoped to the resolved
  // tenant, with all mutating actions (Acknowledge, Generate, etc.)
  // hidden by the components that consume `readOnlyMode` from context.
  const isViewLinkMode = !!viewLink;
  const [session, setSession] = useState(null);
  const [theme, setTheme] = useState(readTheme());
  const [tab, setTab] = useState("dashboard");
  // Tag Monitor modal payload. Two shapes:
  //   { widget }                                   → opened from a chart-widget "expand" button
  //   { gateway_id, gateway_name, tag_name, value, ts }  → opened from a tile/KPI tap
  const [monitor, setMonitor] = useState(null);
  const [tenantLabel, setTenantLabel] = useState(cfg?.customer_label || "");
  const [prefs, setPrefs] = useState(loadDashPrefs());
  // Master-admin cross-tenant picker. `pickedTenantId` is what every
  // scoped query filters by; empty string means "follow the user's
  // default tenant" (RLS does the filtering). `availableTenants` is the
  // list shown in the picker dropdown — built from cp_customers so the
  // master sees human-readable company names, not raw slugs.
  const [pickedTenantId, setPickedTenantId] = useState(() => {
    // In view-link mode the tenant is pinned by the resolved scope —
    // there's no master picker and no localStorage seed.
    if (viewLink?.tenant_id) return viewLink.tenant_id;
    try { return localStorage.getItem("tnlite-picked-tenant") || ""; }
    catch (_) { return ""; }
  });
  const [availableTenants, setAvailableTenants] = useState([]);
  const isGlobalAdmin = isJwtGlobalAdmin(session);
  const userTenantId = jwtTenantId(session);
  // Side-menu collapse state. Persisted to localStorage so the user's
  // preference survives reloads. Defaults to visible on desktop and
  // hidden on phones (the bottom-tab bar replaces it there anyway).
  const [sidebarVisible, setSidebarVisible] = useState(() => {
    // Share-link viewers default to no sidebar — the link is meant for
    // distraction-free "see one edge, period" demos to customers /
    // partners. They can still toggle it back via the header chevron.
    if (viewLink) return false;
    try {
      const raw = localStorage.getItem("tnlite-sidebar-visible");
      if (raw === "true" || raw === "false") return raw === "true";
    } catch (_) {}
    return true;
  });

  useEffect(() => { applyTheme(theme); }, [theme]);
  useEffect(() => { saveDashPrefs(prefs); }, [prefs]);
  useEffect(() => {
    try { localStorage.setItem("tnlite-sidebar-visible", String(!!sidebarVisible)); } catch (_) {}
  }, [sidebarVisible]);

  useEffect(() => {
    // Share-link mode skips Supabase Auth entirely; anonymous viewers
    // can't (and shouldn't) authenticate. Cloud reads still work because
    // the existing public storage / table policies cover the data set
    // the viewer is allowed to see; queries are scoped by pickedTenantId.
    if (isViewLinkMode) return;
    supabase.auth.getSession().then(({ data }) => setSession(data.session || null));
    const { data: sub } = supabase.auth.onAuthStateChange((_e, s) => setSession(s || null));
    return () => sub.subscription.unsubscribe();
  }, [isViewLinkMode]);

  // Tenant label from lite_profiles once signed in. Non-admin users see
  // their own assignment. Master-admin sees whichever tenant they've
  // picked (or 'All tenants' as a fallback). In view-link mode we
  // resolve the company name from cp_customers directly using the
  // tenant pinned by the share token.
  useEffect(() => {
    if (isViewLinkMode) {
      const tid = viewLink?.tenant_id || "";
      if (!tid) { setTenantLabel("Read-only view"); return; }
      supabase.from("cp_customers")
        .select("company_name, tenant_id")
        .eq("tenant_id", tid)
        .limit(1).maybeSingle()
        .then(({ data }) => {
          setTenantLabel((data?.company_name || tid) + " · read-only");
        }).catch(() => setTenantLabel(tid + " · read-only"));
      return;
    }
    if (!session) return;
    if (isGlobalAdmin) {
      // For master, label follows the picker. We resolve the picked
      // tenant's company_name from cp_customers when possible.
      if (!pickedTenantId) { setTenantLabel("All tenants"); return; }
      supabase.from("cp_customers")
        .select("company_name, tenant_id")
        .eq("tenant_id", pickedTenantId)
        .limit(1).maybeSingle()
        .then(({ data }) => {
          setTenantLabel(data?.company_name || pickedTenantId);
        }).catch(() => setTenantLabel(pickedTenantId));
      return;
    }
    supabase.from("lite_profiles").select("tenant_id, customer_id").limit(1).maybeSingle()
      .then(({ data }) => {
        if (data) setTenantLabel(data.customer_id || data.tenant_id || cfg?.customer_label || "");
      }).catch(() => {});
  }, [session, isGlobalAdmin, pickedTenantId]);

  // Load the list of tenants the master can switch to. Reads cp_customers
  // (one row per customer) and lite_profiles (covers tenants with no
  // customer yet) and merges. No-op for non-admin users.
  useEffect(() => {
    if (!session || !isGlobalAdmin) { setAvailableTenants([]); return; }
    let stopped = false;
    (async () => {
      const seen = new Map();   // tenant_id -> { tenant_id, label }
      const { data: custs } = await supabase.from("cp_customers")
        .select("tenant_id, company_name").limit(500);
      for (const r of (custs || [])) {
        const tid = String(r.tenant_id || "");
        if (!tid) continue;
        const label = String(r.company_name || tid);
        // First seen wins; cp_customers usually has the prettiest label.
        if (!seen.has(tid)) seen.set(tid, { tenant_id: tid, label });
      }
      // Fallback: any tenant with at least one lite_profile that isn't in
      // cp_customers yet (admin-only tenants, e.g.).
      const { data: profs } = await supabase.from("lite_profiles")
        .select("tenant_id").limit(2000);
      for (const r of (profs || [])) {
        const tid = String(r.tenant_id || "");
        if (!tid || seen.has(tid)) continue;
        seen.set(tid, { tenant_id: tid, label: tid });
      }
      if (!stopped) {
        const list = [...seen.values()].sort((a, b) => a.label.localeCompare(b.label));
        setAvailableTenants(list);
      }
    })().catch(() => {});
    return () => { stopped = true; };
  }, [session, isGlobalAdmin]);

  // When master picks a tenant, load that tenant's edge list so the
  // Settings modal can show an Edge picker. We use cp_edges (the
  // control-plane mirror) so the user sees the operator-set friendly
  // name rather than the raw edge_id.
  const [availableEdges, setAvailableEdges] = useState([]);
  useEffect(() => {
    if (!session || !isGlobalAdmin || !pickedTenantId) { setAvailableEdges([]); return; }
    let stopped = false;
    (async () => {
      try {
        const { data } = await supabase.from("cp_edges")
          .select("edge_id, edge_name, tenant_id")
          .eq("tenant_id", pickedTenantId)
          .limit(500);
        if (stopped) return;
        const list = (data || [])
          .filter((r) => r && r.edge_id)
          .map((r) => ({ edge_id: String(r.edge_id), label: String(r.edge_name || r.edge_id) }))
          .sort((a, b) => a.label.localeCompare(b.label));
        setAvailableEdges(list);
      } catch (_) {
        if (!stopped) setAvailableEdges([]);
      }
    })();
    return () => { stopped = true; };
  }, [session, isGlobalAdmin, pickedTenantId]);

  // Persist the picker selection so a page reload keeps the view.
  // EXCEPT in view-link mode — the tenant is pinned by the share token,
  // not a user choice, and writing it into localStorage would leak the
  // share-link tenant into whatever the next session does on this
  // browser (their own login, a different share link, etc.).
  useEffect(() => {
    if (isViewLinkMode) return;
    try { localStorage.setItem("tnlite-picked-tenant", pickedTenantId || ""); }
    catch (_) {}
  }, [pickedTenantId, isViewLinkMode]);

  // Optional master-only secondary filter — pick ONE edge so the profile
  // picker and live view only show that edge's rows. Empty = show every
  // edge for the picked tenant. Persisted to localStorage so the master
  // doesn't have to re-pick after a reload.
  const [pickedEdgeId, setPickedEdgeId] = useState(() => {
    try { return localStorage.getItem("tnlite-picked-edge") || ""; }
    catch (_) { return ""; }
  });
  useEffect(() => {
    if (isViewLinkMode) return;
    try { localStorage.setItem("tnlite-picked-edge", pickedEdgeId || ""); }
    catch (_) {}
  }, [pickedEdgeId, isViewLinkMode]);
  // When the tenant changes, drop any picked edge — it almost certainly
  // doesn't belong to the new tenant.
  useEffect(() => { setPickedEdgeId(""); }, [pickedTenantId]);

  // Tenant scope for every scoped query in the app. Three cases:
  //   - view-link mode: pin to the resolved tenant_id (anon viewer needs
  //     an explicit filter because there's no auth.uid() for RLS to
  //     match against the user's lite_profile).
  //   - global admin: use the picker (empty = all tenants).
  //   - regular signed-in user: empty (RLS handles filtering on the
  //     server). pickedTenantId stays empty for them so the master-only
  //     UI controls don't render, but effectiveTenantId below carries
  //     their JWT tenant for client-side defense-in-depth.
  const tenantScopeValue = useMemo(() => {
    const picked = isViewLinkMode
      ? String(viewLink?.tenant_id || "")
      : (isGlobalAdmin ? String(pickedTenantId || "") : "");
    // effectiveTenantId = what we GATE EVERY ROW against. For a regular
    // signed-in user it's their own tenant — that way, if a query ever
    // returns a foreign row (RLS mis-applied, realtime payload leaking,
    // mirror cache stale), our defensive filter still drops it.
    const effective = isViewLinkMode
      ? String(viewLink?.tenant_id || "")
      : (isGlobalAdmin ? picked : String(userTenantId || ""));
    // Edge scope:
    //   - view-link mode: pin to the edge the share-link was generated
    //     for. Without this, the embedded Client View would show every
    //     profile published under the same tenant — including profiles
    //     authored on a DIFFERENT edge. That's what produced the "wrong
    //     dashboard, wrong edge id" symptom the portal admin reported.
    //   - global admin: honor the master picker (empty = "all edges").
    //   - regular signed-in user: empty (they see every edge in their
    //     tenant, just like the previous behaviour).
    const effEdge = isViewLinkMode
      ? String(viewLink?.edge_id || "")
      : (isGlobalAdmin ? String(pickedEdgeId || "") : "");
    return {
      pickedTenantId: picked,
      setPickedTenantId,
      isGlobalAdmin,
      userTenantId,
      effectiveTenantId: effective,
      pickedEdgeId: effEdge,
      setPickedEdgeId,
    };
  }, [isGlobalAdmin, pickedTenantId, userTenantId, isViewLinkMode, viewLink, pickedEdgeId]);

  // Hooks must run unconditionally. The hooks themselves check supabase/
  // session before making any RPC, so calling them when signed out is a
  // cheap no-op that returns empty state. In view-link mode we enable
  // them too — the anon RLS policies grant read access for tenants
  // that have an active cp_edge_view_links row.
  const { rows: liveRows, transport } = useLiveLatest(!!session || isViewLinkMode);
  // In view-link mode there's no Supabase Auth session, but the anon
  // RLS policy on dashboard_configurations grants read access for any
  // tenant that has an active cp_edge_view_links row — so the dashboard
  // loader is still allowed to run. Enable it whenever we either have
  // a logged-in session OR a resolved view-link scope.
  const { profiles, active, activeKey, setActiveKey } = useDashboardProfiles(!!session || isViewLinkMode);

  const gatewayLastSeen = useMemo(() => {
    const m = {};
    for (const r of (liveRows || [])) {
      const t = Date.parse(r.ts_utc || 0);
      if (Number.isFinite(t)) {
        const gid = r.gateway_id || "";
        if (gid && (!m[gid] || m[gid] < t)) m[gid] = t;
      }
    }
    return m;
  }, [liveRows]);

  // Open the Tag Monitor modal. Called by tile/KPI taps (single tag) or by
  // the expand button on a chart widget (full widget incl. multi-series).
  const onOpenDrawer = useCallback((gw, gwName, tag, value, ts) => {
    setMonitor({ gateway_id: gw, gateway_name: gwName, tag_name: tag, value, ts });
  }, []);
  const onOpenWidget = useCallback((widget) => {
    setMonitor({ widget });
  }, []);

  const toggleTheme = () => setTheme(theme === "dark" ? "light" : "dark");

  // Skip the login gate in share-link mode — anonymous viewers don't
  // have a Supabase Auth session and shouldn't be asked to sign in.
  if (!session && !isViewLinkMode) {
    return h(LoginCard, { theme, onToggleTheme: toggleTheme, onSignedIn: setSession });
  }

  let content;
  if (tab === "dashboard") content = h(DashboardView, {
    liveRows, profiles, active, activeKey, setActiveKey,
    prefs, setPrefs, gatewayLastSeen, onOpenDrawer, onOpenWidget,
    // Master-admin tenant + edge pickers — both live inside the
    // dashboard settings modal (the gear). Forward the props so the
    // modal can render the picker rows when isGlobalAdmin.
    isGlobalAdmin,
    availableTenants,
    pickedTenantId,
    onPickTenant: setPickedTenantId,
    availableEdges,
    pickedEdgeId,
    onPickEdge: setPickedEdgeId,
  });
  else if (tab === "history") content = h(HistorianView, null);
  else if (tab === "alarms") content = h(AlarmsView, { liveRows });
  else if (tab === "power") content = h(PowerView, { liveRows });
  else if (tab === "reporting") content = h(ReportingView, null);
  else content = h("div", { className: "empty" }, "Unknown tab");

  const user = session?.user?.email || "";

  return h(TenantScopeCtx.Provider, { value: tenantScopeValue },
    h(DashPrefsCtx.Provider, { value: prefs },
    h("div", { className: "app-shell" },
      h(Header, {
        user, tenantLabel, theme, onToggleTheme: toggleTheme,
        liveRows, transport, gatewayLastSeen,
        sidebarVisible,
        onToggleSidebar: () => setSidebarVisible((v) => !v),
        onJumpAlarms: () => setTab("alarms"),
        isViewLinkMode,
        // Master-only props (Header renders the picker iff
        // isGlobalAdmin is true). For tenant users these are ignored.
        isGlobalAdmin,
        availableTenants,
        pickedTenantId,
        onPickTenant: setPickedTenantId,
        onSignOut: async () => {
          await supabase.auth.signOut().catch(() => {});
          setSession(null);
        },
      }),
      h("div", { className: `body ${sidebarVisible ? "" : "sidebar-hidden"}` },
        sidebarVisible ? h(Sidebar, { tab, setTab, user, tenantLabel }) : null,
        h("main", null, content)
      ),
      h(BottomTabs, { tab, setTab }),
      h(TagMonitor, { open: !!monitor, payload: monitor, onClose: () => setMonitor(null) })
    )
    )
  );
}

// ============================================================
// Boot
// ============================================================
// Read-only Client View share link detection. URL shape:
//   /lite/view/<token>
// The token resolves (via a public API on the control-plane backend) to
// a {tenant_id, customer_id, edge_id} scope the anonymous viewer is
// allowed to see. App renders in read-only mode pinned to that tenant.
function _detectViewLink() {
  try {
    const path = String(window.location.pathname || "");
    const m = path.match(/\/lite\/view\/([^/?#]+)/);
    return m ? decodeURIComponent(m[1]) : "";
  } catch (_) { return ""; }
}

async function _resolveViewLink(token) {
  if (!token) return null;
  // Resolver is mounted at the same origin (nginx proxies /api/* to the
  // backend). Public — no Authorization header required.
  try {
    const res = await fetch(`/api/lite-view/resolve/${encodeURIComponent(token)}`, {
      credentials: "omit",
    });
    if (res.status !== 200) return null;
    const body = await res.json();
    if (!body?.ok) return null;
    return {
      tenant_id: String(body.tenant_id || ""),
      customer_id: String(body.customer_id || ""),
      edge_id: String(body.edge_id || ""),
    };
  } catch (_) { return null; }
}

(async () => {
  applyTheme(readTheme());
  try {
    await loadConfig();
  } catch (e) {
    const root = document.getElementById("app");
    root.innerHTML = "";
    const r = createRoot(root);
    r.render(h("div", { className: "login-container theme-light" },
      h("div", { className: "auth-card" },
        h("div", { className: "auth-subtitle" }, "TrustNode Lite — not configured"),
        h("div", { className: "auth-error" }, e.message || String(e))
      )
    ));
    return;
  }
  if ("serviceWorker" in navigator) {
    try { navigator.serviceWorker.register("/lite/sw.js", { scope: "/lite/" }); } catch (_) {}
  }
  // Resolve share-link before mounting so the App component knows from
  // its first render whether to enter read-only mode and skip the login
  // gate entirely.
  const viewToken = _detectViewLink();
  let viewLink = null;
  if (viewToken) {
    viewLink = await _resolveViewLink(viewToken);
    if (!viewLink) {
      const root = document.getElementById("app");
      root.innerHTML = "";
      const r = createRoot(root);
      r.render(h("div", { className: "login-container theme-light" },
        h("div", { className: "auth-card" },
          h("div", { className: "auth-subtitle" }, "Link expired or invalid"),
          h("div", { className: "auth-error" },
            "This Client View link is no longer active. Ask the admin to share a new one."),
        )
      ));
      return;
    }
  }
  const root = document.getElementById("app");
  root.innerHTML = "";
  const r = createRoot(root);
  r.render(h(App, { viewLink }));
})();
  </script>
</body>
</html>
