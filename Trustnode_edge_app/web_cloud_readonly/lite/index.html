// ============================================================
// Config + Supabase client (loaded once at boot)
// ============================================================
let cfg = null;
let supabase = null;

async function loadConfig() {
  const res = await fetch("./config.json", { cache: "no-cache" });
  if (!res.ok) throw new Error(`config.json HTTP ${res.status}`);
  cfg = await res.json();
  if (!cfg?.supabase_url || !cfg?.supabase_anon_key) {
    throw new Error("config.json is missing supabase_url or supabase_anon_key");
  }
  supabase = createClient(cfg.supabase_url, cfg.supabase_anon_key, {
    auth: { persistSession: true, storageKey: "tnlite-auth", autoRefreshToken: true },
  });
}

const fmtAge = (iso) => {
  if (!iso) return "never";
  const t = Date.parse(iso);
  if (!Number.isFinite(t)) return "never";
  const dt = Math.max(0, Date.now() - t);
  if (dt < 1500) return "now";
  if (dt < 60_000) return `${Math.round(dt / 1000)}s`;
  if (dt < 3_600_000) return `${Math.round(dt / 60_000)}m`;
  if (dt < 86_400_000) return `${Math.round(dt / 3_600_000)}h`;
  return `${Math.round(dt / 86_400_000)}d`;
};
const fmtVal = (v) => {
  if (v === null || v === undefined) return "—";
  const n = Number(v);
  if (!Number.isFinite(n)) return String(v);
  if (Math.abs(n) >= 1000) return n.toFixed(0);
  if (Math.abs(n) >= 1) return n.toFixed(2);
  return n.toFixed(3);
};
const fmtTs = (iso) => {
  if (!iso) return "—";
  try { return new Date(iso).toLocaleString(); } catch { return String(iso); }
};
const freshnessClass = (ts) => {
  const t = ts ? Date.parse(ts) : 0;
  if (!t) return "bad";
  const age = Date.now() - t;
  if (age < 10_000) return "fresh";
  if (age < 60_000) return "stale";
  return "bad";
};
const SKIPPED_TYPES = new Set(["ip_camera", "cloud_sync_status"]);

// Theme helpers (write to <html data-theme=...>; persist in localStorage)
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  try { localStorage.setItem("trustnode_lite_theme", theme); } catch (_) {}
}
function readTheme() {
  try {
    const s = localStorage.getItem("trustnode_lite_theme");
    if (s === "light" || s === "dark") return s;
  } catch (_) {}
  return "light";
}

// ============================================================
// Data hooks
// ============================================================
function useLiveLatest(enabled = true) {
  const [rows, setRows] = useState([]);
  const [error, setError] = useState("");
  const [rtt, setRtt] = useState(null);
  const [transport, setTransport] = useState("polling");

  useEffect(() => {
    if (!enabled) return;
    let stopped = false;
    let channel = null;
    let pollTimer = null;

    const fetchAll = async () => {
      const t0 = performance.now();
      const { data, error: e } = await supabase
        .from("live_latest")
        .select("gateway_id, gateway_name, device_name, tag_name, value, quality, quality_label, ts_utc, tenant_id")
        .order("ts_utc", { ascending: false })
        .limit(400);
      if (stopped) return;
      if (e) { setError(e.message); return; }
      setRows(data || []);
      setError("");
      setRtt(Math.round(performance.now() - t0));
    };

    fetchAll();
    // Realtime: append/update in place.
    channel = supabase.channel("lite-live-rt")
      .on("postgres_changes",
        { event: "*", schema: "public", table: "live_latest" },
        (payload) => {
          const r = payload.new || payload.record || null;
          if (!r || !r.tag_name) return;
          setRows((prev) => {
            const key = `${r.gateway_id || ""}|${r.tag_name}`;
            const next = prev.filter((p) => `${p.gateway_id || ""}|${p.tag_name}` !== key);
            next.unshift(r);
            return next.slice(0, 400);
          });
        })
      .subscribe((status) => {
        if (status === "SUBSCRIBED") setTransport("realtime");
        else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") {
          setTransport("polling");
          if (!pollTimer) pollTimer = setInterval(fetchAll, Number(cfg?.live_poll_ms || 2000));
        }
      });
    // Belt-and-braces refresh every few seconds — picks up any missed events.
    pollTimer = setInterval(fetchAll, Math.max(4000, Number(cfg?.live_poll_ms || 1000) * 4));

    return () => {
      stopped = true;
      if (channel) supabase.removeChannel(channel).catch(() => {});
      if (pollTimer) clearInterval(pollTimer);
    };
  }, [enabled]);

  return { rows, error, rtt, transport };
}

function useDashboardProfiles(enabled = true) {
  const [profiles, setProfiles] = useState([]);
  const [activeKey, setActiveKey] = useState(() => {
    try { return localStorage.getItem("tnlite-profile") || ""; } catch (_) { return ""; }
  });
  const [error, setError] = useState("");

  useEffect(() => {
    if (!enabled) return;
    let stopped = false;
    let channel = null;
    const load = async () => {
      const { data, error: e } = await supabase
        .from("dashboard_configurations")
        .select("scope_key, payload_json, version, updated_utc")
        .order("updated_utc", { ascending: false })
        .limit(20);
      if (stopped) return;
      if (e) { setError(e.message); return; }
      setError("");
      const profs = (data || []).map((r) => ({
        key: r.scope_key || "",
        label: profileLabel(r.scope_key || ""),
        payload: r.payload_json || {},
      }));
      setProfiles(profs);
    };
    load();
    channel = supabase.channel("lite-dash-rt")
      .on("postgres_changes",
        { event: "*", schema: "public", table: "dashboard_configurations" },
        () => load())
      .subscribe();
    return () => {
      stopped = true;
      if (channel) supabase.removeChannel(channel).catch(() => {});
    };
  }, [enabled]);

  const setActive = (key) => {
    setActiveKey(key || "");
    try { localStorage.setItem("tnlite-profile", key || ""); } catch (_) {}
  };

  const active = useMemo(() => {
    if (!profiles.length) return null;
    return profiles.find((p) => p.key === activeKey) || profiles[0];
  }, [profiles, activeKey]);

  return { profiles, active, activeKey: active?.key || "", setActiveKey: setActive, error };
}

function profileLabel(scopeKey) {
  if (!scopeKey) return "Default";
  const parts = String(scopeKey).split("|");
  const edge = parts[2] || "";
  const user = parts[3] || "";
  if (edge && user) return `${edge} / ${user}`;
  if (edge) return edge;
  return scopeKey;
}

// Per-(gw|tag) chart series, fetched once then appended via realtime.
function useChartSeries(gw, tag, sampleCount) {
  const [series, setSeries] = useState([]); // [{ ts, value, idx }]
  const seriesRef = useRef(series);
  seriesRef.current = series;

  useEffect(() => {
    let stopped = false;
    if (!gw || !tag) { setSeries([]); return; }
    const fetchSeed = async () => {
      const { data, error } = await supabase
        .from("historian_readings")
        .select("ts_utc, value")
        .eq("tag_name", tag)
        .eq("gateway_id", gw)
        .order("ts_utc", { ascending: false })
        .limit(Math.max(2, Math.min(2000, Number(sampleCount) || 20)));
      if (stopped) return;
      if (error) return;
      const rows = (data || []).slice().reverse();
      setSeries(rows.map((r, idx) => ({
        idx,
        ts: r.ts_utc,
        value: Number(r.value),
      })));
    };
    fetchSeed();

    // Use the shared historian realtime channel (one channel, route by gw|tag).
    const handler = (row) => {
      if (!row || row.gateway_id !== gw || row.tag_name !== tag) return;
      const v = Number(row.value);
      setSeries((prev) => {
        const next = [...prev, { idx: prev.length, ts: row.ts_utc, value: Number.isFinite(v) ? v : null }];
        const cap = Math.max(2, Number(sampleCount) || 20);
        if (next.length > cap) next.splice(0, next.length - cap);
        // Re-number idx so XAxis stays monotonic.
        for (let i = 0; i < next.length; i++) next[i].idx = i;
        return next;
      });
    };
    historianSubscribers.add(handler);
    return () => { stopped = true; historianSubscribers.delete(handler); };
  }, [gw, tag, sampleCount]);

  return series;
}

// One shared historian realtime channel; chart hooks register a handler.
const historianSubscribers = new Set();
let _historianChan = null;
function ensureHistorianChannel() {
  if (_historianChan || !supabase) return;
  _historianChan = supabase.channel("lite-hist-rt")
    .on("postgres_changes",
      { event: "INSERT", schema: "public", table: "historian_readings" },
      (payload) => {
        const r = payload.new || payload.record || null;
        if (!r) return;
        historianSubscribers.forEach((fn) => { try { fn(r); } catch (_) {} });
      })
    .subscribe();
}

// ============================================================
// Charts (Recharts) — styled to match the desktop edge dashboard
// ============================================================
// Generous margins so the axis tick labels never collide with the card
// borders. Bottom: room for x-axis labels. Left: room for the y-axis
// tick numbers (we use width:38 on the YAxis itself but margins help
// when the body resizes small).
const chartMargin = { top: 10, right: 16, left: 8, bottom: 18 };
const chartTooltipProps = {
  contentStyle: {
    background: "var(--card, #171717)",
    border: "1px solid var(--stroke, rgba(255,255,255,0.14))",
    borderRadius: 8,
    color: "var(--text, #f2f4f7)",
    fontSize: 12,
  },
  labelStyle: { color: "var(--text, #f2f4f7)", fontWeight: 600 },
  itemStyle: { color: "var(--text, #f2f4f7)" },
};
function buildXAxisProps(series) {
  return {
    dataKey: "idx",
    tickFormatter: (v) => {
      const p = series.find((p) => p.idx === v);
      if (!p?.ts) return "";
      try { return new Date(p.ts).toLocaleTimeString().slice(0, 5); } catch { return ""; }
    },
    stroke: "var(--soft, #8a98ab)",
    tick: { fill: "var(--soft, #8a98ab)", fontSize: 10 },
    minTickGap: 28,
    axisLine: { stroke: "var(--line, rgba(138,152,171,0.25))" },
    tickLine: { stroke: "var(--line, rgba(138,152,171,0.25))" },
  };
}
// Compact tick formatter: 2-decimal max, k/M/G suffixes for big numbers.
// Keeps the Y axis readable for both ~119.84 sensor values AND large Wh
// totals like 11_279_318 that would otherwise wreck the layout.
const fmtTick = (v) => {
  if (v === null || v === undefined || !Number.isFinite(Number(v))) return "";
  const n = Number(v);
  const abs = Math.abs(n);
  if (abs >= 1e9) return (n / 1e9).toFixed(2) + "G";
  if (abs >= 1e6) return (n / 1e6).toFixed(2) + "M";
  if (abs >= 1e3) return (n / 1e3).toFixed(2) + "k";
  // Decimals only when meaningful — integers stay clean.
  return (Math.round(n * 100) / 100).toString();
};

const yAxisProps = {
  stroke: "var(--soft, #8a98ab)",
  tick: { fill: "var(--soft, #8a98ab)", fontSize: 10 },
  width: 48,
  tickFormatter: fmtTick,
  axisLine: { stroke: "var(--line, rgba(138,152,171,0.25))" },
  tickLine: { stroke: "var(--line, rgba(138,152,171,0.25))" },
};

// `domain` for `<YAxis>` — when autoFit is true we hug the data with a 5%
// pad above the max (so the peak isn't clipped by the chart frame) and 2%
// below the min. When off, fall back to Recharts default padded auto.
function buildYAxisProps(autoFit) {
  const pad = (n) => (Number.isFinite(n) ? n : 0);
  if (autoFit) {
    return {
      ...yAxisProps,
      // Generous top pad so the peak (e.g. a bar top) is fully visible.
      domain: [
        (dataMin) => pad(dataMin) - Math.abs(pad(dataMin)) * 0.02 - 0.001,
        (dataMax) => pad(dataMax) + Math.abs(pad(dataMax)) * 0.05 + 0.001,
      ],
      allowDataOverflow: false,
    };
  }
  return yAxisProps;
}

// Resolve the full series list for a chart widget: primary + every
// non-limit `cfg.series_extra` row. Each series carries gw/tag/color/axis/
// chart_type so we can render a multi-series ComposedChart that overlays
// lines, areas and bars on shared or split Y axes — matching the edge.
function widgetAllSeries(widget) {
  const cfg = widget?.config || {};
  const widgetType = String(widget?.type || "line_chart");
  const primaryColor = String(widget?.color || "#14a89a");
  const primaryKind =
    widgetType === "bar_chart" ? "bar" :
    widgetType === "line_area_chart" ? "area" : "line";
  // Per-widget rescale — same rule the edge dashboard uses so values
  // displayed in Lite match the edge to the decimal.
  const cleanMul = (v) => {
    const n = Number(v);
    return Number.isFinite(n) && n !== 0 ? n : 1;
  };
  const cleanOff = (v) => {
    const n = Number(v);
    return Number.isFinite(n) ? n : 0;
  };
  const out = [];
  if (cfg.tag_name) {
    out.push({
      id: "primary",
      gateway_id: cfg.gateway_id || "",
      tag_name: cfg.tag_name,
      label: String(widget?.title || cfg.tag_name || "").trim() || cfg.tag_name,
      color: primaryColor,
      axis: "left",
      chart_type: primaryKind,
      multiplier: cleanMul(cfg.multiplier),
      offset: cleanOff(cfg.offset),
    });
  }
  const extras = Array.isArray(cfg.series_extra) ? cfg.series_extra : [];
  extras.forEach((s, i) => {
    if (!s || !s.tag_name) return;
    if (String(s.chart_type || "").toLowerCase() === "limit") return; // skip ref lines for now
    out.push({
      id: String(s.id || `s${i + 1}`),
      gateway_id: String(s.gateway_id || cfg.gateway_id || ""),
      tag_name: String(s.tag_name),
      label: String(s.label || s.tag_name),
      color: String(s.color || pickPaletteColor(i + 1)),
      axis: String(s.axis || "left").toLowerCase() === "right" ? "right" : "left",
      chart_type: String(s.chart_type || primaryKind).toLowerCase() || primaryKind,
      multiplier: cleanMul(s.multiplier),
      offset: cleanOff(s.offset),
    });
  });
  return out;
}

function pickPaletteColor(i) {
  const palette = ["#14a89a", "#f97316", "#6e8dd2", "#e2585d", "#a855f7", "#0e8479", "#22c55e", "#fbbf24"];
  return palette[i % palette.length];
}

// Hook: fetch + realtime-append every series for a chart widget at once,
// then merge them into a single Recharts dataset keyed by index.
//
// Returns { merged, seriesDefs } where `merged` is an array of rows like
// { idx, ts, val_primary, val_s1, val_s2, ... } so Recharts dataKey can
// pick each series by its id.
function useMultiSeries(widget, sampleCount) {
  const seriesDefs = useMemo(() => widgetAllSeries(widget), [
    widget?.id, widget?.type, widget?.color, widget?.title,
    widget?.config?.tag_name, widget?.config?.gateway_id,
    JSON.stringify(widget?.config?.series_extra || []),
  ]);
  // Each series has its own running buffer keyed by ts_utc -> value.
  const [tick, setTick] = useState(0);
  const buffersRef = useRef(new Map()); // id -> Map<ts, value>

  useEffect(() => {
    buffersRef.current = new Map(seriesDefs.map((s) => [s.id, new Map()]));
    setTick((t) => t + 1);
    if (!seriesDefs.length) return;

    let stopped = false;
    const subs = new Set();
    const handlers = new Map(); // gw|tag -> handler

    // Apply the series's multiplier + offset before storing so every
    // downstream consumer (the chart, the tooltip, the live tile) sees
    // already-scaled values. Same rule the edge applies.
    const scale = (s, raw) => {
      const v = Number(raw);
      if (!Number.isFinite(v)) return null;
      const m = Number.isFinite(s?.multiplier) && s.multiplier !== 0 ? s.multiplier : 1;
      const o = Number.isFinite(s?.offset) ? s.offset : 0;
      return v * m + o;
    };

    const fetchSeed = async (s) => {
      const { data, error } = await supabase
        .from("historian_readings")
        .select("ts_utc, value")
        .eq("tag_name", s.tag_name)
        .eq("gateway_id", s.gateway_id)
        .order("ts_utc", { ascending: false })
        .limit(Math.max(2, Math.min(2000, Number(sampleCount) || 20)));
      if (stopped || error) return;
      const buf = buffersRef.current.get(s.id);
      if (!buf) return;
      buf.clear();
      (data || []).slice().reverse().forEach((r) => {
        buf.set(r.ts_utc, scale(s, r.value));
      });
      setTick((t) => t + 1);
    };

    // Seed all series in parallel.
    Promise.all(seriesDefs.map(fetchSeed)).catch(() => {});

    // Register one realtime handler per (gw|tag) so each new row appends.
    for (const s of seriesDefs) {
      const fn = (row) => {
        if (!row || row.tag_name !== s.tag_name || row.gateway_id !== s.gateway_id) return;
        const buf = buffersRef.current.get(s.id);
        if (!buf) return;
        buf.set(row.ts_utc, scale(s, row.value));
        // Cap each buffer at sampleCount * 2 entries.
        const cap = Math.max(20, (Number(sampleCount) || 20) * 2);
        if (buf.size > cap) {
          const keys = [...buf.keys()].sort();
          for (let i = 0; i < keys.length - cap; i++) buf.delete(keys[i]);
        }
        setTick((t) => t + 1);
      };
      historianSubscribers.add(fn);
      subs.add(fn);
      handlers.set(`${s.gateway_id}|${s.tag_name}`, fn);
    }
    return () => {
      stopped = true;
      subs.forEach((fn) => historianSubscribers.delete(fn));
    };
  }, [seriesDefs, sampleCount]);

  // Build the merged dataset. Take the union of all timestamps across
  // every series, sort, then for each timestamp emit a row carrying each
  // series's most recent value at-or-before that timestamp (carry-forward
  // resample). Without this, two series sampled on slightly different
  // clocks render as alternating null/value rows and the line never
  // appears even with connectNulls.
  const merged = useMemo(() => {
    if (!seriesDefs.length) return [];
    const tsSet = new Set();
    for (const def of seriesDefs) {
      const buf = buffersRef.current.get(def.id);
      if (!buf) continue;
      for (const ts of buf.keys()) tsSet.add(ts);
    }
    const sortedTs = [...tsSet].sort();
    if (!sortedTs.length) return [];
    const cap = Math.max(2, Number(sampleCount) || 20);
    const window = sortedTs.slice(-cap);

    // For each series, pre-sort its entries; walk the window in lockstep
    // with each series's pointer to forward-fill the current value.
    const seriesEntries = seriesDefs.map((def) => {
      const buf = buffersRef.current.get(def.id);
      const entries = buf ? [...buf.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1) : [];
      return { def, entries, ptr: 0, last: null };
    });

    return window.map((ts, idx) => {
      const row = { idx, ts };
      for (const st of seriesEntries) {
        while (st.ptr < st.entries.length && st.entries[st.ptr][0] <= ts) {
          st.last = st.entries[st.ptr][1];
          st.ptr += 1;
        }
        row[st.def.id] = (st.last === undefined ? null : st.last);
      }
      return row;
    });
    // tick triggers re-build on any new sample.
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [seriesDefs, sampleCount, tick]);

  return { merged, seriesDefs };
}

function ChartWidget({ widget }) {
  const cfg = widget?.config || {};
  const widgetType = String(widget?.type || "line_chart");
  const sampleCount = useDashSamples();
  const { yAxisAutoFit } = useDashPrefs();
  const yProps = buildYAxisProps(!!yAxisAutoFit);
  const { merged, seriesDefs } = useMultiSeries(widget, sampleCount);

  if (!seriesDefs.length) return h("div", { className: "widget-empty muted" }, "no tag");
  if (!merged.length) return h("div", { className: "widget-empty muted" }, "no samples");

  const labelFmt = (v) => merged.find((p) => p.idx === v)?.ts || String(v);
  const hasRightAxis = seriesDefs.some((s) => s.axis === "right");

  // Pick the right Recharts root for the primary chart type, then overlay
  // each series as a Line/Area/Bar child within it.
  return h(ResponsiveContainer, { width: "100%", height: "100%" },
    h(buildChartRoot(widgetType, seriesDefs.length), { data: merged, margin: chartMargin },
      h(CartesianGrid, { stroke: "var(--line, rgba(255,255,255,0.07))", strokeDasharray: "3 3" }),
      h(XAxis, buildXAxisProps(merged)),
      h(YAxis, { ...yProps, yAxisId: "left" }),
      hasRightAxis ? h(YAxis, { ...yProps, yAxisId: "right", orientation: "right" }) : null,
      h(Tooltip, { ...chartTooltipProps, labelFormatter: labelFmt, formatter: (v, name) => [fmtVal(v), name] }),
      seriesDefs.length > 1 ? h(Legend, { wrapperStyle: { fontSize: 11, color: "var(--muted, #8a98ab)" } }) : null,
      ...seriesDefs.map((s) => renderSeriesElement(s, widgetType))
    )
  );
}

// Pick the Recharts root for a chart. For single-series widgets the
// natural Line/Area/BarChart is used; for multi-series widgets we use
// ComposedChart which is the only Recharts container that lets you mix
// Line + Area + Bar children freely.
function buildChartRoot(widgetType, seriesCount = 1) {
  if (seriesCount > 1) return ComposedChart;
  if (widgetType === "bar_chart") return BarChart;
  if (widgetType === "line_area_chart") return AreaChart;
  return LineChart;
}

function renderSeriesElement(s, widgetType) {
  if (s.chart_type === "bar" || (widgetType === "bar_chart" && s.chart_type === "")) {
    return h(Bar, {
      key: s.id, dataKey: s.id, name: s.label,
      yAxisId: s.axis === "right" ? "right" : "left",
      isAnimationActive: false, fill: s.color,
    });
  }
  if (s.chart_type === "area" || (widgetType === "line_area_chart" && s.chart_type === "")) {
    return h(Area, {
      key: s.id, dataKey: s.id, name: s.label,
      yAxisId: s.axis === "right" ? "right" : "left",
      type: "monotone", stroke: s.color, fill: s.color + "33",
      strokeWidth: 1.8, dot: false, isAnimationActive: false, connectNulls: true,
    });
  }
  // default: line
  return h(Line, {
    key: s.id, dataKey: s.id, name: s.label,
    yAxisId: s.axis === "right" ? "right" : "left",
    type: "monotone", stroke: s.color, strokeWidth: 1.8,
    dot: false, isAnimationActive: false, connectNulls: true,
  });
}

// ============================================================
// Widgets (KPI, Meter, Pie, Table, Image, FixedText, Divider)
// ============================================================
function widgetTitle(w) {
  const cfg = w?.config || {};
  return String(w?.title || cfg.title || cfg.tag_name || cfg.text || "").trim();
}

function KpiWidget({ widget, liveByKey, onOpen }) {
  const cfg = widget?.config || {};
  const color = String(widget?.color || "#14a89a");
  const isText = widget?.type === "text_kpi";
  const row = liveByKey.get(`${cfg.gateway_id}|${cfg.tag_name}`);
  const value = row ? row.value : null;
  const ts = row ? row.ts_utc : null;
  const cls = `widget-kpi ${freshnessClass(ts)}`;
  return h("button", {
      className: cls,
      onClick: () => cfg.tag_name && onOpen(cfg.gateway_id, cfg.gateway_id || "", cfg.tag_name, value, ts),
    },
    h("div", { className: "widget-title" }, widgetTitle(widget) || cfg.tag_name || "—"),
    h("div", { className: "widget-value", style: { color } },
      isText ? (row?.value_text || row?.quality_label || (value == null ? "—" : String(value)))
             : fmtVal(value)),
    h("div", { className: "widget-sub" },
      (cfg.gateway_name || cfg.gateway_id || "—"), " · ", fmtAge(ts), " ago")
  );
}

// Compute color ranges for a meter from widget.config.compute_rules.
// Each rule has { operator, value1, value2, label, color }. Mirrors the
// edge's computeMeterRanges() so the same configured ranges render the
// same arcs in Lite. Falls back to a sensible Low/Normal/High split when
// no rules are configured.
function computeMeterRanges(widget, value) {
  const rules = Array.isArray(widget?.config?.compute_rules) ? widget.config.compute_rules : [];
  const parsed = [];
  rules.forEach((r, idx) => {
    const op = String((r || {}).operator || "between").toLowerCase();
    const v1 = Number(r?.value1);
    const v2 = Number(r?.value2);
    let min = NaN, max = NaN;
    if (op === "between") {
      if (Number.isFinite(v1) && Number.isFinite(v2)) { min = Math.min(v1, v2); max = Math.max(v1, v2); }
    } else if (op === "lt" || op === "lte") { if (Number.isFinite(v1)) { min = -Infinity; max = v1; } }
    else if (op === "gt" || op === "gte") { if (Number.isFinite(v1)) { min = v1; max = Infinity; } }
    else if (op === "eq") { if (Number.isFinite(v1)) { min = v1 - 0.5; max = v1 + 0.5; } }
    if (!Number.isFinite(min) && !Number.isFinite(max)) return;
    parsed.push({
      id: String(r?.id || `range-${idx}`),
      label: String(r?.label || `Range ${idx + 1}`),
      color: String(r?.color || "#14a89a"),
      min, max,
    });
  });
  if (!parsed.length) {
    const v = Number.isFinite(Number(value)) ? Number(value) : 0;
    const floor = Math.floor((v - 10) / 10) * 10;
    const ceil = Math.ceil((v + 10) / 10) * 10;
    const span = Math.max(10, ceil - floor);
    const a = floor;
    const b = floor + span * 0.6;
    const c = floor + span * 0.85;
    return [
      { id: "low", label: "Low", color: "#22c55e", min: a, max: b },
      { id: "normal", label: "Normal", color: "#14a89a", min: b, max: c },
      { id: "high", label: "High", color: "#e2585d", min: c, max: ceil },
    ];
  }
  const finiteMins = parsed.map((r) => r.min).filter((n) => Number.isFinite(n));
  const finiteMaxs = parsed.map((r) => r.max).filter((n) => Number.isFinite(n));
  const cur = Number(value);
  const baseMin = finiteMins.length ? Math.min(...finiteMins) : (Number.isFinite(cur) ? cur - 10 : 0);
  const baseMax = finiteMaxs.length ? Math.max(...finiteMaxs) : (Number.isFinite(cur) ? cur + 10 : 100);
  const domainMin = Math.min(baseMin, Number.isFinite(cur) ? cur : baseMin);
  const domainMax = Math.max(baseMax, Number.isFinite(cur) ? cur : baseMax);
  return parsed.map((r) => ({
    ...r,
    min: Number.isFinite(r.min) ? r.min : domainMin,
    max: Number.isFinite(r.max) ? r.max : domainMax,
  })).sort((a, b) => a.min - b.min);
}

function MeterWidget({ widget, liveByKey, onOpen }) {
  const cfg = widget?.config || {};
  const row = liveByKey.get(`${cfg.gateway_id}|${cfg.tag_name}`);
  const value = row ? Number(row.value) : NaN;
  const ts = row ? row.ts_utc : null;
  // Honour explicit min/max if the operator set them on the widget; the
  // computed ranges (from compute_rules) still drive the colored arcs.
  const explicitMin = Number(cfg.meter_min);
  const explicitMax = Number(cfg.meter_max);
  const ranges = computeMeterRanges(widget, value);
  const rangeMin = ranges.length ? Math.min(...ranges.map((r) => Number(r.min))) : 0;
  const rangeMax = ranges.length ? Math.max(...ranges.map((r) => Number(r.max))) : 100;
  const domainMin = Number.isFinite(explicitMin) ? explicitMin : rangeMin;
  const domainMax = Number.isFinite(explicitMax) ? explicitMax : rangeMax;
  const gaugeData = ranges
    .map((r) => ({ name: r.label, color: r.color, value: Math.max(0, Number(r.max) - Number(r.min)) }))
    .filter((r) => Number.isFinite(r.value) && r.value > 0);
  const currentPct = Number.isFinite(value)
    ? ((Math.max(domainMin, Math.min(domainMax, value)) - domainMin) / Math.max(1e-9, (domainMax - domainMin))) * 100
    : NaN;
  const pointerDeg = Number.isFinite(currentPct) ? (Math.max(0, Math.min(100, currentPct)) * 180) / 100 - 90 : -90;

  return h("button", {
    className: `widget-meter ${freshnessClass(ts)}`,
    onClick: () => cfg.tag_name && onOpen(cfg.gateway_id, cfg.gateway_id || "", cfg.tag_name, value, ts),
  },
    h("div", { className: "widget-title" }, widgetTitle(widget) || cfg.tag_name || "—"),
    h("div", { className: "widget-meter-gauge" },
      h(ResponsiveContainer, { width: "100%", height: "100%" },
        h(PieChart, null,
          h(Pie, {
            data: gaugeData, dataKey: "value",
            startAngle: 180, endAngle: 0,
            cx: "50%", cy: "70%", innerRadius: "60%", outerRadius: "95%",
            stroke: "none", paddingAngle: 0.6, isAnimationActive: false,
          },
            ...gaugeData.map((entry, idx) =>
              h(Cell, { key: `mseg-${idx}`, fill: entry.color }))
          )
        )
      ),
      // SVG pointer overlay
      h("div", { className: "meter-pointer-wrap", "aria-hidden": "true" },
        h("div", { className: "meter-pointer", style: { transform: `translate(-50%, 0) rotate(${pointerDeg}deg)` } }),
        h("div", { className: "meter-pointer-cap" })
      ),
      h("div", { className: "meter-caption" },
        h("div", { className: "meter-caption-value" }, Number.isFinite(value) ? value.toFixed(2) : "—"),
        h("div", { className: "meter-caption-pct" }, Number.isFinite(currentPct) ? `${currentPct.toFixed(1)}%` : "—")
      )
    ),
    // Compact legend underneath
    ranges.length ? h("div", { className: "meter-legend" },
      ...ranges.map((r) => h("span", { key: r.id, className: "meter-legend-item" },
        h("span", { className: "meter-legend-swatch", style: { background: r.color } }),
        h("span", { className: "meter-legend-label" }, `${r.label} ${Number(r.min).toFixed(1)}–${Number(r.max).toFixed(1)}`)
      ))
    ) : null,
    h("div", { className: "widget-sub" }, fmtAge(ts), " ago")
  );
}

// Match a value against a single computed rule.
function ruleMatches(rule, v) {
  if (!Number.isFinite(v)) return false;
  const op = String(rule?.operator || "between").toLowerCase();
  const v1 = Number(rule?.value1);
  const v2 = Number(rule?.value2);
  if (op === "between" && Number.isFinite(v1) && Number.isFinite(v2))
    return v >= Math.min(v1, v2) && v <= Math.max(v1, v2);
  if ((op === "lt" || op === "lte") && Number.isFinite(v1)) return op === "lt" ? v < v1 : v <= v1;
  if ((op === "gt" || op === "gte") && Number.isFinite(v1)) return op === "gt" ? v > v1 : v >= v1;
  if (op === "eq" && Number.isFinite(v1)) return Math.abs(v - v1) < 1e-9;
  return false;
}

// Fetch the last-N values for a (gw, tag) from historian — used by pie
// "computed" mode to count rule matches. Cached for CHART_TTL_MS like the
// chart widgets so we don't hammer Supabase.
const pieCache = new Map();
async function fetchPieValues(gw, tag, sampleCount) {
  const key = `${gw}|${tag}|${sampleCount}`;
  const now = Date.now();
  const hit = pieCache.get(key);
  if (hit && (now - hit.t) < 30_000) return hit.values;
  const { data, error } = await supabase
    .from("historian_readings")
    .select("value")
    .eq("gateway_id", gw)
    .eq("tag_name", tag)
    .order("ts_utc", { ascending: false })
    .limit(Math.max(20, Number(sampleCount) || 200));
  if (error) return [];
  const values = (data || []).map((r) => Number(r.value)).filter(Number.isFinite);
  pieCache.set(key, { values, t: now });
  return values;
}

// Pie chart widget. Modes:
//   * computed: each rule's slice value = count of historian samples that
//     match the rule. We fetch the last-N samples once per widget (cached
//     30s) and count matches client-side. This matches the desktop's
//     aggregation: 'count' behaviour without needing the stats endpoint.
//   * tag_direct (default): one slice per series_extra + primary tag.
//     Value is the latest absolute reading from live_latest.
function PieWidget({ widget, liveByKey }) {
  const cfg = widget?.config || {};
  const showLegend = cfg.pie_show_legend !== false;
  const isComputed = String(cfg.data_source_type || "").toLowerCase() === "computed";
  const sampleCount = useDashSamples();
  const [computedCounts, setComputedCounts] = useState(null);

  // Fetch historian samples for computed mode, refresh when rule set or
  // sampleCount changes. Also re-run on each new live tick for the
  // primary tag so the counts stay current.
  useEffect(() => {
    if (!isComputed) return;
    let stopped = false;
    const refresh = async () => {
      const rules = Array.isArray(cfg.compute_rules) ? cfg.compute_rules : [];
      if (!rules.length) { setComputedCounts([]); return; }
      // Each rule can carry its own (gateway_id, tag_name); fall back to
      // the widget's primary tag if missing.
      const fetched = new Map();
      const counts = [];
      // Same aggregation semantics the edge applies in dashboardAnalytics.js:
      //   count   — number of samples that match the rule
      //   sum     — total of matching values
      //   avg     — mean of matching values
      //   min/max — extremes of matching values
      //   latest  — most-recent matching value (values arrive oldest-first
      //             from fetchPieValues, so this is the last entry)
      const reduce = (matchVals, mode) => {
        if (!matchVals.length) return mode === "count" ? 0 : null;
        switch (String(mode || "count").toLowerCase()) {
          case "sum":    return matchVals.reduce((a, b) => a + b, 0);
          case "avg":    return matchVals.reduce((a, b) => a + b, 0) / matchVals.length;
          case "min":    return Math.min(...matchVals);
          case "max":    return Math.max(...matchVals);
          case "latest":
          case "last":   return matchVals[matchVals.length - 1];
          case "count":
          default:       return matchVals.length;
        }
      };
      for (const r of rules) {
        const gw  = r.gateway_id || cfg.gateway_id || "";
        const tag = r.tag_name || cfg.tag_name || "";
        const k = `${gw}|${tag}`;
        if (!fetched.has(k)) fetched.set(k, await fetchPieValues(gw, tag, Number(sampleCount) || 200));
        const values = fetched.get(k);
        const matching = values.filter((v) => ruleMatches(r, v));
        const agg = reduce(matching, r.aggregation || "count");
        counts.push(Number.isFinite(agg) ? agg : 0);
      }
      if (!stopped) setComputedCounts(counts);
    };
    refresh();
    // Re-run when a fresh live sample for the configured tag arrives.
    const handler = (row) => {
      if (!row || row.tag_name !== cfg.tag_name || row.gateway_id !== cfg.gateway_id) return;
      // Invalidate cache so the next refresh picks the new sample up.
      const key = `${cfg.gateway_id}|${cfg.tag_name}|${Number(sampleCount) || 200}`;
      pieCache.delete(key);
      refresh();
    };
    historianSubscribers.add(handler);
    ensureHistorianChannel();
    return () => { stopped = true; historianSubscribers.delete(handler); };
  }, [isComputed, JSON.stringify(cfg.compute_rules || []), cfg.gateway_id, cfg.tag_name, sampleCount]);

  let data;
  if (isComputed) {
    const rules = Array.isArray(cfg.compute_rules) ? cfg.compute_rules : [];
    if (computedCounts == null) {
      return h("div", { className: "widget-empty muted" }, h("span", { className: "spinner" }), " loading…");
    }
    data = rules.map((r, idx) => ({
      name: String(r?.label || `Item ${idx + 1}`),
      value: Math.max(0, Number(computedCounts[idx] || 0)),
      color: String(r?.color || pickPaletteColor(idx)),
    }));
  } else {
    const series = widgetAllSeries(widget);
    data = series.map((s, idx) => {
      const row = liveByKey.get(`${s.gateway_id}|${s.tag_name}`);
      const v = Number(row?.value);
      return {
        name: s.label,
        value: Number.isFinite(v) ? Math.abs(v) : 0,
        color: s.color || pickPaletteColor(idx),
      };
    });
  }
  const total = data.reduce((acc, d) => acc + (d.value || 0), 0);
  if (!total) return h("div", { className: "widget-empty muted" }, "no matches");
  return h("div", { className: "widget-pie-wrap" },
    h("div", { className: "widget-pie-chart" },
      h(ResponsiveContainer, { width: "100%", height: "100%" },
        h(PieChart, null,
          h(Pie, {
            data, dataKey: "value", nameKey: "name",
            cx: "50%", cy: "50%", innerRadius: "55%", outerRadius: "90%",
            stroke: "none", paddingAngle: 1.4, isAnimationActive: false,
          },
            ...data.map((entry, idx) => h(Cell, { key: `pie-${idx}`, fill: entry.color }))
          ),
          h(Tooltip, { ...chartTooltipProps, formatter: (v, n) => [fmtVal(v), n] })
        )
      )
    ),
    showLegend ? h("div", { className: "widget-pie-legend" },
      ...data.map((d, i) => {
        const pct = total > 0 ? (d.value / total * 100) : 0;
        return h("span", { key: i, className: "pie-legend-item" },
          h("span", { className: "pie-legend-dot", style: { background: d.color } }),
          h("span", null, d.name),
          h("span", { className: "pie-legend-value" }, `${fmtVal(d.value)} (${pct.toFixed(0)}%)`)
        );
      })
    ) : null
  );
}

function TableWidget({ widget }) {
  const cfg = widget?.config || {};
  const sampleCount = useDashSamples();
  // Per-widget table size (query_row_limit / list_limit) takes precedence
  // over the dashboard-level sample count so the edge editor's table-row
  // selector is honoured in Lite. Falls back to the dashboard default
  // when no per-widget limit is set.
  const rowLimit = Math.max(1, Math.min(2000, Number(cfg.query_row_limit || cfg.list_limit || sampleCount || 20)));
  const rowSel = String(cfg.query_row_selection || "all").toLowerCase();
  const series = useChartSeries(cfg.gateway_id || "", cfg.tag_name || "", rowLimit);
  // useChartSeries returns oldest-first; pick the right slice for the
  // configured row_selection (latest/last_n = tail, oldest = head, all = full).
  let rows;
  if (rowSel === "oldest") {
    rows = series.slice(0, rowLimit).reverse();
  } else if (rowSel === "all") {
    rows = series.slice().reverse();
  } else {
    rows = series.slice(-rowLimit).reverse();
  }
  if (!cfg.tag_name) return h("div", { className: "widget-empty muted" }, "no tag");
  if (!rows.length) return h("div", { className: "widget-empty muted" }, "no samples");
  return h("div", { className: "widget-table-mount" },
    h("table", { className: "hist-table", style: { fontSize: 11 } },
      h("thead", null, h("tr", null,
        h("th", null, "Time"), h("th", null, "Value"))),
      h("tbody", null, ...rows.map((r, i) =>
        h("tr", { key: i },
          h("td", null, fmtTs(r.ts)),
          h("td", { className: "num" }, fmtVal(r.value))
        )))
    )
  );
}

function ImageWidget({ widget }) {
  const cfg = widget?.config || {};
  if (!cfg.source_url) return h("div", { className: "widget-empty muted" }, "no image");
  return h("img", { className: "widget-image", src: cfg.source_url, alt: widgetTitle(widget) || "image" });
}

function Widget({ widget, liveByKey, onOpen, onOpenWidget }) {
  const type = String(widget?.type || "");
  if (SKIPPED_TYPES.has(type)) return null;
  const isChart = type === "line_chart" || type === "line_area_chart" || type === "bar_chart";
  const isKpi   = type === "value_kpi" || type === "text_kpi";
  const inner =
    isChart        ? h(ChartWidget,  { widget }) :
    isKpi          ? h(KpiWidget,    { widget, liveByKey, onOpen }) :
    type === "meter_chart" ? h(MeterWidget, { widget, liveByKey, onOpen }) :
    type === "pie_chart"   ? h(PieWidget,   { widget, liveByKey }) :
    type === "table_list"  ? h(TableWidget, { widget }) :
    type === "image"       ? h(ImageWidget, { widget }) :
    type === "fixed_text"  ? h("div", { className: "widget-text" }, widget?.config?.text || "") :

  { label: "15m", ms: 15 * 60_000 },

// Merge multiple per-series ts->value buffers into one Recharts dataset.
// Uses the same carry-forward resample as useMultiSeries so missing
// samples in one series don't blank out the other.
function buildMergedFromBuffers(defs, buffers, cap) {
  const tsSet = new Set();
  for (const def of defs) {
    const buf = buffers.get(def.id);
    if (!buf) continue;
    for (const ts of buf.keys()) tsSet.add(ts);
  }
  const sortedTs = [...tsSet].sort();
  if (!sortedTs.length) return [];
  const limit = Math.max(20, Math.min(20000, Number(cap) || 500));
  const window = sortedTs.slice(-limit);
  const seriesEntries = defs.map((def) => {
    const buf = buffers.get(def.id);
    const entries = buf ? [...buf.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1) : [];
    return { def, entries, ptr: 0, last: null };
  });
  return window.map((ts, idx) => {
    const row = { idx, ts };
    for (const st of seriesEntries) {
      while (st.ptr < st.entries.length && st.entries[st.ptr][0] <= ts) {
        st.last = st.entries[st.ptr][1];
        st.ptr += 1;
      }
      row[st.def.id] = (st.last === undefined ? null : st.last);
    }
    return row;
  });
}

// Tag Monitor: full-screen modal that overlays every series of a chart
// widget (or a single ad-hoc tag from a tile tap) onto one big chart.
// Range tabs from 5 minutes to 7 days. Max-points selector to keep large
// ranges responsive. Live-appends each new historian row in place via the
// shared realtime channel so the chart stays current while open.
function TagMonitor({ open, payload, onClose }) {
  const [rangeMs, setRangeMs] = useState(60 * 60_000);
  const [maxPoints, setMaxPoints] = useState(500);
  const [data, setData] = useState(null);
  const [error, setError] = useState("");
  const [seriesDefs, setSeriesDefs] = useState([]);
  // Keep raw per-series buffers in a ref so the live handler can mutate
  // without triggering a re-merge on every tick (we throttle to rAF).
  const buffersRef = useRef(new Map());

  useEffect(() => {
    if (!open || !payload) return;
    let stopped = false;
    setData(null); setError("");
    let defs;
    if (payload.widget) {
      defs = widgetAllSeries(payload.widget);
    } else if (payload.tag_name) {
      defs = [{
        id: "primary",
        gateway_id: payload.gateway_id || "",
        tag_name: payload.tag_name,
        label: payload.tag_name,
        color: "#14a89a",
        axis: "left",
        chart_type: "line",
      }];
    } else { defs = []; }
    setSeriesDefs(defs);
    buffersRef.current = new Map(defs.map((s) => [s.id, new Map()]));

    const fromTs = new Date(Date.now() - rangeMs).toISOString();
    (async () => {
      const results = await Promise.all(defs.map((s) =>
        supabase.from("historian_readings")
          .select("ts_utc, value")
          .eq("tag_name", s.tag_name)
          .eq("gateway_id", s.gateway_id)
          .gte("ts_utc", fromTs)
          .order("ts_utc", { ascending: true })
          .limit(Math.max(50, Math.min(20000, Number(maxPoints) || 500)))
          .then(({ data, error }) => ({ s, rows: data || [], error }))
      ));
      if (stopped) return;
      const errored = results.find((r) => r.error);
      if (errored) { setError(errored.error.message); return; }
      // Fill buffers + first merge.
      results.forEach(({ s, rows }) => {
        const buf = buffersRef.current.get(s.id);
        if (!buf) return;
        for (const r of rows) {
          const v = Number(r.value);
          if (Number.isFinite(v)) buf.set(r.ts_utc, v);
        }
      });
      setData(buildMergedFromBuffers(defs, buffersRef.current, maxPoints));
    })();

    // Live-append: subscribe to historian inserts for each (gw,tag) pair.
    ensureHistorianChannel();
    let rafScheduled = false;
    const handler = (row) => {
      if (!row || !row.tag_name) return;
      const match = defs.find((s) => s.gateway_id === row.gateway_id && s.tag_name === row.tag_name);
      if (!match) return;
      const buf = buffersRef.current.get(match.id);
      const v = Number(row.value);
      if (!Number.isFinite(v)) return;
      buf.set(row.ts_utc, v);
      // Throttle the merge to one per animation frame.
      if (rafScheduled) return;
      rafScheduled = true;
      requestAnimationFrame(() => {
        rafScheduled = false;
        if (stopped) return;
        setData(buildMergedFromBuffers(defs, buffersRef.current, maxPoints));
      });
    };
    historianSubscribers.add(handler);

    return () => {
      stopped = true;
      historianSubscribers.delete(handler);
    };
  }, [open, payload, rangeMs, maxPoints]);

  const { yAxisAutoFit: monAutoFit } = useDashPrefs();
  const monYProps = buildYAxisProps(!!monAutoFit);
  if (!open) return null;
  const title = payload?.widget
    ? widgetTitle(payload.widget) || "Tag Monitor"
    : `${payload?.tag_name || ""} · ${payload?.gateway_name || payload?.gateway_id || ""}`;
  const hasRight = seriesDefs.some((s) => s.axis === "right");
  const widgetType = String(payload?.widget?.type || "line_chart");
  const labelFmt = (v) => (data && data.find((p) => p.idx === v)?.ts) || String(v);

  return h("div", { className: "monitor-back", onClick: (e) => { if (e.target.classList.contains("monitor-back")) onClose(); } },
    h("div", { className: "monitor" },
      h("div", { className: "monitor-head" },
        h("h3", null, title),
        h("button", { className: "close", onClick: onClose }, "Close")
      ),
      h("div", { className: "monitor-chart-wrap" },
        data == null ? h("div", { className: "empty" }, h("div", { className: "spinner" }), " loading…") :
        error       ? h("div", { className: "banner" }, error) :
        (data.length === 0 || seriesDefs.length === 0)
          ? h("div", { className: "empty" }, "No samples in this range.")
          : h(ResponsiveContainer, { width: "100%", height: "100%" },
              h(buildChartRoot(widgetType, seriesDefs.length), { data, margin: { top: 12, right: 16, left: 8, bottom: 4 } },
                h(CartesianGrid, { stroke: "var(--line, rgba(255,255,255,0.07))", strokeDasharray: "3 3" }),
                h(XAxis, buildXAxisProps(data)),
                h(YAxis, { ...monYProps, yAxisId: "left" }),
                hasRight ? h(YAxis, { ...monYProps, yAxisId: "right", orientation: "right" }) : null,
                h(Tooltip, { ...chartTooltipProps, labelFormatter: labelFmt, formatter: (v, n) => [fmtVal(v), n] }),
                h(Legend, { wrapperStyle: { fontSize: 12, color: "var(--muted, #8a98ab)" } }),
                ...seriesDefs.map((s) => renderSeriesElement(s, widgetType))
              )
            )
      ),
      h("div", { className: "monitor-meta" },
        h("span", { className: "status-pill status-online" },
          h("span", { className: "pill-dot" }),
          h("span", null, "LIVE")
        ),
        h("span", null, "Series: ", seriesDefs.length),
        h("span", null, "Samples: ", data ? data.length : 0),
        h("label", { className: "monitor-points-pick" },
          h("span", null, "Points"),
          h("select", {
            value: String(maxPoints),
            onChange: (e) => setMaxPoints(Number(e.target.value)),
          },
            ...[50, 100, 200, 500, 1000, 2000, 5000].map((n) =>
              h("option", { key: n, value: String(n) }, String(n))
            )
          )
        )
      ),
      h("div", { className: "range-tabs" },
        ...RANGE_OPTS.map((opt) => h("button", {
          key: opt.label,
          className: rangeMs === opt.ms ? "active" : "",
          onClick: () => setRangeMs(opt.ms),
        }, opt.label))
      )
    )
  );
}

// Dashboard prefs (per-row, card-height, sample-count)
// ============================================================
// `yAxisAutoFit` — when true, chart Y-axes hug `[dataMin, dataMax]` so small
// variations are visible. When false (default) Recharts pads the domain with
// rounded ticks (`['auto', 'auto']`), giving more headroom but flattening
// small swings. Toggle from the Settings modal.
const DashPrefsCtx = React.createContext({ perRow: 2, cardHeight: 220, sampleCount: 20, yAxisAutoFit: false });
function useDashPrefs() { return React.useContext(DashPrefsCtx); }
function useDashSamples() { return useDashPrefs().sampleCount; }

const DEFAULT_DASH_PREFS = { perRow: 2, cardHeight: 220, sampleCount: 20, yAxisAutoFit: false };
function loadDashPrefs() {
  try {
    const raw = localStorage.getItem("tnlite-dash-prefs");
    if (raw) return { ...DEFAULT_DASH_PREFS, ...JSON.parse(raw) };
  } catch (_) {}
  return { ...DEFAULT_DASH_PREFS };
}
function saveDashPrefs(p) {
  try { localStorage.setItem("tnlite-dash-prefs", JSON.stringify(p)); } catch (_) {}
}

function StatusPill({ liveRows, transport }) {
  // Find newest ts.
  let newest = 0;
  for (const r of liveRows) {
    const t = Date.parse(r.ts_utc || 0);
    if (Number.isFinite(t) && t > newest) newest = t;
  }
  const age = newest ? Math.max(0, Date.now() - newest) : null;
  let label = "LIVE", cls = "status-online";
  if (age == null) { label = "LOADING"; cls = "status-muted"; }
  else if (age > 3000) { label = "STALE"; cls = "status-offline"; }
  else if (age > 1000) { label = "DELAYED"; cls = "status-warning"; }
  else if (transport !== "realtime") { label = "POLLING"; cls = "status-online"; }
  const fmt = (v) => v == null ? "—" : v < 1000 ? `${Math.round(v)} ms` : `${(v / 1000).toFixed(1)} s`;
  return h("span", { className: `status-pill ${cls}` },
    h("span", { className: "pill-dot" }),
    h("span", null, `${label} · ${fmt(age)}`)
  );
}

function DashboardView({ liveRows, profiles, active, activeKey, setActiveKey, prefs, setPrefs, gatewayLastSeen, onOpenDrawer, onOpenWidget }) {
  const [settingsOpen, setSettingsOpen] = useState(false);
  // ensure historian channel is up so chart widgets can append.
  useEffect(() => { ensureHistorianChannel(); }, []);

  const widgets = useMemo(() => {
    const ws = Array.isArray(active?.payload?.widgets) ? active.payload.widgets : [];
    return ws.filter((w) => w && !SKIPPED_TYPES.has(String(w.type || "")));
  }, [active]);

  // Honour the per_row saved in the dashboard payload (1..4) — this is
  // what the operator configured on the edge. Lite was ignoring it and
  // always reading the local "Cards per row" preference, which made the
  // cloud view look different from the desktop view. The user can still
  // override locally from the settings modal; profile per_row wins on
  // first load.
  const profilePerRow = useMemo(() => {
    const n = Number(active?.payload?.per_row);
    return Number.isFinite(n) && n >= 1 && n <= 4 ? Math.round(n) : null;
  }, [active]);
  const effectivePerRow = profilePerRow ?? prefs.perRow;

  const liveByKey = useMemo(() => {
    const m = new Map();
    for (const r of liveRows) m.set(`${r.gateway_id}|${r.tag_name}`, r);
    return m;
  }, [liveRows]);

  return h("div", null,
    h(DashboardToolbar, {
      widgetCount: widgets.length, profiles, activeKey, setActiveKey,
      prefs, setPrefs, gatewayLastSeen,
      settingsOpen, setSettingsOpen,
    }),
    h(DashboardSettingsModal, {
      open: settingsOpen, onClose: () => setSettingsOpen(false),
      profiles, activeKey, setActiveKey, prefs, setPrefs,
    }),
    widgets.length === 0 ?
      h("div", { className: "empty" },
        "No dashboard widgets have been published from the edge yet. ",
        "Configure widgets in the TrustNode desktop app and they will appear here.")
    :
      h("div", {
        className: `widget-flow per-row-${effectivePerRow}`,
      },
        ...widgets.map((w) => h(Widget, {
          key: w.id || `${w.type}-${w.config?.tag_name || Math.random()}`,
          widget: w,
          liveByKey,
          onOpen: onOpenDrawer,
          onOpenWidget,
        }))
      )
  );
}
