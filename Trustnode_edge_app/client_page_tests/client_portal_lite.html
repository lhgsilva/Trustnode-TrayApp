<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TrustNode — Client Portal</title>
  <!--
    TrustNode slim client portal.

    This single file is intended to be dropped on a customer subdomain
    (e.g. https://customer-a-trustnode.lsapps.app/index.html). It is
    deliberately small (no embedded SPA bundle) so it can be hosted on
    any plain web server and updated independently.

    What it does:
      1. Resolves the customer's tenant from the current hostname via
         /api/control-plane/portal-context.
      2. Renders a TrustNode-branded login page using the same dark
         navy/teal palette as the desktop app.
      3. After login, embeds the production cloud SPA from /portal/ in
         an iframe — passing the auth token so users see ONLY what
         their permissions allow (read-only customer view; admin
         features are server-side gated and never rendered for
         non-admin users).
      4. Opens a server-sent-events (SSE) stream to /api/cloud-live/stream
         to receive near-real-time tag updates. Dashboards inside the
         iframe receive them via postMessage and can refresh widgets
         immediately without polling.

    What it does NOT do:
      * never accepts service-role / database keys in the browser
      * never bypasses the cloud auth middleware
      * never talks directly to the database (only via /api/*)

    Tenant isolation:
      * The cloud backend resolves the tenant from the request Host
        header (Nginx vhost) and the auth token must match. A user
        from customer A who somehow obtains a token from customer B
        gets a 403 from every /api/* call.
  -->
  <style>
    :root {
      color-scheme: dark light;
      --bg: #0e1116;
      --card: #121821;
      --card_2: #1a2230;
      --text: #f0f3f7;
      --muted: #94a3b8;
      --stroke: rgba(255,255,255,0.10);
      --teal: #14a89a;
      --teal-deep: #0e8479;
      --danger: #dc2626;
    }
    [data-theme="light"] {
      --bg: #eef1f5;
      --card: #ffffff;
      --card_2: #f3f5f9;
      --text: #0e1116;
      --muted: #4a5566;
      --stroke: #d3dae3;
      --teal: #0e8479;
      --teal-deep: #0a5d56;
    }
    *,*::before,*::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .shell { display: flex; flex-direction: column; height: 100vh; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px;
      background: var(--card);
      border-bottom: 1px solid var(--stroke);
      gap: 12px;
      flex-shrink: 0;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .brand .logo {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: linear-gradient(135deg, var(--teal), var(--teal-deep));
      display: inline-block;
    }
    .brand small {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .topbar-right { display: inline-flex; align-items: center; gap: 10px; font-size: 12px; }
    .badge {
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .badge.live { background: rgba(20,168,154,0.16); color: var(--teal); border: 1px solid var(--teal); }
    .badge.idle { background: rgba(148,163,184,0.16); color: var(--muted); border: 1px solid var(--stroke); }
    .badge.error { background: rgba(220,38,38,0.16); color: var(--danger); border: 1px solid var(--danger); }
    .btn {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      background: var(--card_2);
      border: 1px solid var(--stroke);
      border-radius: 8px;
      cursor: pointer;
    }
    .btn:hover { border-color: var(--teal); color: var(--teal); }
    .btn-primary {
      background: var(--teal);
      color: #042026;
      border-color: var(--teal);
    }
    .btn-primary:hover { background: var(--teal-deep); }

    /* Login screen */
    .login {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .login-card {
      width: min(420px, 92vw);
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 24px 60px -20px rgba(0,0,0,0.55);
    }
    .login-card h1 {
      margin: 0 0 6px;
      font-size: 22px;
      letter-spacing: 0.5px;
    }
    .login-card .sub {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 13px;
    }
    .field { display: block; margin-bottom: 14px; }
    .field span {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      color: var(--text);
      background: var(--card_2);
      border: 1px solid var(--stroke);
      border-radius: 8px;
    }
    .field input:focus {
      outline: none;
      border-color: var(--teal);
      box-shadow: 0 0 0 2px rgba(20,168,154,0.25);
    }
    .login-error {
      margin: 10px 0 0;
      padding: 8px 10px;
      font-size: 12px;
      color: #fff;
      background: var(--danger);
      border-radius: 6px;
      display: none;
    }
    .login-error.show { display: block; }
    .login-actions { margin-top: 8px; }

    /* App iframe */
    .frame-host { flex: 1; display: flex; min-height: 0; }
    iframe.app-frame {
      flex: 1;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--bg);
    }
    .session-info { color: var(--muted); }
    .session-info b { color: var(--text); }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden></span>
        <span>TrustNode</span>
        <small id="tenantBadge">resolving…</small>
      </div>
      <div class="topbar-right">
        <span id="liveStatus" class="badge idle">connecting…</span>
        <span id="sessionInfo" class="session-info"></span>
        <button id="logoutBtn" class="btn" style="display:none">Sign out</button>
      </div>
    </div>

    <!-- Login screen -->
    <div id="loginView" class="login">
      <div class="login-card">
        <h1>Sign in</h1>
        <p class="sub" id="loginSubtitle">Loading customer context…</p>
        <label class="field">
          <span>Username</span>
          <input id="usernameInput" autocomplete="username" autofocus />
        </label>
        <label class="field">
          <span>Password</span>
          <input id="passwordInput" type="password" autocomplete="current-password" />
        </label>
        <div id="loginError" class="login-error"></div>
        <div class="login-actions">
          <button id="loginBtn" class="btn btn-primary" style="width:100%; padding:10px;">Sign in</button>
        </div>
      </div>
    </div>

    <!-- App iframe (hidden until logged in) -->
    <div id="appView" class="frame-host" style="display:none">
      <iframe
        id="appFrame"
        class="app-frame"
        title="TrustNode customer dashboard"
        sandbox="allow-forms allow-popups allow-scripts allow-same-origin"
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
    </div>
  </div>

<script>
(function () {
  // -------------------------------------------------------------------
  // Configuration: the customer subdomain itself IS the API base. The
  // operator can override with ?api_base=... for local testing.
  // -------------------------------------------------------------------
  const q = new URLSearchParams(window.location.search);
  const apiBase =
    (q.get("api_base") || "").trim().replace(/\/$/, "") ||
    window.location.origin.replace(/\/$/, "");

  // The cloud SPA bundle is served at /portal/ on the same host. The
  // operator can override (e.g. for white-label hosts) with ?portal=...
  const portalPath = (q.get("portal") || "/portal/").trim();

  // Local persistence keys (per-subdomain so a single browser can hold
  // multiple customer sessions without collision).
  const TOKEN_KEY = "tn_portal_token_" + window.location.host;
  const USER_KEY = "tn_portal_user_" + window.location.host;

  // -------------------------------------------------------------------
  // Tenant resolution (decorative; the actual security check is on the
  // server). Lets the login page show the customer name.
  // -------------------------------------------------------------------
  async function resolveTenantContext() {
    try {
      const r = await fetch(apiBase + "/api/control-plane/portal-context", {
        cache: "no-store",
      });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json();
      const badge = document.getElementById("tenantBadge");
      const sub = document.getElementById("loginSubtitle");
      if (j && j.tenant_name) {
        badge.textContent = j.tenant_name;
        sub.textContent = "Sign in to " + j.tenant_name + " — " + j.host;
      } else {
        badge.textContent = j && j.host ? j.host : window.location.host;
        sub.textContent = "Sign in to " + window.location.host;
      }
    } catch (e) {
      document.getElementById("tenantBadge").textContent = window.location.host;
      document.getElementById("loginSubtitle").textContent =
        "Sign in to " + window.location.host;
    }
  }

  // -------------------------------------------------------------------
  // Login
  // -------------------------------------------------------------------
  function showLoginError(message) {
    const el = document.getElementById("loginError");
    el.textContent = String(message || "Sign-in failed");
    el.classList.add("show");
  }
  function clearLoginError() {
    document.getElementById("loginError").classList.remove("show");
  }

  async function attemptLogin() {
    clearLoginError();
    const username = document.getElementById("usernameInput").value.trim();
    const password = document.getElementById("passwordInput").value;
    if (!username || !password) {
      showLoginError("Username and password required.");
      return;
    }
    try {
      const r = await fetch(apiBase + "/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) {
        showLoginError(j.detail || "Sign-in failed (HTTP " + r.status + ")");
        return;
      }
      if (!j.token) {
        showLoginError("No token returned by server.");
        return;
      }
      try {
        localStorage.setItem(TOKEN_KEY, j.token);
        localStorage.setItem(USER_KEY, JSON.stringify(j.user || {}));
      } catch (_) {}
      showApp(j.token, j.user || {});
    } catch (e) {
      showLoginError(String(e && e.message ? e.message : e));
    }
  }

  // -------------------------------------------------------------------
  // App view
  // -------------------------------------------------------------------
  function showApp(token, user) {
    document.getElementById("loginView").style.display = "none";
    document.getElementById("appView").style.display = "flex";
    document.getElementById("logoutBtn").style.display = "inline-block";

    const username = String(user && user.username ? user.username : "");
    const role = String(user && user.role ? user.role : "");
    document.getElementById("sessionInfo").innerHTML =
      "Signed in as <b>" + username + "</b>" +
      (role ? " <span style='color:var(--muted)'>(" + role + ")</span>" : "");

    // Load the production SPA. The token rides as a query param so the
    // SPA's existing auth bootstrap picks it up; cloud-side middleware
    // still validates every /api/* request, so this query string is a
    // hand-off, not a security boundary.
    const frame = document.getElementById("appFrame");
    const sep = portalPath.includes("?") ? "&" : "?";
    frame.src = portalPath + sep + "token=" + encodeURIComponent(token);

    // Open the SSE live stream. Bearer tokens cannot be sent in
    // EventSource headers, so we mint a short-lived ?token=... URL.
    openLiveStream(token);
  }

  function logout() {
    try {
      localStorage.removeItem(TOKEN_KEY);
      localStorage.removeItem(USER_KEY);
    } catch (_) {}
    if (window.__tnEventSource) {
      try { window.__tnEventSource.close(); } catch (_) {}
      window.__tnEventSource = null;
    }
    document.getElementById("loginView").style.display = "grid";
    document.getElementById("appView").style.display = "none";
    document.getElementById("logoutBtn").style.display = "none";
    document.getElementById("liveStatus").className = "badge idle";
    document.getElementById("liveStatus").textContent = "signed out";
    document.getElementById("appFrame").src = "about:blank";
    document.getElementById("sessionInfo").textContent = "";
    document.getElementById("passwordInput").value = "";
  }

  // -------------------------------------------------------------------
  // SSE live stream — push deltas from server to the iframe via
  // postMessage. The SPA picks them up and updates widgets without
  // waiting for its own polling cycle.
  // -------------------------------------------------------------------
  function openLiveStream(token) {
    const status = document.getElementById("liveStatus");
    status.className = "badge idle";
    status.textContent = "connecting…";
    try {
      // Token in query is acceptable here: the URL is opaque to the
      // user, and the same cloud-auth middleware validates the token
      // server-side. EventSource cannot set headers.
      const url =
        apiBase + "/api/cloud-live/stream?limit=200&token=" + encodeURIComponent(token);
      const es = new EventSource(url, { withCredentials: false });
      window.__tnEventSource = es;
      let lastEventMs = 0;

      es.addEventListener("open", function () {
        status.className = "badge live";
        status.textContent = "live";
      });
      es.addEventListener("error", function () {
        status.className = "badge error";
        status.textContent = "reconnecting…";
      });
      es.addEventListener("snapshot", function (ev) {
        try {
          const payload = JSON.parse(ev.data);
          postToFrame({ type: "tn.live.snapshot", payload });
          lastEventMs = Date.now();
        } catch (_) {}
      });
      es.addEventListener("delta", function (ev) {
        try {
          const payload = JSON.parse(ev.data);
          postToFrame({ type: "tn.live.delta", payload });
          lastEventMs = Date.now();
        } catch (_) {}
      });

      // If we go more than 30s without any event the badge dims, but
      // EventSource will keep retrying on its own.
      setInterval(function () {
        if (Date.now() - lastEventMs > 30000 && status.className.indexOf("error") < 0) {
          status.className = "badge idle";
          status.textContent = "idle";
        }
      }, 5000);
    } catch (e) {
      status.className = "badge error";
      status.textContent = "stream off";
    }
  }

  function postToFrame(message) {
    const frame = document.getElementById("appFrame");
    if (!frame || !frame.contentWindow) return;
    try {
      // Same-origin: the iframe lives under the same customer subdomain.
      frame.contentWindow.postMessage(message, window.location.origin);
    } catch (_) {}
  }

  // -------------------------------------------------------------------
  // Auto-restore: if we already hold a valid token from a previous
  // visit, skip the login form.
  // -------------------------------------------------------------------
  function tryAutoRestore() {
    let token = "";
    let user = {};
    try {
      token = localStorage.getItem(TOKEN_KEY) || "";
      user = JSON.parse(localStorage.getItem(USER_KEY) || "{}");
    } catch (_) {}
    if (!token) return false;
    // Validate by calling /api/auth/me.
    fetch(apiBase + "/api/auth/me", {
      headers: { Authorization: "Bearer " + token },
      cache: "no-store",
    })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (j) {
        showApp(token, j || user);
      })
      .catch(function () {
        try {
          localStorage.removeItem(TOKEN_KEY);
          localStorage.removeItem(USER_KEY);
        } catch (_) {}
      });
    return true;
  }

  // Bind events.
  document.getElementById("loginBtn").addEventListener("click", attemptLogin);
  document.getElementById("passwordInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter") attemptLogin();
  });
  document.getElementById("logoutBtn").addEventListener("click", logout);

  resolveTenantContext();
  tryAutoRestore();
})();
</script>
</body>
</html>
