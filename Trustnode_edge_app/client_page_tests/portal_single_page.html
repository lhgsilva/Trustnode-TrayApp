<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Trustnode Portal - Single Page (HTML)</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin:0; height:100%; background:#111; font-family:Segoe UI, Arial, sans-serif; }
    .shell { height:100%; display:flex; flex-direction:column; }
    .bar { height:42px; display:flex; align-items:center; justify-content:space-between; padding:0 12px; background:#1e1e1e; border-bottom:1px solid #2f2f2f; color:#d4d4d4; }
    .bar a { color:#4fc3f7; text-decoration:none; font-size:12px; }
    .frame { flex:1; width:100%; border:0; background:#111; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="bar">
      <strong>Trustnode Developer Portal</strong>
      <a id="openRaw" href="#" target="_blank" rel="noopener">Open raw portal</a>
    </div>
    <iframe id="portalFrame" class="frame" title="Trustnode Portal"></iframe>
  </div>
  <script>
    (function () {
      const p = new URLSearchParams(window.location.search);
      const host = p.get('portalHost') || window.location.origin;
      const path = p.get('portalPath') || '/portal';
      const qs = p.get('qs') || '';
      const src = host.replace(/\/$/, '') + path + (qs ? ('?' + qs) : '');
      const frame = document.getElementById('portalFrame');
      const link = document.getElementById('openRaw');
      frame.src = src;
      link.href = src;
    })();
  </script>
</body>
</html>
