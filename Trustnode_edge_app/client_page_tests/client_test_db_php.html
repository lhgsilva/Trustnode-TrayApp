<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TrustNode Hosted Client (DB via PHP Endpoint)</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root { --bg:#1e1e1e; --header:#000; --header-text:#d4d4d4; --card:#252526; --stroke:#3c3c3c; --text:#d4d4d4; --muted:#9da0a6; --brand:#007acc; --ok:#2ea043; --danger:#d1242f; --sidebar:#252526; --sidebar-text:#d4d4d4; --nav-active:#094771; --row:#2a2d2e; }
    [data-theme="light"] { --bg:#f3f3f3; --header:#2d2d30; --header-text:#d4d4d4; --card:#eceff3; --stroke:#c5ccd6; --text:#1f2328; --muted:#5f6b7a; --brand:#007acc; --ok:#2ea043; --danger:#d1242f; --sidebar:#252526; --sidebar-text:#d4d4d4; --nav-active:#094771; --row:#e5eaf0; }
    *{box-sizing:border-box} html,body{height:100%} body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI","Trebuchet MS",sans-serif}
    .shell{display:grid;grid-template-rows:58px 1fr;height:100%}.header{background:var(--header);color:var(--header-text);border-bottom:1px solid #1f1f1f;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;gap:10px}
    .main{display:grid;grid-template-columns:230px 1fr;min-height:0}.sidebar{background:var(--sidebar);color:var(--sidebar-text);border-right:1px solid #333;padding:10px;overflow:auto}.content{overflow:auto;padding:12px}
    .nav-btn{width:100%;text-align:left;padding:10px;border:1px solid transparent;background:transparent;color:inherit;border-radius:8px;cursor:pointer;margin-bottom:4px}.nav-btn.active{background:var(--nav-active);color:#fff}
    .card{background:var(--card);border:1px solid var(--stroke);border-radius:12px;padding:12px;margin-bottom:12px}.card-title{margin:0 0 10px 0;font-size:18px}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.form-grid{display:grid;gap:10px;grid-template-columns:repeat(4,minmax(140px,1fr))}
    label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)} input,select,button{background:transparent;color:var(--text);border:1px solid var(--stroke);border-radius:8px;padding:8px 10px}
    .btn{background:var(--brand);color:#fff;border-color:var(--brand)} .kpis{display:grid;gap:10px;grid-template-columns:repeat(6,minmax(120px,1fr))}.kpi{border:1px solid var(--stroke);border-radius:10px;padding:10px}.kpi .t{font-size:12px;color:var(--muted)}.kpi .v{font-size:22px;font-weight:700}
    .split{display:grid;grid-template-columns:2fr 1fr;gap:10px}.chart-wrap{height:300px}.table-wrap{max-height:420px;overflow:auto} table{width:100%;border-collapse:collapse} th,td{padding:7px 6px;border-bottom:1px solid var(--stroke);font-size:13px;text-align:left;white-space:nowrap} tbody tr:nth-child(odd){background:var(--row)}
    .hidden{display:none!important}.status{border:1px solid var(--stroke);border-radius:999px;padding:4px 10px;font-size:12px}.status.ok{color:#b6f3bf;background:rgba(46,160,67,.2)}.status.bad{color:#ffd7d9;background:rgba(209,36,47,.2)} .warn{font-size:12px;color:#ffd7d9}
    @media (max-width:1000px){.main{grid-template-columns:1fr}.sidebar{display:flex;overflow:auto;gap:6px}.nav-btn{min-width:170px}.split,.kpis,.form-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div id="auth" class="card" style="max-width:900px;margin:40px auto">
  <h2 class="card-title">Connect to DB PHP Endpoint</h2>
  <div class="form-grid">
    <label>DB PHP Endpoint<input id="dbPhp" value="/client/client_test_db.php" /></label>
    <label>Live interval (ms)<input id="liveMs" value="2000" /></label>
    <label>Historian interval (ms)<input id="histMs" value="4500" /></label>
    <label>Power interval (ms)<input id="powMs" value="2500" /></label>
  </div>
  <div class="row" style="margin-top:10px"><button id="connect" class="btn">Connect</button><button id="toggleTheme">Theme</button><span id="authMsg" class="warn"></span></div>
</div>

<div id="app" class="shell hidden">
  <div class="header"><div>Trustnode Hosted Single File (DB PHP)</div><div class="row"><span id="conn" class="status bad">DISCONNECTED</span><button id="theme2">Theme</button></div></div>
  <div class="main">
    <aside class="sidebar"><button class="nav-btn active" data-page="dashboard">Dashboard</button><button class="nav-btn" data-page="reporting">Reporting</button><button class="nav-btn" data-page="historian">Historian</button><button class="nav-btn" data-page="power">Power</button></aside>
    <section class="content">
      <div id="page-dashboard"><div class="card kpis"><div class="kpi"><div class="t">Rows</div><div class="v" id="dRows">-</div></div><div class="kpi"><div class="t">Gateways</div><div class="v" id="dGw">-</div></div><div class="kpi"><div class="t">Devices</div><div class="v" id="dDev">-</div></div><div class="kpi"><div class="t">Avg Age(s)</div><div class="v" id="dAge">-</div></div><div class="kpi"><div class="t">Last Value</div><div class="v" id="dVal">-</div></div><div class="kpi"><div class="t">Last Ts</div><div class="v" id="dTs">-</div></div></div><div class="card"><div class="chart-wrap"><canvas id="cDash"></canvas></div></div></div>
      <div id="page-reporting" class="hidden"><div class="card row"><input id="rTag" placeholder="tag contains" /><select id="rAgg"><option value="raw">RAW</option><option value="minute">MIN</option><option value="hour">HOUR</option><option value="day">DAY</option></select><select id="rMethod"><option value="avg">AVG</option><option value="sum">SUM</option><option value="min">MIN</option><option value="max">MAX</option></select><button id="rLoad" class="btn">Load</button></div><div class="split"><div class="card"><div class="chart-wrap"><canvas id="cRep"></canvas></div></div><div class="card table-wrap"><table><thead><tr><th>Ts</th><th>Value</th></tr></thead><tbody id="rBody"></tbody></table></div></div></div>
      <div id="page-historian" class="hidden"><div class="card row"><input id="hTag" placeholder="tag filter" /><button id="hLoad" class="btn">Refresh</button><button id="hCsv" class="btn">CSV</button></div><div class="card table-wrap"><table><thead><tr><th>Timestamp</th><th>Gateway</th><th>Tag</th><th>Value</th></tr></thead><tbody id="hBody"></tbody></table></div></div>
      <div id="page-power" class="hidden"><div class="card row"><select id="pMetric"><option value="active_power_w">Active Power</option><option value="energy_wh">Energy</option><option value="voltage_v">Voltage</option><option value="current_a">Current</option></select><select id="pType"><option value="line">Line</option><option value="bar">Bar</option></select></div><div class="split"><div class="card"><div class="chart-wrap"><canvas id="cPow"></canvas></div></div><div class="card"><div class="chart-wrap"><canvas id="cPow2"></canvas></div></div></div></div>
    </section>
  </div>
</div>

<script>
(() => {
  const S={rows:[],hist:[],rep:[],timers:[]};
  const E=id=>document.getElementById(id);
  const ts=v=>{const d=new Date(v);if(Number.isNaN(d.getTime()))return String(v||'');const p=x=>String(x).padStart(2,'0');return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;};
  const n=v=>Number.isFinite(Number(v))?Number(v).toFixed(3):'-';
  const csv=(rows)=>{if(!rows.length)return '';const cols=Object.keys(rows[0]);const esc=x=>`"${String(x??'').replaceAll('"','""')}"`;return [cols.join(','),...rows.map(r=>cols.map(c=>esc(r[c])).join(','))].join('\n');};
  const dl=(name,txt)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
  const uniq=(rows)=>{const m=new Map();(rows||[]).forEach(r=>{const k=`${r.ts}|${r.gateway_id||''}|${r.tag||''}`;if(!m.has(k))m.set(k,r);});return [...m.values()].sort((a,b)=>new Date(a.ts)-new Date(b.ts));};
  const req=async(q)=>{const ep=(E('dbPhp').value||'/client/client_test_db.php').trim();const r=await fetch(`${ep}?dbq=${q}`,{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json();};

  async function loadLive(){const d=await req('live&limit=800');S.rows=uniq(d.rows||[]);renderDashboard();}
  async function loadHist(){const needle=(E('hTag').value||'').trim();const d=await req(`historian&limit=1200&tag=${encodeURIComponent(needle)}`);S.hist=uniq(d.rows||[]).reverse();renderHistorian();}
  async function loadPower(){const d=await req('power_history&limit=320');const rows=uniq((d.rows||[]).map(r=>({ts:r.ts, ...r.values})));renderPower(rows);}

  function aggregate(rows,interval,method){ if(interval==='raw') return rows.map(r=>({ts:ts(r.ts),value:Number(r.value)})).filter(x=>Number.isFinite(x.value)); const b=new Map(); rows.forEach(r=>{const d=new Date(r.ts),v=Number(r.value); if(Number.isNaN(d.getTime())||!Number.isFinite(v))return; let k=''; if(interval==='minute')k=`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()} ${d.getHours()}:${d.getMinutes()}`; if(interval==='hour')k=`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()} ${d.getHours()}:00`; if(interval==='day')k=`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; const a=b.get(k)||[];a.push(v);b.set(k,a);}); return [...b.entries()].map(([k,a])=>{let v=a[a.length-1]; if(method==='sum')v=a.reduce((x,y)=>x+y,0); else if(method==='min')v=Math.min(...a); else if(method==='max')v=Math.max(...a); else v=a.reduce((x,y)=>x+y,0)/a.length; return {ts:k,value:v};}); }

  function renderDashboard(){const rows=S.rows; E('dRows').textContent=String(rows.length); E('dGw').textContent=String(new Set(rows.map(r=>r.gateway_id||r.gateway_name||'')).size); E('dDev').textContent=String(new Set(rows.map(r=>r.device_name||'')).size); const age=rows.length?rows.map(r=>Math.max(0,(Date.now()-Date.parse(r.ts))/1000)).reduce((a,b)=>a+b,0)/rows.length:NaN; E('dAge').textContent=Number.isFinite(age)?age.toFixed(2):'-'; E('dVal').textContent=rows.length?n(rows[rows.length-1].value):'-'; E('dTs').textContent=rows.length?ts(rows[rows.length-1].ts):'-'; const byTs=new Map(); rows.forEach(r=>{const k=ts(r.ts),v=Number(r.value);if(!Number.isFinite(v))return;const a=byTs.get(k)||[];a.push(v);byTs.set(k,a);}); const labels=[...byTs.keys()].slice(-140), vals=labels.map(k=>{const a=byTs.get(k)||[];return a.length?a.reduce((x,y)=>x+y,0)/a.length:null;}); charts.dash.data.labels=labels; charts.dash.data.datasets[0].data=vals; charts.dash.update('none');}
  function renderHistorian(){ E('hBody').innerHTML=S.hist.slice(0,1600).map(r=>`<tr><td>${ts(r.ts)}</td><td>${r.gateway_name||r.gateway_id||'-'}</td><td>${r.tag||'-'}</td><td>${n(r.value)}</td></tr>`).join(''); }
  function renderReporting(){ const needle=(E('rTag').value||'').toLowerCase(); const rows=S.hist.filter(r=>!needle||String(r.tag||'').toLowerCase().includes(needle)); const series=aggregate(rows,E('rAgg').value,E('rMethod').value).slice(-260); S.rep=series; charts.rep.data.labels=series.map(x=>x.ts); charts.rep.data.datasets[0].data=series.map(x=>x.value); charts.rep.update('none'); E('rBody').innerHTML=series.slice(-150).map(x=>`<tr><td>${x.ts}</td><td>${n(x.value)}</td></tr>`).join(''); }
  function renderPower(rows){ const metric=E('pMetric').value; const type=E('pType').value; const labels=rows.map(r=>ts(r.ts)).slice(-160); const vals=rows.map(r=>Number(r[metric])).slice(-160); const eVals=rows.map(r=>Number(r.energy_wh)).slice(-160); charts.pow.config.type=type; charts.pow.data.labels=labels; charts.pow.data.datasets[0].label=metric; charts.pow.data.datasets[0].data=vals; charts.pow.update('none'); charts.pow2.data.labels=labels; charts.pow2.data.datasets[0].data=eVals.map(v=>Number.isFinite(v)?v/1000:null); charts.pow2.update('none'); }

  async function refresh(){ await Promise.all([loadLive(), loadHist(), loadPower()]); renderReporting(); E('conn').className='status ok'; E('conn').textContent='CONNECTED'; }
  function timers(){ S.timers.forEach(clearInterval); S.timers=[]; const vis=()=>document.visibilityState==='visible'; const liveMs=Math.max(500,Number(E('liveMs').value||2000)); const histMs=Math.max(1000,Number(E('histMs').value||4500)); const powMs=Math.max(500,Number(E('powMs').value||2500)); S.timers.push(setInterval(()=>vis()&&loadLive().catch(()=>{}),liveMs)); S.timers.push(setInterval(()=>vis()&&loadHist().catch(()=>{}),histMs)); S.timers.push(setInterval(()=>vis()&&loadPower().catch(()=>{}),powMs)); }
  function page(p){ ['dashboard','reporting','historian','power'].forEach(x=>E(`page-${x}`).classList.toggle('hidden',x!==p)); document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===p)); }

  const charts={
    dash:new Chart(E('cDash'),{type:'line',data:{labels:[],datasets:[{label:'Live',data:[],borderColor:'#22c55e',pointRadius:0,tension:.25}]},options:{responsive:true,maintainAspectRatio:false,animation:false,parsing:false}}),
    rep:new Chart(E('cRep'),{type:'line',data:{labels:[],datasets:[{label:'Report',data:[],borderColor:'#0ea5e9',pointRadius:0,tension:.2}]},options:{responsive:true,maintainAspectRatio:false,animation:false,parsing:false}}),
    pow:new Chart(E('cPow'),{type:'line',data:{labels:[],datasets:[{label:'Power',data:[],borderColor:'#16a34a',backgroundColor:'rgba(22,163,74,.3)'}]},options:{responsive:true,maintainAspectRatio:false,animation:false,parsing:false}}),
    pow2:new Chart(E('cPow2'),{type:'bar',data:{labels:[],datasets:[{label:'Energy kWh',data:[],backgroundColor:'#0284c7'}]},options:{responsive:true,maintainAspectRatio:false,animation:false,parsing:false}})
  };

  E('connect').onclick=()=>refresh().then(()=>{timers();E('auth').classList.add('hidden');E('app').classList.remove('hidden');}).catch(e=>E('authMsg').textContent=e.message);
  E('toggleTheme').onclick=E('theme2').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light';};
  document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>page(b.dataset.page));
  E('hLoad').onclick=()=>loadHist().catch(()=>{}); E('rLoad').onclick=renderReporting; E('pMetric').onchange=()=>loadPower().catch(()=>{}); E('pType').onchange=()=>loadPower().catch(()=>{});
  E('hCsv').onclick=()=>dl(`historian_${Date.now()}.csv`, csv(S.hist.map(r=>({timestamp:ts(r.ts),gateway:r.gateway_name||r.gateway_id||'',tag:r.tag||'',value:n(r.value)}))));
})();
</script>
</body>
</html>
