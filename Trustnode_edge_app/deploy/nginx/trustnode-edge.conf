# trustnode-edge.conf — production nginx vhost
# Mirror of /etc/nginx/conf.d/trustnode-edge.conf on the VPS.
# Keep this file in sync; CI deploy should rsync it to the VPS.
#
# Notable additions (Jun 21, 2026): explicit location ^~ /developer-portal/
# block — without it nginx falls through to the SPA root index and breaks
# the developer portal in browsers (MIME type mismatch on JS modules).

server {
    server_name trustnode.lsapps.app customer-a-trustnode.lsapps.app customer-b-trustnode.lsapps.app customer-c-trustnode.lsapps.app;

    client_max_body_size 25m;
    root /var/www/trustnode;
    index index.html;
    # TRUSTNODE_PERF_BEGIN — gzip + immutable cache for fingerprinted assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/json
        application/wasm
        application/xml
        font/woff2
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    # TRUSTNODE_PERF_END

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 60;
    }
    # TRUSTNODE_LITE_BEGIN
    location = /lite { return 301 /lite/; }
    # lite-config-override: serve config.json from /etc/trustnode so CI deploys cannot wipe it
    location = /lite/config.json {
        alias /etc/trustnode/lite-config.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    location /lite/ {
        try_files $uri $uri/ /lite/index.html;
    }
    # TRUSTNODE_LITE_END
    # TRUSTNODE_CLIENT_PHP_BEGIN
    location /client/ {
        try_files $uri $uri/ /client/client_test.html;
    }
    location ~ ^/client/.*\.php$ {
        root /var/www/trustnode;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index client_test.php;
        fastcgi_pass unix:/run/php-fpm/www.sock;
    }
    # TRUSTNODE_CLIENT_PHP_END

    location /ws/ {
        proxy_pass http://127.0.0.1:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600;
    }


    # Operator 2026-06-21: explicit serve for /developer-portal/. The committed
    # developer-portal/index.html references its JS via absolute /assets/...
    # paths; without this block nginx falls through to the SPA root and
    # serves the WRONG index, breaking module MIME types in the browser.
    location ^~ /developer-portal/ {
        try_files /developer-portal/index.html =404;
    }
    location = /developer-portal {
        return 301 /developer-portal/;
    }

    location / {
        try_files $uri /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/trustnode.lsapps.app/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/trustnode.lsapps.app/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot




}

server {
    if ($host = customer-c-trustnode.lsapps.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = customer-b-trustnode.lsapps.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = customer-a-trustnode.lsapps.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = trustnode.lsapps.app) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name trustnode.lsapps.app customer-a-trustnode.lsapps.app customer-b-trustnode.lsapps.app customer-c-trustnode.lsapps.app;
    return 404;








}
